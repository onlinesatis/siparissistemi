.mode-toggle{display:flex;gap:8px;margin-bottom:14px;}

.mode-btn.active.iade-active{border-color:var(--danger);color:var(--danger);background:#fef2f2;}
.scan-box label{color:#fff;font-size:14px;font-weight:600;display:block;margin-bottom:10px;}
.scan-box input{width:100%;padding:16px;border-radius:10px;border:none;font-size:20px;text-align:center;font-weight:700;letter-spacing:1px;}
.scan-box input:focus{outline:3px solid var(--orange);}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;}
.empty-icon{font-size:48px;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-size:11px;text-transform:uppercase;}
.prod-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}

.prod-row .noimg{background:#eef1f5;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px;text-align:center;}

.prod-row .price{margin-left:auto;font-weight:700;font-size:15px;white-space:nowrap;}

.btn.secondary{background:var(--navy);}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ================= BARKOD ÇİZİMİ (ana programla aynı mantık) ================= */
function code39Pattern(ch){
  const table = {
    '0':'000110100','1':'100100001','2':'001100001','3':'101100000',
    '4':'000110001','5':'100110000','6':'001110000','7':'000100101',
    '8':'100100100','9':'001100100','*':'010010100'
  };
  return table[ch] || table['0'];
}
function renderCode39Bars(svgId, value, opts){
  opts = opts || {};
  const height = opts.height || 50;
  const narrow = opts.narrow || 2;
  const wide = narrow*3;
  const gap = narrow;
  const digits = String(value).replace(/[^0-9]/g,'') || '0';
  const chars = ('*'+digits+'*').split('');
  const rects = [];
  let x = 4;
  chars.forEach((ch,ci)=>{
    const pattern = code39Pattern(ch);
    for(let i=0;i<pattern.length;i++){
      const isBar = i%2===0;
      const w = pattern[i]==='1' ? wide : narrow;
      if(isBar) rects.push('<rect x="'+x+'" y="0" width="'+w+'" height="'+height+'" fill="#000"/>');
      x += w;
    }
    if(ci < chars.length-1) x += gap;
  });
  x += 4;
  const svg = document.getElementById(svgId);
  if(svg){
    svg.setAttribute('width', x);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', '0 0 '+x+' '+height);
    svg.innerHTML = rects.join('');
  }
  return x;
}
function safeRenderBarcode(svgId, value, opts){
  try{ return renderCode39Bars(svgId, value, opts); }
  catch(e){
    const el = document.getElementById(svgId);
    if(el) el.outerHTML = '<div style="font-family:monospace;font-size:15px;font-weight:700;letter-spacing:2px;border:1px dashed #999;padding:8px;">'+esc(value)+'</div>';
    return null;
  }
}
function renderJustifiedDigits(elId, value, width){
  const el = document.getElementById(elId);
  if(!el) return;
  el.style.width = (width||160)+'px';
  el.style.display = 'flex';
  el.style.justifyContent = 'space-between';
  el.style.margin = '6px auto 0';
  el.innerHTML = String(value).split('').map(d=>'<span>'+esc(d)+'</span>').join('');
}

/* ================= EXANS TASARIMLI FİŞ (ana programla birebir aynı) ================= */

    '</div>'+
    '<div class="ship-top">'+
      '<div class="ship-recipient">'+
        '<h3>Alıcı Bilgileri</h3>'+
        (c&&c.phone? '<div class="ship-warning">📞 NOT: Herhangi bir sorun olduğunda '+esc(c.phone)+' numaralı telefonu arayınız.<br><b style="font-size:12px;">LÜTFEN BU NUMARAYI ARAYINIZ</b></div>':'')+
        '<div class="ship-row"><span class="ship-label">Sipariş No</span><span class="ship-colon">:</span><span>'+esc(order.orderNo)+'</span></div>'+
        '<div class="ship-row" style="margin-top:4px;margin-bottom:8px;"><span class="ship-label" style="font-size:18px;">Ad-Soyad</span><span class="ship-colon" style="font-size:18px;">:</span><span style="font-size:26px;font-weight:900;color:#000;">'+esc(c?c.name:'—')+'</span></div>'+
        '<div class="ship-row"><span class="ship-label">Telefon</span><span class="ship-colon">:</span><span>'+esc(c?c.phone:'—')+'</span></div>'+
        '<div class="ship-row" style="margin-top:6px;"><span class="ship-label" style="font-size:16px;">Adres</span><span class="ship-colon" style="font-size:16px;">:</span><span style="font-size:16px;font-weight:800;color:#000;">'+esc(c&&c.address?c.address:'—')+'</span></div>'+
      '</div>'+
      '<div class="ship-barcode-box">'+
        '<h3>Kargo Kodu</h3>'+
        '<svg id="printBarcodeSvg" style="max-width:100%;width:190px;height:auto;"></svg>'+
        '<div id="barcodeValueBox" class="ship-barcode-value"></div>'+
        '<div style="margin-top:14px;" id="printQrCodeCanvas"></div>'+
      '</div>'+
    '</div>'+
    '<div class="ship-products">'+
      '<h3>Ürün Bilgileri</h3>'+
      productsHtml+
    '</div>'+
    '<div class="ship-toplam-box">'+
      '<span class="ship-toplam-label">TOPLAM</span>'+
      '<span class="ship-toplam-value">'+fmtMoneyFull(order.total)+'</span>'+
    '</div>'+
  '</div>';
}
function renderShipDocBarcodeAndQr(order){
  const barW = safeRenderBarcode('printBarcodeSvg', order.barcode, {height:32,narrow:1.3,displayValue:false});
  const barcodeSvgEl = document.getElementById('printBarcodeSvg');
  const actualBarW = barcodeSvgEl ? barcodeSvgEl.getBoundingClientRect().width : barW;
  renderJustifiedDigits('barcodeValueBox', order.barcode, actualBarW);

  const qrData = window.location.href.split('/').slice(0,-1).join('/') + '/calisan.html?order=' + order.orderNo;
  const qrContainer = document.getElementById('printQrCodeCanvas');
  if(qrContainer){
    qrContainer.innerHTML = '';
    try{ new QRCode(qrContainer, {text: qrData, width:85, height:85, correctLevel: QRCode.CorrectLevel.L}); }
    catch(e){ console.log('QR hatası:', e); }
  }
}

function findOrder(code){
  const orders = cloudData.orders || [];
  // 1) QR formatı: siparişNo|telefon
  if(code.includes('|')){
    const orderNo = parseInt(code.split('|')[0]);
    const found = orders.find(o=>o.orderNo===orderNo);
    if(found) return found;
  }
  // 2) Sipariş barkodu (o.barcode)
  let found = orders.find(o=>o.barcode===code);
  if(found) return found;
  // 3) Ürün barkodu okutulduysa, o ürünü içeren en son "Yeni/Hazırlanıyor" siparişi bul
  const products = cloudData.products || [];
  const prod = products.find(p=>p.barcode===code);
  if(prod){
    const withProd = orders.filter(o=>(o.items||[]).some(i=>i.productId===prod.id) && (o.status==='Yeni'||o.status==='Hazırlanıyor'));
    if(withProd.length) return withProd[withProd.length-1];
  }
  return null;
}

    '<div style="font-size:20px;font-weight:800;color:'+st.color+';">'+st.icon+' '+st.text+'</div>';
  if(order.subeAdi){
    cargoDetailHtml += '<div style="margin-top:8px;font-size:14px;">📍 Şu an: <b>'+esc(order.subeAdi)+'</b> Aras Kargo şubesinde</div>';
  }
  if(order.cargo){
    cargoDetailHtml += '<div style="margin-top:6px;font-size:13px;color:var(--muted);">Kargo Firması: '+esc(order.cargo)+'</div>';
  }
  if(order.tracking){
    cargoDetailHtml += '<div style="margin-top:4px;font-size:13px;color:var(--muted);">Takip No: '+esc(order.tracking)+'</div>';
  }
  cargoDetailHtml += '</div>';

  document.getElementById('result').innerHTML =
    bannerHtml+
    cargoDetailHtml+
    '<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">'+
        '<h2 style="margin:0;">Sipariş #'+esc(order.orderNo)+'</h2>'+
        '<span class="pill">'+esc(order.status||'—')+'</span>'+
      '</div>'+
      '<table>'+
        '<tr><th>Ad Soyad</th><td>'+esc(c?c.name:'—')+'</td></tr>'+
        '<tr><th>Telefon</th><td>'+esc(c?c.phone:'—')+'</td></tr>'+
        '<tr><th>Adres</th><td>'+esc(c&&c.address?c.address:'—')+'</td></tr>'+
      '</table>'+
    '</div>'+
    '<div class="card">'+
      '<h2 style="margin-top:0;">Ürünler</h2>'+
      itemsHtml+
      '<div style="text-align:right;margin-top:14px;font-size:18px;"><b>Toplam: '+fmtMoney(order.total)+'</b></div>'+
    '</div>'+
    '<button class="btn no-print" onclick="printOrderNow(currentDisplayedOrder)">🖨️ Fişi Yazdır</button>'+
    '<button class="btn secondary no-print" onclick="clearResult()">✕ Temizle, Yeni Barkod Okut</button>';
}

let currentMode = 'hazirlama';
let cameraStream = null;
let cameraActive = false;
let jsQRLoaded = false;

function loadJsQR(){
  return new Promise((resolve)=>{
    if(typeof jsQR !== 'undefined'){ jsQRLoaded = true; resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    script.onload = ()=>{ jsQRLoaded = true; resolve(); };
    script.onerror = resolve;
    document.head.appendChild(script);
  });
}
// Kamera kütüphanesini sayfa açılır açılmaz, butona basmadan ÖNCE hazırla
loadJsQR();

async function toggleCamera(){
  if(cameraActive){
    stopCamera();
    return;
  }
  // getUserMedia'yı tıklama anından hemen çağır (aradan zaman geçerse bazı telefonlar izni reddediyor)
  const video = document.getElementById('cameraVideo');
  const area = document.getElementById('cameraArea');
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = cameraStream;
    video.setAttribute('muted', '');
    video.muted = true;
    video.play();
    area.style.display = 'block';
    document.getElementById('cameraBtn').textContent = '✕ Kamerayı Kapat';
    cameraActive = true;
    if(!jsQRLoaded) await loadJsQR();
    requestAnimationFrame(cameraScanLoop);
  }catch(e){
    document.getElementById('result').innerHTML =
      '<div class="status-msg status-err">❌ Kameraya erişilemedi: '+esc(e.message||e.name||'bilinmeyen hata')+'</div>'+
      '<div class="empty"><div class="empty-icon">🔒</div>Tarayıcı ayarlarından bu siteye kamera izni verildiğinden emin ol, sonra tekrar dene.</div>';
  }
}

function stopCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
  document.getElementById('cameraArea').style.display = 'none';
  document.getElementById('cameraBtn').textContent = '📷 Telefon Kamerasıyla Tara';
  cameraActive = false;
}

function cameraScanLoop(){
  if(!cameraActive) return;
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  if(video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR !== 'undefined'){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if(code){
      if(navigator.vibrate) navigator.vibrate(100);
      stopCamera();
      processScannedCode(code.data);
      return;
    }
  }
  requestAnimationFrame(cameraScanLoop);
}

function processScannedCode(rawData){
  // QR bir URL ise (http/https ile başlıyorsa, dosya adı ne olursa olsun), içindeki ?order= kısmını çıkar
  let code = rawData;
  try{
    if(rawData.startsWith('http://') || rawData.startsWith('https://')){
      const url = new URL(rawData);
      const orderNo = url.searchParams.get('order');
      if(orderNo){
        const order = (cloudData.orders||[]).find(o=>String(o.orderNo)===String(orderNo));
        if(order){
          if(currentMode === 'iade') markOrderAsReturned(order); else showOrder(order);
          return;
        } else {
          document.getElementById('result').innerHTML =
            '<div class="status-msg status-err">❌ Sipariş #'+esc(orderNo)+' bulunamadı (bulutta henüz yok ya da bağlantı yavaş)</div>'+
            '<div class="empty"><div class="empty-icon">⏳</div>Birkaç saniye bekleyip tekrar dene.</div>';
          return;
        }
      }
    }
  }catch(e){}
  // Değilse direkt barkod/QR verisi olarak işle
  const order = findOrder(code);
  if(order){
    if(currentMode === 'iade') markOrderAsReturned(order); else showOrder(order);
    return;
  }

  // Telefon numarası gibi görünüyorsa (çoğunlukla rakam, en az 7 hane), müşteri telefonuna göre ara
  const digits = code.replace(/[^0-9]/g,'');
  if(digits.length >= 7){
    const customers = cloudData.customers || [];
    const matchedCustomers = customers.filter(c => (c.phone||'').replace(/[^0-9]/g,'').includes(digits));
    if(matchedCustomers.length){
      const matchedIds = matchedCustomers.map(c=>c.id);
      const matchedOrders = (cloudData.orders||[]).filter(o => matchedIds.includes(o.customerId))
        .sort((a,b) => new Date(b.date) - new Date(a.date));
      if(matchedOrders.length === 1){
        if(currentMode === 'iade') markOrderAsReturned(matchedOrders[0]); else showOrder(matchedOrders[0]);
        return;
      } else if(matchedOrders.length > 1){
        showOrderPickList(matchedOrders, customers);
        return;
      }
    }
  }

  document.getElementById('result').innerHTML =
    '<div class="status-msg status-err">❌ Bu barkoda ait sipariş bulunamadı: '+esc(code)+'</div>'+
      '<div class="empty"><div class="empty-icon">🤔</div>Barkodu kontrol edip tekrar dene.</div>';
}

function showOrderPickList(orders, customers){
  let html = '<div class="status-msg status-ok">📋 Bu telefona ait '+orders.length+' sipariş bulundu, birini seç:</div>';
  html += '<div class="card">';
  orders.forEach(o=>{
    const c = customers.find(x=>x.id===o.customerId);
    html += '<div onclick="pickOrderFromList(\''+o.id+'\')" style="padding:12px 6px;cursor:pointer;border-bottom:1px solid var(--line);">'+
      '<b>Sipariş #'+esc(o.orderNo)+'</b> — '+esc(c?c.name:'—')+
      '<div style="font-size:12px;color:var(--muted);margin-top:2px;">'+new Date(o.date).toLocaleDateString('tr-TR')+' · '+esc(o.status)+' · '+fmtMoney(o.total)+'</div>'+
    '</div>';
  });
  html += '</div>';
  document.getElementById('result').innerHTML = html;
}
function pickOrderFromList(orderId){
  const order = (cloudData.orders||[]).find(o=>o.id===orderId);
  if(!order) return;
  if(currentMode === 'iade') markOrderAsReturned(order); else showOrder(order);
}

function setMode(mode){
  currentMode = mode;
  document.getElementById('modeHazirlamaBtn').classList.toggle('active', mode==='hazirlama');
  document.getElementById('modeIadeBtn').classList.toggle('active', mode==='iade');
  document.getElementById('modeIadeBtn').classList.toggle('iade-active', mode==='iade');
  const scanBox = document.querySelector('.scan-box');
  const label = document.getElementById('scanLabel');
  if(mode==='iade'){
    scanBox.style.background = 'var(--danger)';
    label.textContent = '↩️ İade barkodunu okut — otomatik iade olarak işaretlenecek';
  } else {
    scanBox.style.background = 'var(--navy)';
    label.textContent = '🔍 Barkodu okut (okuyucu otomatik yazar)';
  }
  clearResult();
}

function markOrderAsReturned(order){
  const orders = cloudData.orders || [];
  const idx = orders.findIndex(o=>o.id===order.id);
  if(idx === -1) return;

  const kargoUcreti = cloudData.kargoUcreti || 260;
  orders[idx].status = 'İade Edildi';
  if(!orders[idx].returns) orders[idx].returns = [];
  const zatenEklendi = orders[idx].returns.some(r => r.source === 'personel-tarama');
  if(!zatenEklendi){
    (orders[idx].items||[]).forEach((item, itemIdx) => {
      orders[idx].returns.push({
        id: 'ret_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
        date: new Date().toISOString(), type: 'iade',
        name: item.name, color: item.color, size: item.size, qty: item.qty, price: item.price,
        returnCargoPrice: itemIdx === 0 ? kargoUcreti : 0,
        note: 'Personel barkod taramasıyla otomatik iade kaydı',
        source: 'personel-tarama', received: true
      });
    });
  }

  // Müşteriyi kara listeye al
  const customers = cloudData.customers || [];
  const cIdx = customers.findIndex(c=>c.id===order.customerId);
  if(cIdx !== -1 && !customers[cIdx].blacklisted){
    customers[cIdx].blacklisted = true;
    customers[cIdx].blacklistReason = 'İade Yapılan Müşteri';
    customers[cIdx].blacklistDate = new Date().toLocaleDateString('tr-TR');
  }

  // Buluta yaz
  fbDb.ref('magazamData/orders').set(orders).then(()=>{
    const iadeBanner = '<div class="status-msg status-err">↩️ Sipariş #'+esc(order.orderNo)+' İADE olarak işaretlendi ve kaydedildi</div>';
    showOrder(orders[idx], iadeBanner);
  }).catch((e)=>{
    document.getElementById('result').innerHTML =
      '<div class="status-msg status-err">❌ Kayıt hatası, internet bağlantını kontrol et: '+esc(e.message)+'</div>';
  });
  if(cIdx !== -1) fbDb.ref('magazamData/customers').set(customers);
}

function clearResult(){
  document.getElementById('result').innerHTML =
    '<div class="empty"><div class="empty-icon">📷</div>Sipariş barkodunu okutunca detaylar burada görünecek.</div>';
  const inp = document.getElementById('scanInput');
  inp.value = '';
  inp.focus();
}

document.getElementById('scanInput').addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const code = this.value.trim();
  this.value = '';
  if(!code) return;
  processScannedCode(code);
});

// Sadece boş alana (buton/input olmayan yere) tıklanınca barkod kutusuna odaklan
document.addEventListener('click', function(e){
  if(e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'VIDEO') return;
  if(cameraActive) return;
  document.getElementById('scanInput').focus();
});

// URL üzerinden ?order=1005 ile açıldıysa (QR'dan geldiyse) o siparişi otomatik göster
window.addEventListener('load', function(){
  document.getElementById('scanInput').focus();
  const params = new URLSearchParams(window.location.search);
  const orderNo = params.get('order');
  if(orderNo){
    document.getElementById('result').innerHTML =
      '<div class="status-msg status-ok">⏳ Sipariş #'+esc(orderNo)+' aranıyor...</div>';
    let found = false;
    const checkInterval = setInterval(()=>{
      if((cloudData.orders||[]).length > 0){
        const order = (cloudData.orders||[]).find(o=>String(o.orderNo)===String(orderNo));
        if(order){
          found = true;
          clearInterval(checkInterval);
          if(currentMode === 'iade') markOrderAsReturned(order); else showOrder(order);
        }
      }
    }, 300);
    setTimeout(()=>{
      clearInterval(checkInterval);
      if(!found){
        document.getElementById('result').innerHTML =
          '<div class="status-msg status-err">❌ Sipariş #'+esc(orderNo)+' bulunamadı</div>'+
          '<div class="empty"><div class="empty-icon">🤔</div>Bu sipariş silinmiş olabilir, ya da internet bağlantısı yavaş — sayfayı yenileyip tekrar dene.</div>';
      }
    }, 6000);
  }
});
