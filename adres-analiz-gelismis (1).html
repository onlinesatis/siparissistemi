<style>
:root{
  --navy:#0f2547; --navy-2:#16345f; --orange:#ff7a3d; --orange-dark:#e8631f;
  --bg:#f2f4f7; --card:#ffffff; --text:#1c2b3a; --muted:#6b7a8d; --line:#e3e7ee;
  --ok:#1f9d55; --warn:#e0a800; --danger:#d64545;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
header{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
header .sub{font-size:11px;opacity:.75;margin-top:2px;}
#lowstock-badge{background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;cursor:pointer;display:none;}
nav{display:flex;overflow-x:auto;background:var(--navy);border-top:1px solid rgba(255,255,255,.08);position:sticky;top:56px;z-index:19;}
nav button{flex:1 0 auto;background:none;border:none;color:#c9d4e2;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin:6px 4px;border-radius:10px;background:rgba(255,255,255,.06);}
nav button.active{color:#fff;background:var(--orange);border-color:var(--orange);font-weight:800;}
main{max-width:980px;margin:0 auto;padding:16px;padding-bottom:70px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;margin:0 0 12px;color:var(--navy);}
.grid{display:grid;gap:10px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:640px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600;}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--text);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:var(--orange);}
button.btn{background:var(--orange);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
button.btn:hover{background:var(--orange-dark);}
button.btn.secondary{background:var(--navy);}
button.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);font-weight:600;}

button:disabled{opacity:.5;cursor:not-allowed;}

th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);}

<script>
/* ÖNEMLİ: Eski Service Worker'ı (varsa) otomatik olarak kaldır - günlerdir yaşanan
   "güncelleme görünmüyor" sorununun asıl sebebi buydu. Bu kod, tarayıcıda kayıtlı
   kalmış eski Service Worker'ı bulup siler, bir daha hiç kaydetmiyoruz. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(registrations){
    for(let reg of registrations){ reg.unregister(); }
  });
  if('caches' in window){
    caches.keys().then(function(names){
      names.forEach(function(name){ caches.delete(name); });
    });
  }
}
/* ================= STATE ================= */
let state = {
  shopName: "Mağazam",
  nextOrderNo: 1001,
  nextBarcode: 1,
  kargoUcreti: 260,
  products: [],
  customers: [],
  orders: [],
  adBudget: {
    dailyAmount: 0,
    startDate: '',
    endDate: '',
    active: false,
    totalSpent: 0,
    shipmentCount: 0
  },
  wholesalePurchases: [],
  customToptanciKategoriler: [],
  cargoPayments: []
};

let currentUser = {
  role: 'admin', // ✅ Otomatik admin
  name: 'Yönetici'
};

/* ================= FIREBASE CONFIG ================= */
// Test amaçlı: localStorage kullanarak mock Firebase
let firebaseReady = true; // localStorage var olduğu için her zaman hazır

/* ================= FIREBASE FONKSIYONLARI (localStorage ile) ================= */
async function loadStateFromFirebase(userEmail){
  try{
    const backupKey = 'firebase-backup-' + userEmail.toLowerCase();
    const backupData = localStorage.getItem(backupKey);
    if(!backupData){
      toast('Bu e-posta için yedek bulunamadı');
      return false;
    }
    const backup = JSON.parse(backupData);
    const parsed = JSON.parse(backup.data);
    state = Object.assign(state, parsed);
    localStorage.setItem('app-user-id', userEmail);
    localStorage.setItem('siparis-app-data', JSON.stringify(state));
    toast('Veriler yedeklemeden yüklendi ✅');
    renderMain();
    return true;
  }catch(e){
    console.log('Yükleme hatası:', e.message);
    toast('Yükleme başarısız: ' + e.message);
    return false;
  }
}

async function backupToFirebase(){
  try{
    const userId = localStorage.getItem('app-user-id') || 'default-user';
    const backupKey = 'firebase-backup-' + userId.toLowerCase();
    const backup = {
      data: JSON.stringify(state),
      timestamp: new Date().toISOString(),
      shopName: state.shopName
    };
    localStorage.setItem(backupKey, JSON.stringify(backup));
    toast('Veriler yedeklendi ✅');
    return true;
  }catch(e){
    console.log('Yedekleme hatası:', e.message);
    toast('Yedekleme başarısız: ' + e.message);
    return false;
  }
}
function nextBarcodeValue(){
  // "869" + sıralı 6 haneli sayaç (869000001, 869000002...) - kaç sipariş/ürün çıktığını
  // son rakamlara bakarak kolayca sayabilesin diye. Çakışma ihtimaline karşı, üretilen kod
  // mevcut barkodlardan biriyle aynıysa otomatik bir sonrakine atlanır (garanti benzersizlik).
  const existing = new Set();
  (state.orders||[]).forEach(o=>{ if(o.barcode) existing.add(o.barcode); });
  (state.products||[]).forEach(p=>{ if(p.barcode) existing.add(p.barcode); });
  let code;
  do{
    code = '869' + String(state.nextBarcode).padStart(6,'0');
    state.nextBarcode++;
  } while(existing.has(code));
  return code;
}
let ui = { 
  tab: 'panel', 
  sub: '', 
  editingOrder: null, 
  reklamStartDate: '', 
  reklamEndDate: '',
  iadeCustomerId: null,
  openReturnForCustomer: false
};
let selectedOrders = new Set(); // Seçilen siparişler
let selectedProducts = new Set(); // Seçilen ürünler

const STATUSES = ["Yeni","Hazırlanıyor","Kargoya Verildi","Teslim Edildi","İptal Edildi","İade Edildi"];
const STATUS_CLASS = {"Yeni":"yeni","Hazırlanıyor":"hazir","Kargoya Verildi":"kargo","Teslim Edildi":"teslim","İptal Edildi":"iptal","İade Edildi":"iptal"};

function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function compressImage(file, maxW){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('okunamadı'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('görsel yüklenemedi'));
      img.onload = ()=>{
        const scale = Math.min(1, (maxW||480)/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function fmtMoney(n){ return (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺'; }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleDateString('tr-TR')+' '+dt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ return new Date().toISOString(); }

/* ================= PERSISTENCE ================= */
/* ---- FIREBASE GERÇEK BULUT SENKRONİZASYONU ---- */
const firebaseConfig = {
  apiKey: "AIzaSyB3ftIDymHCtHkldL_nk4FtSyvMYDfxv3U",
  authDomain: "exans35.firebaseapp.com",
  databaseURL: "https://exans35-default-rtdb.firebaseio.com",
  projectId: "exans35",
  storageBucket: "exans35.firebasestorage.app",
  messagingSenderId: "701070447690",
  appId: "1:701070447690:web:3faf0b316383fd5df3c2b3"
};
let fbDb = null, fbReady = false, fbApplyingRemote = false, fbSaveTimer = null, fbAuthed = false;
try{
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.database();
    fbReady = true;
  }
}catch(e){ console.error('Firebase başlatılamadı:', e); }

// Veriye erişmeden önce anonim (görünmez, şifresiz) giriş yap - güvenlik kuralları bunu şart koşuyor
function fbEnsureAuth(){
  return new Promise((resolve)=>{
    if(!fbReady){ resolve(false); return; }
    if(fbAuthed){ resolve(true); return; }
    firebase.auth().onAuthStateChanged((user)=>{
      if(user){ fbAuthed = true; resolve(true); }
    });
    firebase.auth().signInAnonymously()
      .catch((e)=>{ console.error('Firebase auth hatası:', e.code||e.message); resolve(false); });
  });
}

function fbListenForChanges(){
  if(!fbReady) return;
  fbDb.ref('magazamData').on('value', (snapshot)=>{
    const data = snapshot.val();
    if(data){
      fbApplyingRemote = true;
      state = Object.assign(state, data);
      try{ localStorage.setItem('siparis-app-data', JSON.stringify(state)); }catch(e){}
      if(typeof renderNav==='function') renderNav();
      if(typeof renderMain==='function') renderMain();
      fbApplyingRemote = false;
    }
  }, (err)=>{ console.error('Firebase dinleme hatası:', err); });
}
function fbPushState(){
  if(!fbReady || fbApplyingRemote) return;
  clearTimeout(fbSaveTimer);
  fbSaveTimer = setTimeout(async ()=>{
    await fbEnsureAuth();
    fbDb.ref('magazamData').set(state).catch(e=>console.error('Firebase kayıt hatası:', e));
  }, 700);
}

async function loadState(){
  try{
    const r = await window.storage.get('app-data', false);
    if(r && r.value){ state = Object.assign(state, JSON.parse(r.value)); }
  }catch(e){
    const local = localStorage.getItem('siparis-app-data');
    if(local){ try{ state = Object.assign(state, JSON.parse(local)); }catch(_){} }
  }
  
  // Firebase'den gerçek bulut verisini çek (varsa üzerine yazar - tüm cihazlar aynı veriyi görsün)
  // ÖNEMLİ: Bazı ortamlarda (örn. kısıtlı önizleme pencereleri) Firebase bağlantısı hiç yanıt vermeyebilir.
  // Bu yüzden en fazla 4 saniye bekleriz, sonra ne olursa olsun devam ederiz - uygulama asla sonsuza dek takılı kalmaz.
  if(fbReady){
    try{
      const authTimeout = new Promise((resolve)=>setTimeout(()=>resolve(false), 3000));
      await Promise.race([fbEnsureAuth(), authTimeout]);
      const timeoutPromise = new Promise((resolve)=>setTimeout(()=>resolve(null), 4000));
      const snap = await Promise.race([fbDb.ref('magazamData').once('value'), timeoutPromise]);
      const cloudData = snap ? snap.val() : null;
      if(cloudData){ state = Object.assign(state, cloudData); }
    }catch(e){ console.error('Firebase okuma hatası:', e); }
    try{ fbListenForChanges(); }catch(e){ console.error('Firebase dinleme kurulamadı:', e); }
  }
  
  migrateIadeKargoUcreti();
  migrateGidenKargoUcreti();
  // Eski büyük barkod sayacı kalmışsa (869000010000 gibi) mantıklı bir değere sıfırla
  if(!state.nextBarcode || state.nextBarcode > 1000000){
    state.nextBarcode = 1;
    saveState();
  }
}

// Eski iade kayıtlarında kargo ücreti 0/boş kalmışsa 260₺ olarak düzelt (bir kereye mahsus, kalıcı)
function migrateIadeKargoUcreti(){
  let degisti = false;
  (state.orders||[]).forEach(o=>{
    (o.returns||[]).forEach(r=>{
      if(r.type==='iade' && (!r.returnCargoPrice || r.returnCargoPrice===0)){
        r.returnCargoPrice = state.kargoUcreti;
        degisti = true;
      }
    });
  });
  if(degisti) saveState();
}
// Eski siparişlerde giden kargo ücreti 0/boş kalmışsa sabit ücrete (260₺) tamamla (bir kereye mahsus, kalıcı)
function migrateGidenKargoUcreti(){
  let degisti = false;
  (state.orders||[]).forEach(o=>{
    if(!o.cargoPrice || o.cargoPrice===0){
      o.cargoPrice = state.kargoUcreti;
      degisti = true;
    }
  });
  if(degisti) saveState();
}

function variantKey(color,size){ return (color||'-')+'|'+(size||'-'); }
function getStock(product,color,size){
  if(product && product.isComposite && product.components && product.components.length){
    // Bileşik ürün (Takım): stok = en kısıtlayıcı bileşene göre kaç tam takım yapılabileceği
    return Math.min(...product.components.map(comp=>{
      const cp = state.products.find(x=>x.id===comp.productId);
      if(!cp) return 0;
      const compStock = (cp.stock && cp.stock[variantKey(comp.color||'-', comp.size||'-')]) || 0;
      return Math.floor(compStock / (comp.qtyPerUnit||1));
    }));
  }
  return (product.stock && product.stock[variantKey(color,size)]) || 0;
}
function setStock(product,color,size,qty){ if(!product.stock) product.stock = {}; product.stock[variantKey(color,size)] = qty; }
function deductStockForItem(product, item){
  if(!product) return;
  if(item.isCompositeSale && item.chosenComponents){
    // Satış anında her parça için AYRI AYRI seçilen renk/beden kullanılır (örn. Üst S + Alt M)
    item.chosenComponents.forEach(comp=>{
      const cp = state.products.find(x=>x.id===comp.productId);
      if(cp) setStock(cp, comp.color||'-', comp.size||'-', getStock(cp, comp.color||'-', comp.size||'-') - (comp.qtyPerUnit||1)*item.qty);
    });
  } else if(product.isComposite && product.components && product.components.length){
    // Satış anında özel seçim yapılmadıysa, ürün tanımındaki varsayılan bileşen bedenlerini kullan
    product.components.forEach(comp=>{
      const cp = state.products.find(x=>x.id===comp.productId);
      if(cp) setStock(cp, comp.color||'-', comp.size||'-', getStock(cp, comp.color||'-', comp.size||'-') - (comp.qtyPerUnit||1)*item.qty);
    });
  } else {
    setStock(product, item.color, item.size, getStock(product, item.color, item.size) - item.qty);
  }
}
function productVariants(product){
  const colors = (product.colors && product.colors.length) ? product.colors : ['-'];
  const sizes = (product.sizes && product.sizes.length) ? product.sizes : ['-'];
  const out=[];
  colors.forEach(c=>sizes.forEach(s=>out.push({color:c,size:s})));
  return out;
}
function unitProfit(p){ return (p.price||0) - (p.purchasePrice||0) - (p.extraCost||0); }
function lowStockList(){
  const out=[];
  state.products.forEach(p=>{
    productVariants(p).forEach(v=>{
      const q = getStock(p,v.color,v.size);
      if(q <= (p.lowThreshold ?? 3)) out.push({product:p, color:v.color, size:v.size, qty:q});
    });
  });
  return out;
}

const TURKIYE_ILLER = ['Adana','Adıyaman','Afyonkarahisar','Ağrı','Amasya','Ankara','Antalya','Artvin','Aydın','Balıkesir','Bilecik','Bingöl','Bitlis','Bolu','Burdur','Bursa','Çanakkale','Çankırı','Çorum','Denizli','Diyarbakır','Edirne','Elazığ','Erzincan','Erzurum','Eskişehir','Gaziantep','Giresun','Gümüşhane','Hakkari','Hatay','Isparta','Mersin','İstanbul','İzmir','Kars','Kastamonu','Kayseri','Kırklareli','Kırşehir','Kocaeli','Konya','Kütahya','Malatya','Manisa','Kahramanmaraş','Mardin','Muğla','Muş','Nevşehir','Niğde','Ordu','Rize','Sakarya','Samsun','Siirt','Sinop','Sivas','Tekirdağ','Tokat','Trabzon','Tunceli','Şanlıurfa','Uşak','Van','Yozgat','Zonguldak','Aksaray','Bayburt','Karaman','Kırıkkale','Batman','Şırnak','Bartın','Ardahan','Iğdır','Yalova','Karabük','Kilis','Osmaniye','Düzce'];
function turkceKucult(s){
  return (s||'').replace(/İ/g,'i').replace(/I/g,'ı').toLocaleLowerCase('tr');
}
function extractCityDistrictFromAddress(address, existingCity, existingDistrict){
  let city = existingCity || '';
  let district = existingDistrict || '';
  if(!address) return {city, district};
  const addrLower = turkceKucult(address);
  const words = address.split(/\s+/).filter(Boolean);
  const stopWords = ['mahallesi','mah','sokak','sk','cadde','cad','no','daire','apt','kat','blok','sitesi','bulvarı','bulvar'];

  function isValidCandidate(w){
    if(!w) return false;
    const clean = w.replace(/[^a-zçğıöşüA-ZÇĞİÖŞÜ]/g,'');
    if(clean.length < 3) return false; // çok kısa (örn. "No", "47" gibi) reddet
    if(/\d/.test(w)) return false; // içinde rakam varsa (telefon parçası, adres no'su vb.) reddet
    if(stopWords.includes(turkceKucult(clean))) return false;
    return true;
  }

  if(!city){
    for(const il of TURKIYE_ILLER){
      const ilLower = turkceKucult(il);
      const bChar = String.fromCharCode(92)+'b';
      const regex = new RegExp(bChar+ilLower+bChar, 'i');
      if(regex.test(addrLower)){
        city = il;
        if(!district){
          const wordsLower = words.map(w=>turkceKucult(w));
          const ilCleanLower = ilLower.replace(/[^a-zçğıöşü]/gi,'');
          const cityWordIdx = wordsLower.findIndex(w=>w.replace(/[^a-zçğıöşü]/gi,'')===ilCleanLower);
          if(cityWordIdx > -1){
            // Önce ÖNCESİNDEKİ kelimeyi dene, olmazsa SONRASINDAKİ kelimeyi dene (adres formatı değişebiliyor)
            const before = cityWordIdx > 0 ? words[cityWordIdx-1].replace(/[\/,.]/g,'') : null;
            const after = cityWordIdx < words.length-1 ? words[cityWordIdx+1].replace(/[\/,.]/g,'') : null;
            if(isValidCandidate(before)) district = before;
            else if(isValidCandidate(after)) district = after;
          }
        }
        break;
      }
    }
  }
  return {city, district};
}
function analyzeAddressForCityDistrict(){
  const addressEl = document.getElementById('o_address');
  const cityEl = document.getElementById('o_city');
  const districtEl = document.getElementById('o_district');
  if(!addressEl) return;
  const address = addressEl.value;
  if(!address.trim()){ toast('❌ Önce adresi yapıştır/yaz'); return; }

  const result = extractCityDistrictFromAddress(address, '', '');
  let found = [];
  if(result.city){ cityEl.value = result.city; found.push('İl: '+result.city); }
  if(result.district){ districtEl.value = result.district; found.push('İlçe: '+result.district); }

  if(found.length) toast('✅ Otomatik dolduruldu — '+found.join(', '));
  else toast('⚠️ Adreste il/ilçe bulunamadı, elle girmen gerekebilir');
}
function downloadSelectedOrdersCargoFormat(){
  if(selectedOrders.size === 0){ toast('Seçilen sipariş yok'); return; }

  const list = Array.from(selectedOrders).map(id => state.orders.find(o=>o.id===id)).filter(Boolean);
  const dateStr = new Date().toLocaleDateString('tr-TR');
  const rows = [];

  list.forEach(o=>{
    const c = state.customers.find(x=>x.id===o.customerId);
    const urunAdi = o.items.map(i=>i.name+' ('+i.color+'/'+i.size+') x'+i.qty).join(', ');
    const toplamAdet = o.items.reduce((s,i)=>s+i.qty,0);

    const extracted = extractCityDistrictFromAddress(c?c.address:'', c?c.city:'', c?c.district:'');

    // Telefonu, örnek şablondaki gibi (başında 0/90 olmadan, 10 haneli sayı) formatla
    let phoneDigits = c && c.phone ? c.phone.replace(/[^0-9]/g,'') : '';
    if(phoneDigits.startsWith('90') && phoneDigits.length > 10) phoneDigits = phoneDigits.slice(2);
    if(phoneDigits.startsWith('0') && phoneDigits.length > 10) phoneDigits = phoneDigits.slice(1);
    const phoneNum = phoneDigits ? parseInt(phoneDigits) : '';

    rows.push({
      'İSİM': c ? c.name.toLocaleUpperCase('tr') : '',
      'İLÇE': extracted.district ? extracted.district.toLocaleUpperCase('tr') : '',
      'İL': extracted.city ? extracted.city.toLocaleUpperCase('tr') : '',
      'ADERES': c && c.address ? c.address.toLocaleUpperCase('tr') : '',

      'KURYE': o.cargo || '',
      'MUŞ BARKOD': o.barcode || '',
      'FİYAT': o.total,
      'ÜRÜN ADI': urunAdi,
      'ADET': toplamAdet,
      'DESİ': '',
      'AMBALAJ': '',
      'TAHSİLAT': o.total,

      'KDV': '',
      'SİPARİŞ NO': o.orderNo,

  });

  if(!rows.length){ toast('Seçilen siparişlerde ürün yok'); return; }

  const wb = XLSX.utils.book_new();

  XLSX.writeFile(wb, 'kargo-listesi-'+dateStr.replace(/\./g,'-')+'.xlsx');

function handleCargoPaymentExcelUpload(evt){
  const resultBox = document.getElementById('cargoExcelResult');
  const file = evt.target.files[0];
  if(!file){
    if(resultBox) resultBox.innerHTML = '<div class="status-msg status-err">❌ Dosya seçilmedi.</div>';
    return;
  }
  if(resultBox) resultBox.innerHTML = '<div class="status-msg status-ok">⏳ Dosya okunuyor: '+esc(file.name)+'...</div>';

  const reader = new FileReader();
  reader.onerror = function(){
    if(resultBox) resultBox.innerHTML = '<div class="status-msg status-err">❌ Dosya okuma hatası.</div>';
  };
  reader.onload = function(e){
    try{
      let text = e.target.result;
      if(typeof text !== 'string' || !text.length){
        if(resultBox) resultBox.innerHTML = '<div class="status-msg status-err">❌ Dosya içeriği boş veya okunamayan bir formatta.</div>';
        return;
      }
      text = text.replace(/^\uFEFF/, '').trim();

      let arrRows; // header dahil, dizi-içinde-dizi formatında
      if(text.startsWith('<?xml') || text.indexOf('ss:Workbook') !== -1 || text.indexOf('urn:schemas-microsoft-com:office:spreadsheet') !== -1){
        arrRows = parseArasSpreadsheetXML(text);
      } else {
        const wb = XLSX.read(text, {type:'binary'});
        const sheetName = wb.SheetNames[0];
        const sheet = wb.Sheets[sheetName];
        arrRows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      }

      if(!arrRows || arrRows.length < 2){
        if(resultBox) resultBox.innerHTML = '<div class="status-msg status-err">❌ Dosyada okunabilir satır bulunamadı.</div>';
        return;
      }

      // Header satırını isimlere göre objeye çeviriyoruz ki analyzeCargoExcelRows kolayca kullanabilsin
      const header = arrRows[0].map(h=>String(h||'').trim());
      const objRows = arrRows.slice(1).map(r=>{
        const obj = {};
        header.forEach((key,i)=>{ obj[key] = r[i]!=null ? r[i] : ''; });
        return obj;
      });

      analyzeCargoExcelRows(objRows);
    }catch(err){
      if(resultBox) resultBox.innerHTML = '<div class="status-msg status-err"><b>❌ Analiz hatası:</b> '+esc(err.message)+'</div>';
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function parseTutarValue(v){
  if(v == null || v === '') return 0;
  if(typeof v === 'number') return v;
  return parseFloat(String(v).replace(/\./g,'').replace(',','.')) || 0;
}
function isRealDateValue(v){
  if(v == null) return false;
  const s = String(v).trim();
  if(!s) return false;
  if(s === '00:00:00') return false; // Excel'de boş tarih genelde bu şekilde görünüyor
  return true;
}

function analyzeCargoExcelRows(rows){
  const today = todayISO().slice(0,10);
  let paidNow = 0, alreadyPaid = 0, waiting = 0, returned = 0, notFound = 0, amountMismatch = [];
  const notFoundNames = [];

  rows.forEach(row=>{
    // Sütun isimleri kargo firmasına göre değişebilir, birkaç olası isimle deneriz
    const siparisNo = row['Sipariş No'] || row['Siparis No'] || row['SiparişNo'] || '';
    const aliciAdi = row['Alıcı Adı Soyadı'] || row['Alici Adi Soyadi'] || row['Alıcı'] || '';
    const telefon = row['Telefon'] || '';
    const tutar = parseTutarValue(row['Tutar']);
    const durum = (row['Durum'] || '').toString();
    const odemeTarihi = row['Ödeme Tarihi'] || row['Odeme Tarihi'] || '';

    // 1) Sipariş numarasıyla eşleştirmeyi dene (en güvenilir)
    let order = null;
    if(siparisNo){
      order = state.orders.find(o => String(o.orderNo) === String(siparisNo).trim());
    }
    // 2) Bulunamadıysa telefonla dene
    if(!order && telefon){
      const digits = String(telefon).replace(/[^0-9]/g,'');
      if(digits.length >= 7){
        const cust = state.customers.find(c => (c.phone||'').replace(/[^0-9]/g,'').includes(digits));
        if(cust){
          order = state.orders.filter(o=>o.customerId===cust.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
        }
      }
    }
    // 3) Son çare isimle dene
    if(!order && aliciAdi){
      const normName = normalizeNameStr(aliciAdi);
      const cust = state.customers.find(c => normalizeNameStr(c.name) === normName);
      if(cust){
        order = state.orders.filter(o=>o.customerId===cust.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      }
    }

    if(!order){
      notFound++;
      notFoundNames.push(aliciAdi || siparisNo || '(isimsiz satır)');
      return;
    }

    // Tutar uyuşmazlığı kontrolü (siparişin toplamıyla kargonun bildirdiği tutar arasında fark varsa - 0 dahil, çünkü 0 gelmesi de bir sorun işareti olabilir)
    if(Math.abs(tutar - order.total) > 1){
      amountMismatch.push({name: aliciAdi || (state.customers.find(c=>c.id===order.customerId)||{}).name, orderNo: order.orderNo, expected: order.total, cargo: tutar});
    }

    // İade durumu
    if(durum.includes('İade') || durum.includes('Iade')){
      returned++;
      return;
    }

    // Ödeme durumu
    if(order.paymentReceived){
      alreadyPaid++;
    } else if(isRealDateValue(odemeTarihi)){
      order.paymentReceived = true;
      order.paymentReceivedDate = today;
      paidNow++;
    } else {
      waiting++;
    }
  });

  saveState();

  let html = '<div class="status-msg status-ok">✅ Analiz tamamlandı — '+rows.length+' satır okundu.</div>'+
    '<div class="grid cols-2" style="gap:8px;margin-top:10px;">'+
      '<div style="background:#f0fdf4;padding:10px;border-radius:8px;text-align:center;"><b style="color:#10B981;font-size:18px;">'+paidNow+'</b><div style="font-size:11px;color:var(--muted);">✅ Yeni Ödendi İşaretlendi</div></div>'+
      '<div style="background:#eef6ff;padding:10px;border-radius:8px;text-align:center;"><b style="color:#2196F3;font-size:18px;">'+alreadyPaid+'</b><div style="font-size:11px;color:var(--muted);">Zaten Ödenmiş</div></div>'+
      '<div style="background:#fff8e1;padding:10px;border-radius:8px;text-align:center;"><b style="color:#F59E0B;font-size:18px;">'+waiting+'</b><div style="font-size:11px;color:var(--muted);">⏳ Hâlâ Bekliyor</div></div>'+
      '<div style="background:#f5f5f5;padding:10px;border-radius:8px;text-align:center;"><b style="color:#6b7a8d;font-size:18px;">'+returned+'</b><div style="font-size:11px;color:var(--muted);">↩️ İade</div></div>'+
    '</div>';

  if(notFound){
    html += '<div class="status-msg status-err" style="margin-top:10px;">❌ '+notFound+' satır eşleştirilemedi (sistemde kaydı bulunamadı):<br>'+notFoundNames.slice(0,15).map(n=>esc(n)).join('<br>')+(notFoundNames.length>15?'<br>...ve '+(notFoundNames.length-15)+' tane daha':'')+'</div>';
  }
  if(amountMismatch.length){
    html += '<div class="status-msg status-err" style="margin-top:10px;">⚠️ '+amountMismatch.length+' siparişte TUTAR UYUŞMAZLIĞI var:<br>'+
      amountMismatch.slice(0,10).map(m=>esc(m.name)+' (#'+m.orderNo+'): beklenen '+fmtMoney(m.expected)+' ≠ kargo bildirdi '+fmtMoney(m.cargo)).join('<br>')+
    '</div>';
  }

  document.getElementById('cargoExcelResult').innerHTML = html;
  lastCargoExcelAnalysisHtml = html;
  renderMain();
}

function normalizeNameStr(s){
  return (s||'').toLowerCase()
    .replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}
function matchCargoPaymentNames(){
  const raw = document.getElementById('cargoNameList').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let matchedCount = 0;
  const unmatched = [];
  const today = todayISO().slice(0,10);

  lines.forEach(line=>{
    // Satırın sonundaki olası tutarı (sayı) ayır, sadece isim kısmını kullan
    const amountMatch = line.match(/[\d.,]+\s*(tl|₺)?\s*$/i);
    const namepart = amountMatch ? line.slice(0, amountMatch.index).replace(/[-–:]\s*$/,'').trim() : line;
    const normLine = normalizeNameStr(namepart);
    if(!normLine){ return; }

    const customer = state.customers.find(c=>{
      const normC = normalizeNameStr(c.name);
      return normC === normLine || normC.includes(normLine) || normLine.includes(normC);
    });

    if(customer){
      const custOrders = state.orders.filter(o=>o.customerId===customer.id && (o.status==='Teslim Edildi'||o.status==='Kargoya Verildi') && !o.paymentReceived)
        .sort((a,b)=>new Date(b.date)-new Date(a.date));
      if(custOrders.length){
        custOrders[0].paymentReceived = true;
        custOrders[0].paymentReceivedDate = today;
        matchedCount++;
      } else {
        unmatched.push(namepart+' (uygun sipariş bulunamadı, zaten işaretli olabilir)');
      }
    } else {
      unmatched.push(namepart+' (müşteri bulunamadı)');
    }
  });

  saveState();
  const resultBox = document.getElementById('cargoMatchResult');
  if(resultBox){
    resultBox.innerHTML =
      (matchedCount ? '<div class="status-msg status-ok">✅ '+matchedCount+' isim eşleşti, ödemesi geldi olarak işaretlendi.</div>' : '')+
      (unmatched.length ? '<div class="status-msg status-err">❌ Eşleşmeyenler ('+unmatched.length+'):<br>'+unmatched.map(u=>esc(u)).join('<br>')+'</div>' : '');
  }
  renderMain();
}
function markOrderPaymentReceived(orderId){
  const o = state.orders.find(x=>x.id===orderId);
  if(!o) return;
  o.paymentReceived = true;
  o.paymentReceivedDate = todayISO().slice(0,10);
  saveState(); toast('✅ Ödeme geldi olarak işaretlendi'); renderMain();
}

function saveKargoPayment(){
  const amount = parseFloat(document.getElementById('cp_amount').value)||0;
  const entry = {
    id: uid('cp'),
    date: document.getElementById('cp_date').value || todayISO().slice(0,10),
    amount,
    note: document.getElementById('cp_note').value.trim()
  };
  if(!state.cargoPayments) state.cargoPayments = [];
  state.cargoPayments.push(entry);
  saveState(); closeModal(); toast('✅ Kargo ödemesi kaydedildi'); renderMain();
}

function viewToptanci(){
  const list = [...state.wholesalePurchases].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const totalRemaining = state.wholesalePurchases.reduce((s,w)=>s+(w.totalAmount-w.paidAmount), 0);

      '<div style="background:#f0fdf4;padding:16px 20px;border-radius:14px;"><div style="font-size:14px;color:#10B981;font-weight:800;">✔️ Ödenen</div><div style="font-size:26px;font-weight:800;color:#10B981;">'+fmtMoney(totalPaid)+'</div></div>'+
      '<div style="background:'+(totalRemaining>0?'#fef2f2':'#f0fdf4')+';padding:16px 20px;border-radius:14px;"><div style="font-size:14px;color:'+(totalRemaining>0?'#d64545':'#10B981')+';font-weight:800;">'+(totalRemaining>0?'⚠️':'✅')+' Kalan Cari</div><div style="font-size:26px;font-weight:800;color:'+(totalRemaining>0?'#d64545':'#10B981')+';">'+fmtMoney(totalRemaining)+'</div></div>'+
    '</div>'+
    '<button class="btn" style="margin-top:16px;width:100%;font-size:16px;padding:14px;" onclick="openToptanciForm()">+ Yeni Toptancı Alışı Ekle</button>'+
  '</div>';

  // 🎯 ELİMDEKİ STOK & SERMAYE (kategori bazlı) - "borcum bu kadar, elimdeki ürün şu kadar, değeri şu kadar"
  const totalStockQtyAll = state.products.reduce((s,p)=>s+productVariants(p).reduce((s2,v)=>s2+getStock(p,v.color,v.size),0), 0);
  const totalStockValueAll = state.products.reduce((s,p)=>s+productVariants(p).reduce((s2,v)=>s2+getStock(p,v.color,v.size),0)*(p.purchasePrice||0), 0);
  const categoryStats = {};
  state.products.forEach(p=>{
    const cat = p.category || 'Kategorisiz';
    const pQty = productVariants(p).reduce((s,v)=>s+getStock(p,v.color,v.size),0);
    const pVal = pQty * (p.purchasePrice||0);
    if(!categoryStats[cat]) categoryStats[cat] = {qty:0, value:0};
    categoryStats[cat].qty += pQty;
    categoryStats[cat].value += pVal;
  });
  const catEntries = Object.entries(categoryStats).sort((a,b)=>b[1].value-a[1].value);
  const catColors = ['#6366F1','#10B981','#F59E0B','#EF4444','#3B82F6','#8B5CF6','#EC4899','#14B8A6'];

  html += '<div class="card">'+
    '<h2 style="font-size:19px;">📦 Elimdeki Stok & Sermaye</h2>'+
    '<div class="row-flex" style="justify-content:space-around;text-align:center;flex-wrap:wrap;gap:14px;margin-top:10px;">'+
      '<div style="background:#eef6ff;padding:16px 20px;border-radius:14px;"><div style="font-size:14px;color:#2196F3;font-weight:800;">📦 Elimdeki Toplam Ürün</div><div style="font-size:26px;font-weight:800;color:#2196F3;">'+totalStockQtyAll+' adet</div></div>'+

    '</div>'+

  if(!list.length){
    html += '<div class="card"><div class="empty">Henüz toptancı alışı kaydedilmedi.</div></div>';

  const supplierGroups = {};
  state.wholesalePurchases.forEach(w=>{
    const key = w.supplier || '—';

        '<div style="text-align:right;"><div style="font-weight:800;font-size:15px;color:'+(rem>0?'#d64545':'#10B981')+';">'+fmtMoney(rem)+'</div><div style="font-size:10px;color:var(--muted);">kalan — Detay →</div></div>'+
      '</div>';
    }).join('')+
  '</div>';

  html += '<div class="card"><h2 style="font-size:16px;">📋 Tüm Toptancı Alışları</h2>'+
    list.map(w=>{
      const remaining = w.totalAmount - w.paidAmount;
      const isPaid = remaining <= 0;
      return '<div style="background:'+(isPaid?'#f0fdf4':'#fff8e1')+';border-left:4px solid '+(isPaid?'#10B981':'#F59E0B')+';border-radius:10px;padding:10px 12px;margin-bottom:8px;">'+
        '<div class="row-flex" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;">'+

            '<div style="font-size:11px;color:var(--muted);margin-top:1px;">📅 '+new Date(w.date).toLocaleDateString('tr-TR')+' — '+w.qty+' adet × '+fmtMoney(w.unitPrice)+'</div>'+

          '<div style="text-align:right;font-size:16px;font-weight:800;color:#0071E3;">'+fmtMoney(w.totalAmount)+'</div>'+
        '</div>'+

const TOPTANCI_KATEGORILER = [
  'T-shirt','Eşofman Altı','3 İplik Eşofman Altı','Şort Penye','Şort Petek','Şort Ottoman',
  'Fermuarlı Sweat','3 İplik Fermuarlı Sweat','Bisiklet Yaka Sweat','3 İplik Bisiklet Yaka Sweat',
  'Peluş Düğmeli','Peluş Fermuarlı','Ottoman Yakalı','Ayakkabı','Aksesuar','Diğer'
];

function addToptanciKategori(){
  const newCat = prompt('Yeni kategori adı (örn. Bere, Şapka, Çorap):');
  if(!newCat || !newCat.trim()) return;
  const val = newCat.trim();
  if(!TOPTANCI_KATEGORILER.includes(val) && !state.customToptanciKategoriler.includes(val)){
    state.customToptanciKategoriler.push(val);
    saveState();
  }
  renderToptanciCategorySelect(val);
  toast('✅ "'+val+'" kategorisi eklendi');
}
function renderToptanciCategorySelect(selectValue){
  const sel = document.getElementById('wp_category');
  if(!sel) return;
  sel.innerHTML = TOPTANCI_KATEGORILER.concat(state.customToptanciKategoriler).map(k=>'<option value="'+esc(k)+'">'+esc(k)+'</option>').join('');
  if(selectValue) sel.value = selectValue;
  renderToptanciSizeGrid();
}

function renderToptanciSizeGrid(){
  const grid = document.getElementById('wp_sizeGrid');
  if(!grid) return;
  grid.innerHTML = '<div class="row-flex" style="gap:10px;flex-wrap:wrap;">'+
    TOPTANCI_BEDENLER.map(b=>
      '<div style="text-align:center;">'+
        '<label style="font-weight:800;font-size:15px;">'+b+'</label>'+
        '<input type="number" min="0" value="0" class="wp-size-input" data-size="'+b+'" '+
          'style="width:70px;padding:10px;text-align:center;font-size:16px;font-weight:700;border-radius:10px;border:2px solid var(--line);margin-top:4px;" '+
          'oninput="updateToptanciTotal()">'+
      '</div>'
    ).join('')+
  '</div>';
  updateToptanciTotal();
}
function updateToptanciTotal(){
  const unit = parseFloat(document.getElementById('wp_unitprice').value)||0;
  let totalQty = 0;
  document.querySelectorAll('.wp-size-input').forEach(inp=>{ totalQty += parseInt(inp.value)||0; });
  document.getElementById('wp_totalBox').textContent = 'Toplam Adet: '+totalQty+' — Toplam Tutar: '+fmtMoney(totalQty*unit);
}
function saveToptanciPurchase(){
  const unitPrice = parseFloat(document.getElementById('wp_unitprice').value)||0;
  const paid = parseFloat(document.getElementById('wp_paid').value)||0;
  const category = document.getElementById('wp_category').value;
  const color = (document.getElementById('wp_color').value.trim() || '-');
  const extraNote = document.getElementById('wp_product').value.trim();
  const supplier = document.getElementById('wp_supplier').value.trim();
  const date = document.getElementById('wp_date').value || todayISO().slice(0,10);
  const paymentDate = document.getElementById('wp_paymentdate').value || null;

  // Beden bazlı adetleri topla
  const sizeBreakdown = {};
  let totalQty = 0;
  document.querySelectorAll('.wp-size-input').forEach(inp=>{
    const qty = parseInt(inp.value)||0;
    if(qty > 0){ sizeBreakdown[inp.dataset.size] = qty; totalQty += qty; }
  });

  if(totalQty === 0){ toast('En az bir bedene adet girmelisin'); return; }

  const productName = category+' — '+color+(extraNote ? ' ('+extraNote+')' : '')+' — '+
    Object.entries(sizeBreakdown).map(([s,q])=>s+':'+q).join(', ');

  const entry = {
    id: uid('wp'),
    date, supplier,
    productName: productName,
    category: category,
    color: color,
    sizeBreakdown: sizeBreakdown,
    qty: totalQty, unitPrice,
    totalAmount: totalQty*unitPrice,
    paidAmount: paid,
    paymentDate: paymentDate
  };
  state.wholesalePurchases.push(entry);

  // 🎯 ASIL STOK KAYNAĞI: Kategoriye ait ürünü bul, yoksa oluştur, RENK+bedene göre stoğu artır
  let product = state.products.find(p => p.name.trim().toLowerCase() === category.trim().toLowerCase());
  if(!product){
    product = {
      id: uid('product'),
      name: category,
      category: category,
      price: 0,
      purchasePrice: unitPrice,
      extraCost: 0,
      colors: [color],
      sizes: TOPTANCI_BEDENLER.slice(),
      stock: {},
      lowThreshold: 3,
      barcode: nextBarcodeValue()
    };
    state.products.push(product);
  } else {
    product.purchasePrice = unitPrice; // en son alış fiyatını güncel tut
    // Ürünün beden listesinde eksik varsa tamamla
    TOPTANCI_BEDENLER.forEach(b=>{ if(!product.sizes.includes(b)) product.sizes.push(b); });
    // Bu renk daha önce yoksa ürünün renk listesine ekle (örn: "Siyah" ilk kez geliyorsa)
    if(!product.colors.includes(color)) product.colors.push(color);
  }
  Object.entries(sizeBreakdown).forEach(([size, qty])=>{
    const current = getStock(product, color, size);
    setStock(product, color, size, current + qty);
  });

  saveState(); closeModal();
  toast('✅ '+totalQty+' adet "'+category+' — '+color+'" stoğa eklendi ve cari kaydedildi');
  renderMain();
}

const STANDART_BEDENLER = ['S','M','L','XL','XXL'];
function renderSizeToggleBox(){
  const box = document.getElementById('sizeToggleBox');
  if(!box) return;
  const currentSizes = document.getElementById('f_sizes').value.split(',').map(s=>s.trim()).filter(Boolean);
  // Standart bedenler + o an listede olan ama standart olmayan (elle eklenmiş) ekstra bedenler
  const extraSizes = currentSizes.filter(s => !STANDART_BEDENLER.includes(s));
  const allBoxes = STANDART_BEDENLER.concat(extraSizes);
  box.innerHTML = allBoxes.map(s=>{
    const active = currentSizes.includes(s);
    return '<button type="button" data-size="'+esc(s)+'" onclick="toggleSizeBox(this.dataset.size)" style="padding:8px 16px;border-radius:10px;font-weight:700;cursor:pointer;border:2px solid '+(active?'var(--orange)':'var(--line)')+';background:'+(active?'var(--orange)':'#fff')+';color:'+(active?'#fff':'var(--text)')+';">'+esc(s)+'</button>';
  }).join('');
}
function toggleCompositeBox(){
  const checked = document.getElementById('f_isComposite').checked;

  box.style.display = checked ? '' : 'none';
  if(checked) renderCompositeComponents();
}

    comps.map((c,idx)=>
      '<div class="row-flex" style="gap:8px;margin-top:6px;align-items:center;">'+

        (comps.length>2 ? '<button type="button" class="btn danger small" onclick="removeCompositeComponent('+idx+')">✕</button>' : '')+

function updateProfitPreview(){
  const cost = parseFloat(document.getElementById('f_cost').value)||0;
  const extra = parseFloat(document.getElementById('f_extra').value)||0;
  const margin = parseFloat(document.getElementById('f_margin').value)||30;
  const price = parseFloat(document.getElementById('f_price').value)||0;
  const totalCost = cost + extra;
  
  // Tavsiye edilen fiyat: (alış + kargo/reklam) üzerine girilen kâr yüzdesi eklenir
  const suggested = totalCost * (1 + margin/100);
  const suggestedBox = document.getElementById('suggestedPriceBox');
  if(totalCost > 0){
    suggestedBox.innerHTML = '💡 <b>Tavsiye Edilen Fiyat: '+fmtMoney(suggested)+'</b> '+
      '<span class="muted">('+fmtMoney(totalCost)+' maliyet + %'+margin+' kâr)</span><br>'+
      '<button type="button" class="btn small" style="margin-top:6px;" onclick="document.getElementById(\'f_price\').value=\''+suggested.toFixed(2)+'\';updateProfitPreview();">Bu Fiyatı Kullan</button>';
  } else {
    suggestedBox.innerHTML = '<span class="muted">Alış fiyatı girince tavsiye edilen fiyat burada görünecek.</span>';
  }
  
  const profit = price - totalCost;
  const gerçekMargin = price>0 ? (profit/price*100) : 0;
  const box = document.getElementById('profitPreview');
  box.innerHTML = 'Girilen satış fiyatına göre — Birim maliyet: '+fmtMoney(totalCost)+' &nbsp;→&nbsp; '+
    '<b style="color:'+(profit>=0?'var(--ok)':'var(--danger)')+';">Kâr: '+fmtMoney(profit)+' (%'+gerçekMargin.toFixed(0)+')</b>';
}

function previewProductPhotos(evt){
  const files = evt.target.files;
  if(!files || files.length === 0) return;
  
  pendingPhotoDataUrls = [];
  let processed = 0;
  
  Array.from(files).forEach((file, idx)=>{
    compressImage(file, 480).then(dataUrl=>{
      pendingPhotoDataUrls.push(dataUrl);
      processed++;
      
      // Tüm fotoğraflar işlendikten sonra preview güncelle
      if(processed === files.length){
        updatePhotosPreview();
      }
    }).catch(()=>{
      processed++;
      toast('⚠️ '+file.name+' yüklenemedi');
      if(processed === files.length) updatePhotosPreview();
    });
  });
}

  const components = isComposite ? (window.compositeComponentsDraft||[]).filter(c=>c.productId) : [];

  let p = id ? state.products.find(x=>x.id===id) : null;

  } else {
    p.name=name; p.category=category; p.price=price; p.purchasePrice=purchasePrice; p.extraCost=extraCost; p.marginPercent=marginPercent; p.lowThreshold=lowThreshold;
    p.colors=colors; p.sizes=sizes; p.isComposite=isComposite; p.components=components;
    if(!p.barcode) p.barcode = nextBarcodeValue();
  }
  
  // Fotoğrafları kaydet — pendingPhotoDataUrls formu her açtığında (düzenleme/kopyalama) doğru
  // başlangıç durumuyla dolduruluyor, kullanıcı ✕ ile silip yeni fotoğraf da yükleyebiliyor.
  // Burada elindeki son hali (boş dahil) olduğu gibi kaydediyoruz.
  p.photos = pendingPhotoDataUrls.slice();
  p.photo = pendingPhotoDataUrls[0] || null;
  pendingPhotoDataUrls = [];
  productDuplicateSource = null;
  
  productVariants(p).forEach(v=>{ if(!(variantKey(v.color,v.size) in p.stock)) setStock(p,v.color,v.size,0); });
  
  // Formdaki stok kutucuklarını oku ve kaydet (ürün eklerken/düzenlerken doğrudan girilen adetler)
  // Bileşik ürünlerde (Takım) stok elle girilmez, bileşenlerden otomatik hesaplanır.
  if(!isComposite){
    document.querySelectorAll('.stockgrid-input').forEach(inp=>{
      const qty = parseInt(inp.value)||0;
      setStock(p, inp.dataset.color, inp.dataset.size, qty);
    });
  }
  
  saveState(); closeModal(); toast('✅ Ürün kaydedildi ('+(p.photos?.length||0)+' fotoğraf)'); renderMain();
}

let barcodeStream = null;
let barcodeScanning = false;

function toggleScanner(){
  if(barcodeScanning){
    stopScanner();
  } else {
    startScanner();
  }
}

function loadJsQR(){
  return new Promise((resolve, reject) => {
    if(typeof jsQR !== 'undefined'){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('QR kütüphanesi yüklenemedi'));
    document.head.appendChild(script);
  });
}

function startScanner(){
  const video = document.getElementById('scannerVideo');
  const btn = document.getElementById('scannerBtn');
  
  loadJsQR().then(() => {
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }).then(stream => {
      barcodeStream = stream;
      video.srcObject = stream;
      video.style.display = 'block';
      video.play();
      barcodeScanning = true;
      btn.textContent = '⏹ Kamerayı Durdur';
      scanLoop();
    })
    .catch(err => {
      toast('❌ Kameraya erişilemedi: ' + err.message);
    });
}

function stopScanner(){
  if(barcodeStream){
    barcodeStream.getTracks().forEach(track => track.stop());
    barcodeStream = null;
  }
  const video = document.getElementById('scannerVideo');
  if(video) video.style.display = 'none';
  barcodeScanning = false;
  const btn = document.getElementById('scannerBtn');
  if(btn) btn.textContent = '📷 Kamerayı Başlat';
}

function vibrateOnScan(){
  if(navigator.vibrate){ navigator.vibrate(100); }
}
function scanLoop(){
  if(!barcodeScanning) return;
  
  const video = document.getElementById('scannerVideo');
  const canvas = document.getElementById('scannerCanvas');
  if(!video || !canvas || video.readyState !== video.HAVE_ENOUGH_DATA){
    requestAnimationFrame(scanLoop);
    return;
  }
  
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(imageData.data, imageData.width, imageData.height);
  
  if(code){
    vibrateOnScan();
    stopScanner();
    processScannedCode(code.data);
  } else {
    requestAnimationFrame(scanLoop);
  }
}

function processManualBarcode(){
  const input = document.getElementById('manualBarcodeInput');
  if(!input || !input.value.trim()){
    toast('❌ Kod boş!');
    return;
  }
  processScannedCode(input.value.trim());
  input.value = '';
}

function processScannedCode(data){
  const resultArea = document.getElementById('scanResultArea');
  if(!resultArea) return;
  
  // Önce Ürün Barkodu olarak dene
  let product = state.products.find(p => p.barcode === data);
  
  // Sonra Sipariş Barkodu olarak dene
  let order = state.orders.find(o => o.barcode === data);
  
  // Sonra QR JSON verisi olarak dene (sipariş no + telefon)
  if(!product && !order){
    const parts = data.split('|');
    if(parts.length === 2){
      order = state.orders.find(o => o.orderNo == parts[0]);
    }
  }
  
  // JSON formatlı QR kod dene
  if(!product && !order){
    try {
      const parsed = JSON.parse(data);
      if(parsed.no){
        order = state.orders.find(o => o.orderNo == parsed.no);
      }
    } catch(e){}
  }
  
  if(product){
    showScannedProduct(product);
  } else if(order){
    showScannedOrder(order);
  } else {
    resultArea.innerHTML = '<div class="card"><div class="empty" style="color:var(--danger);">❌ Bu koda ait ürün veya sipariş bulunamadı: '+esc(data)+'</div></div>';
    toast('❌ Kod bulunamadı!');
  }
}

function code39Pattern(ch){
  const table = {
    '0':'000110100','1':'100100001','2':'001100001','3':'101100000',
    '4':'000110001','5':'100110000','6':'001110000','7':'000100101',
    '8':'100100100','9':'001100100','*':'010010100'
  };
  return table[ch] || table['0'];
}
function renderCode39Bars(svgId, value, opts){
  opts = opts || {};
  const height = opts.height || 50;
  const narrow = opts.narrow || 2;
  const wide = narrow*3;
  const gap = narrow;
  const digits = String(value).replace(/[^0-9]/g,'') || '0';
  const chars = ('*'+digits+'*').split('');
  const rects = [];
  let x = 4;
  chars.forEach((ch,ci)=>{
    const pattern = code39Pattern(ch);
    for(let i=0;i<pattern.length;i++){
      const isBar = i%2===0;
      const w = pattern[i]==='1' ? wide : narrow;
      if(isBar) rects.push('<rect x="'+x+'" y="0" width="'+w+'" height="'+height+'" fill="#000"/>');
      x += w;
    }
    if(ci < chars.length-1) x += gap;
  });
  x += 4;
  const svg = document.getElementById(svgId);
  if(svg){
    svg.setAttribute('width', x);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', '0 0 '+x+' '+height);
    svg.innerHTML = rects.join('');
  }
  return x;
}
function safeRenderBarcode(svgId, value, opts){
  try{
    return renderCode39Bars(svgId, value, opts);
  }catch(e){
    const el = document.getElementById(svgId);
    if(el) el.outerHTML = '<div style="font-family:monospace;font-size:15px;font-weight:700;letter-spacing:2px;border:1px dashed #999;padding:8px;">'+esc(value)+'</div>';
    return null;
  }
}
function renderJustifiedDigits(elId, value, width){
  const el = document.getElementById(elId);
  if(!el) return;
  el.style.width = (width||160)+'px';
  el.style.display = 'flex';
  el.style.justifyContent = 'space-between';
  el.style.margin = '6px auto 0';
  el.innerHTML = String(value).split('').map(d=>'<span>'+esc(d)+'</span>').join('');
}
function safeRenderQr(containerId, value, size){
  try{
    const el = document.getElementById(containerId);
    if(el){ el.innerHTML=''; new QRCode(el, {text:value, width:size, height:size}); }
    return true;
  }catch(e){
    const el = document.getElementById(containerId);
    if(el) el.innerHTML = '<div class="muted">QR oluşturulamadı: '+esc(value)+'</div>';
    return false;
  }
}

function exportCustomersVCard(){
  if(!state.customers.length){ toast('❌ Müşteri yok!'); return; }
  
  let vcard = '';
  state.customers.forEach(c => {
    if(!c.phone) return;
    let phone = c.phone.replace(/[^0-9]/g,'');
    if(phone.length === 10) phone = '90'+phone; // Türkiye kodu ekle
    if(!phone.startsWith('+')) phone = '+'+phone;
    
    vcard += 'BEGIN:VCARD\r\n';
    vcard += 'VERSION:3.0\r\n';
    vcard += 'FN:'+c.name+'\r\n';
    vcard += 'TEL;TYPE=CELL:'+phone+'\r\n';
    if(c.address) vcard += 'ADR;TYPE=HOME:;;'+c.address.replace(/\n/g,' ')+';;;;\r\n';
    if(c.note) vcard += 'NOTE:'+c.note+'\r\n';
    vcard += 'END:VCARD\r\n';
  });
  
  const blob = new Blob([vcard], {type: 'text/vcard;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'musteriler-rehber-'+new Date().toLocaleDateString('tr-TR').replace(/\./g,'-')+'.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  toast('✅ Rehber dosyası indirildi! Telefonda açıp "Tümünü İçe Aktar" yapın');
}

function updateOrderStatus(orderId, newStatus){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) {
    toast('❌ Sipariş bulunamadı!');
    return;
  }
  
  // KARGOYA VERİLDİ İSE - Takip numarası sor
  if(newStatus === 'Kargoya Verildi' && !order.tracking){
    openTrackingNumberModal(orderId);
    return;
  }
  
  order.status = newStatus;
  if(newStatus === 'Kargoya Verildi' && !order.shippedDate){
    order.shippedDate = todayISO();
  }
  
  // İADE OLDUĞUNDA MÜŞTERİ KARA LİSTEYE AL + İADELER PANELİNE KAYIT DÜŞ
  if(newStatus === 'İade Edildi'){
    const customer = state.customers.find(c=>c.id===order.customerId);
    if(customer && !customer.blacklisted){
      customer.blacklisted = true;
      customer.blacklistReason = 'İade Yapılan Müşteri';
      customer.blacklistDate = new Date().toLocaleDateString('tr-TR');
    }
    
    // İadeler paneline otomatik kayıt düş (mükerrer eklememek için kontrol et)
    if(!order.returns) order.returns = [];
    const zatenEklendi = order.returns.some(r => r.source === 'hizli-durum');
    if(!zatenEklendi){
      order.items.forEach((item, itemIdx) => {
        order.returns.push({
          id: uid('ret'), date: todayISO(), type: 'iade',
          name: item.name, color: item.color, size: item.size, qty: item.qty, price: item.price,
          // Kargo iade ücreti sipariş başına 1 kez sayılır (ilk üründe), diğer ürünlerde 0
          returnCargoPrice: itemIdx === 0 ? state.kargoUcreti : 0,
          note: 'Hızlı durum değişikliğiyle otomatik iade kaydı',
          source: 'hizli-durum', received: false
        });
      });
    }
  }
  
  saveState();
  
  // TAB AYARLA VE GÖSTER
  if(newStatus === 'Teslim Edildi'){
    toast('✓ Sipariş teslim edildi - Kesin Alacak\'a eklendi');
    ui.tab = 'odeme';
    ui.sub = 'kesin';
  } else if(newStatus === 'Kargoya Verildi'){
    toast('📦 Sipariş yolda - Tahmini Alacak\'a eklendi');
    ui.tab = 'odeme';
    ui.sub = 'yolda';
  } else if(newStatus === 'İade Edildi'){
    toast('↩ Sipariş iade edildi - İade tab\'ında gösterildi!');
    ui.tab = 'odeme';
    ui.sub = 'iade';
  }
  
  closeModal();
  renderMain();
}

function confirmTrackingAndShip(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  
  const tracking = document.getElementById('trackingNoInput').value.trim();
  const cargoFirm = document.getElementById('cargoFirmInput').value.trim();
  
  if(!tracking){
    toast('❌ Takip numarası girin!');
    return;
  }
  
  order.tracking = tracking;
  order.cargo = cargoFirm || 'Aras Kargo';
  order.status = 'Kargoya Verildi';
  order.shippedDate = todayISO();
  saveState();
  
  toast('📦 Kargoya verildi - Takip mesajı hazırlanıyor');
  
  // WhatsApp mesajını göster (kind='shipped' takip linkini içeriyor)
  showWhatsAppMessage(orderId, 'shipped');
}

function saveCustomer(id){
  const name = document.getElementById('c_name').value.trim();
  const phone = document.getElementById('c_phone').value.trim().replace(/[^0-9]/g,'');
  const city = document.getElementById('c_city').value.trim();
  const district = document.getElementById('c_district').value.trim();
  const address = document.getElementById('c_addr').value.trim();
  const note = document.getElementById('c_note').value.trim();
  if(!name){ toast('İsim gerekli'); return; }
  let c = id ? state.customers.find(x=>x.id===id) : null;
  if(!c){ 
    c = {
      id: uid('cust'), name, phone, city, district, address, note,
      blacklisted: false, blacklistReason: '', blacklistDate: ''
    }; 
    state.customers.push(c); 
  }
  else { c.name=name; c.phone=phone; c.city=city; c.district=district; c.address=address; c.note=note; }
  saveState(); closeModal(); toast('Müşteri kaydedildi'); renderMain();
}

function openIadeForm(customerId){
  const c = state.customers.find(x=>x.id===customerId);
  if(!c) return;
  
  // o müşterinin TÜM siparişlerini (iade edilmemişleri) getir
  const customerOrders = state.orders.filter(o=>o.customerId===customerId && o.items.length>0);
  if(!customerOrders.length){
    toast('Bu müşterinin iade edilecek ürünü yok');
    return;
  }
  
  // İade formunu aç
  ui.tab = 'iadeler';
  ui.iadeCustomerId = customerId;
  ui.openReturnForCustomer = true; // İade formunu aç
  closeModal();
  renderMain();
}

    html += '<div style="width:60px;height:60px;border-radius:8px;background:#eef1f5;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;flex-shrink:0;">Foto</div>';
  }
  
  // Başlık

  // Beden seçenekleri (checkbox sol, compact)

  const sizes = [...new Set(productVariants(p).map(v=>v.size))];

    const stock = Math.max(...productVariants(p)
      .filter(v=>v.size===size)
      .map(v=>getStock(p, v.color, v.size)));
    
    const disabled = stock <= 0;
    
    html += '<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:'+(disabled?'not-allowed':'pointer')+';background:'+(disabled?'#f5f5f5':'#f9f9f9')+';opacity:'+(disabled?'0.5':'1')+';">'+
      '<input type="checkbox" style="width:16px;height:16px;cursor:pointer;flex-shrink:0;" '+
        (disabled?'disabled':'')+' '+
        'onchange="quickAddToCartFromSize(\''+p.id+'\',\''+esc(size)+'\', this.checked)">'+
      '<span style="font-weight:500;min-width:40px;font-size:13px;">'+esc(size)+'</span>'+
      '<span class="muted" style="font-size:11px;">Stok: '+stock+'</span>'+
    '</label>';
  });
  
  html += '</div>'+
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">'+
      '<button class="btn ghost" style="width:100%;" onclick="openManualVariantAdd(\''+p.id+'\')">🎯 Manuel Ekle (Renk + Beden + Adet Seç)</button>'+

      '<button class="btn ghost" onclick="closeModal()" style="font-size:13px;padding:6px 12px;">Kapat</button>'+
    '</div>';
  
  openModal(html);
}

    '<p class="muted">Aynı üründen birden fazla ekleyeceksen (örn. 1 tane M, 1 tane L), bu pencereyi her seferinde tekrar açıp farklı beden seçerek ekleyebilirsin — her biri sepette ayrı satır olarak görünür.</p>'+

      '<div><label>Beden</label><select id="mv_size" onchange="updateManualVariantStock(\''+p.id+'\')">'+sizes.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select></div>'+

function updateManualVariantStock(productId){
  const p = state.products.find(x=>x.id===productId);
  const color = document.getElementById('mv_color').value;
  const size = document.getElementById('mv_size').value;
  document.getElementById('mv_stockHint').textContent = 'Mevcut stok: '+getStock(p,color,size)+' adet';
}
function confirmManualVariantAdd(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const color = document.getElementById('mv_color').value;
  const size = document.getElementById('mv_size').value;
  const qty = parseInt(document.getElementById('mv_qty').value)||1;
  const avail = getStock(p, color, size);
  if(avail <= 0){ toast('❌ Bu renk/beden için stok yok'); return; }

  const existing = cart.find(i=>i.productId===p.id && i.color===color && i.size===size);
  if(existing){ existing.qty += qty; }
  else { cart.push({productId:p.id, name:p.name, color, size, qty, price:p.price, unitCost:(p.purchasePrice||0)+(p.extraCost||0)}); }

  closeModal();
  toast('✅ Sepete eklendi: '+p.name+' — '+color+' / '+size+' × '+qty);
  renderMain();
}

function quickAddToCartFromSize(productId, size, checked){
  if(!checked) return;
  
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  
  // Renk otomatik seçim (stok en yüksek olan rengi seç)
  let bestColor = null;
  let bestStock = 0;
  
  productVariants(p).forEach(v=>{
    if(v.size === size){
      const stock = getStock(p, v.color, v.size);
      if(stock > bestStock){
        bestStock = stock;
        bestColor = v.color;
      }
    }
  });
  
  if(!bestColor || bestStock <= 0){
    toast('Stok yok');
    return;
  }
  
  // Sepete ekle
  const existing = cart.find(i=>i.productId===p.id && i.size===size && i.color===bestColor);
  if(existing) existing.qty++;
  else {
    cart.push({
      productId: p.id,
      name: p.name,
      color: bestColor,
      size: size,
      qty: 1,
      price: p.price,
      unitCost: p.purchasePrice
    });
  }
  
  saveState();
  closeModal();
  renderMain();
  toast('✅ '+p.name+' ('+size+') sepete eklendi');
}

// Kar hesaplaması gerçek zamanlı
function updateProfitCalculation(){
  const cost = parseFloat(document.getElementById('neworder_cost').value)||0;
  const price = parseFloat(document.getElementById('neworder_price').value)||0;
  const cargo = parseFloat(document.getElementById('neworder_cargo').value)||0;
  const marginEl = document.getElementById('neworder_margin');
  const margin = marginEl ? (parseFloat(marginEl.value)||30) : 30;
  const profit = price - cost - cargo;
  
  const profitEl = document.getElementById('unitProfit');
  if(profitEl){
    profitEl.textContent = fmtMoney(profit);
    profitEl.style.color = profit >= 0 ? 'var(--ok)' : '#d32f2f';
  }
  const profitPercentEl = document.getElementById('unitProfitPercent');
  if(profitPercentEl){
    const realMargin = price > 0 ? (profit/price*100) : 0;
    profitPercentEl.textContent = '(%'+realMargin.toFixed(0)+')';
    profitPercentEl.style.color = profit >= 0 ? 'var(--ok)' : '#d32f2f';
  }
  
  // Tavsiye edilen fiyat: (geliş fiyatı + kargo) üzerine girilen kâr yüzdesi eklenir
  const suggestedBox = document.getElementById('suggestedPriceBoxOrder');
  if(suggestedBox){
    const totalCost = cost + cargo;
    if(totalCost > 0){
      const suggested = totalCost * (1 + margin/100);
      suggestedBox.innerHTML = '💡 <b>Tavsiye Edilen Fiyat: '+fmtMoney(suggested)+'</b> '+
        '<span class="muted">('+fmtMoney(totalCost)+' maliyet + %'+margin+' kâr)</span><br>'+
        '<button type="button" class="btn small" style="margin-top:6px;" onclick="document.getElementById(\'neworder_price\').value=\''+suggested.toFixed(2)+'\';updateProfitCalculation();">Bu Fiyatı Kullan</button>';
    } else {
      suggestedBox.innerHTML = '<span class="muted">Geliş fiyatı girince tavsiye edilen fiyat burada görünecek.</span>';
    }
  }
}

function addKombinToCart(){
  // Validasyon
  if(kombinParts.length === 0){
    toast('❌ En az 1 parça ekleyin!');
    return;
  }
  
  for(const part of kombinParts){
    if(!part.name || !part.name.trim()){
      toast('❌ Tüm parçaların adını girin!');
      return;
    }
  }
  
  const price = parseFloat(document.getElementById('kombin_price').value) || 0;
  const cost = parseFloat(document.getElementById('kombin_cost').value) || 0;
  const cargoPrice = parseFloat(document.getElementById('kombin_cargo').value) || 0;
  
  if(price <= 0){
    toast('❌ Toplam satış fiyatı girin!');
    return;
  }
  
  // Kombin adını parçalardan oluştur
  const kombinName = 'Kombin: ' + kombinParts.map(p => p.name).join(' + ');
  const kombinDetails = kombinParts.map(p => 
    p.name + (p.color ? ' ('+p.color : '') + (p.size ? '/'+p.size+')' : (p.color ? ')' : ''))
  ).join(', ');
  
  // Kombin fotoğrafı - ilk parçanın fotoğrafını kullan (veya birleştir)

    size: '-',
    qty: 1,
    price: price,
    cargoPrice: cargoPrice,
    photo: mainPhoto,
    unitCost: cost,
    isManual: true,
    isKombin: true,
    kombinParts: JSON.parse(JSON.stringify(kombinParts)) // deep copy
  });
  
  // Formu temizle
  kombinParts = [];
  document.getElementById('isKombinCheckbox').checked = false;
  document.getElementById('kombinPartsCard').style.display = 'none';
  document.getElementById('kombin_price').value = '';
  document.getElementById('kombin_cost').value = '';

function expandCartToOrderItems(cartArr){
  const result = [];
  cartArr.forEach(i=>{
    if(!i.sizeBreakdown || !i.sizeBreakdown.length){
      result.push(Object.assign({}, i, {qty: i.qty}));
      return;
    }
    // İlk adet: ana renk/beden/fiyat ile - fiyatı, override'sız adetlerin toplamından 1 birim payı
    const nonOverrideCount = 1 + i.sizeBreakdown.filter(sb=>sb.priceOverride===''||sb.priceOverride==null).length;
    const perUnitShare = nonOverrideCount>0 ? (i.price / nonOverrideCount) : i.price;
    result.push({
      productId: i.productId, name: i.name, color: i.color, size: i.size, qty: 1,
      price: perUnitShare, unitCost: i.unitCost, photo: i.photo || null, cargoPrice: i.cargoPrice
    });
    i.sizeBreakdown.forEach(sb=>{
      const hasOverride = sb.priceOverride!=='' && sb.priceOverride!=null;
      result.push({
        productId: i.productId, name: i.name, color: i.color, size: sb.size, qty: 1,
        price: hasOverride ? parseFloat(sb.priceOverride) : perUnitShare,
        unitCost: i.unitCost, photo: sb.photo || null
      });
    });
  });
  return result;
}
function cartLineTotal(item){
  if(!item.sizeBreakdown || !item.sizeBreakdown.length) return item.qty * item.price;
  // Ana "fiyat" alanı = farklı fiyat girilmemiş adetlerin TOPLAMI (birim × adet değil)
  // Farklı fiyat girilen her ek adet, kendi tutarı olarak ayrıca eklenir.
  const overrideSum = item.sizeBreakdown.reduce((s,sb)=>{
    const v = parseFloat(sb.priceOverride);
    return s + (isNaN(v) || sb.priceOverride==='' ? 0 : v);
  }, 0);
  return item.price + overrideSum;
}
function updateCartSubItem(idx, sbIdx, field, value){
  if(!cart[idx] || !cart[idx].sizeBreakdown || !cart[idx].sizeBreakdown[sbIdx]) return;
  cart[idx].sizeBreakdown[sbIdx][field] = value;
  refreshCartBox();
}
function updateCartSubItemPhoto(idx, sbIdx, evt){
  const file = evt.target.files[0];
  if(!file || !cart[idx] || !cart[idx].sizeBreakdown || !cart[idx].sizeBreakdown[sbIdx]) return;
  const reader = new FileReader();
  reader.onload = function(e){
    cart[idx].sizeBreakdown[sbIdx].photo = e.target.result;
    refreshCartBox();
  };
  reader.readAsDataURL(file);
}
function cartItemHasMissingSizes(item){
  if(!item.sizeBreakdown) return false;
  return item.sizeBreakdown.some(sb => !sb.size);
}
function cartHasMissingSizes(){
  return cart.some(i => cartItemHasMissingSizes(i));
}
function updateCartItemQty(idx, newQty){
  const qty = parseInt(newQty)||1;
  if(!cart[idx]) return;
  cart[idx].qty = qty < 1 ? 1 : qty;
  refreshCartBox();
}
function updateCartItemPrice(idx, newPrice){
  const price = parseFloat(newPrice)||0;
  if(!cart[idx]) return;
  cart[idx].price = price;
  refreshCartBox();
}
function renderCart(){
  if(!cart.length) return '<div class="empty">Sepet boş.</div>';
  const total = cart.reduce((s,i)=>s+cartLineTotal(i),0);
  const cargoTotal = cart.reduce((s,i)=>s+(i.cargoPrice||0),0);
  
  // 🎯 DİNAMİK REKLAM MALİYETİ - Bugün Kargo Başına
  let adCostPerShipment = 0;
  if(state.adBudget.active){
    const today = new Date().toDateString();
    const todayOrders = state.orders.filter(o => new Date(o.date).toDateString() === today);
    const todayCargoCount = todayOrders.length + cart.length; // bugün + yeni siparişler
    adCostPerShipment = Math.round(state.adBudget.dailyAmount / todayCargoCount);
  }
  
  const adTotal = adCostPerShipment * cart.length;
  
  return cart.map((i,idx)=>{
    const cargoForThis = i.cargoPrice||0;
    const totalRevenue = cartLineTotal(i);
    const totalCost = (i.unitCost||0) * i.qty;
    const totalProfit = totalRevenue - totalCost - cargoForThis;
    const realMarginPct = totalRevenue > 0 ? (totalProfit/totalRevenue*100) : 0;
    const suggestedUnit = (i.unitCost + (cargoForThis/i.qty)) * 1.3;
    const extraCount = Math.max(0, i.qty - 1);
    if(!i.sizeBreakdown) i.sizeBreakdown = [];
    while(i.sizeBreakdown.length < extraCount) i.sizeBreakdown.push({size:'', photo:null, priceOverride:''});
    while(i.sizeBreakdown.length > extraCount) i.sizeBreakdown.pop();

    const productForSizes = state.products.find(x=>x.id===i.productId);
    const sizeOptions = productForSizes && productForSizes.sizes && productForSizes.sizes.length ? productForSizes.sizes : [i.size];

        '<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line);flex-wrap:wrap;">'+
          '<div style="flex:1;min-width:80px;"><label style="font-size:10px;">Beden * (yazabilirsin)</label><input list="sizeSuggest_'+idx+'_'+sbIdx+'" type="text" value="'+esc(sb.size||'')+'" placeholder="Örn: M" style="width:100%;padding:6px;border-radius:6px;'+(!sb.size?'border:2px solid #d64545;':'border:1px solid var(--line);')+'" onchange="updateCartSubItem('+idx+','+sbIdx+',\'size\',this.value)">'+
            '<datalist id="sizeSuggest_'+idx+'_'+sbIdx+'">'+sizeOptions.map(s=>'<option value="'+esc(s)+'">').join('')+'</datalist>'+
          '</div>'+
          '<div style="flex:1;min-width:90px;"><label style="font-size:10px;">Farklı Fiyat (opsiyonel)</label><input type="number" step="0.01" placeholder="Boş=ortak" value="'+(sb.priceOverride||'')+'" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);" onchange="updateCartSubItem('+idx+','+sbIdx+',\'priceOverride\',this.value)"></div>'+
          '<div><label style="font-size:10px;">Foto (opsiyonel)</label><input type="file" accept="image/*" style="font-size:10px;width:110px;" onchange="updateCartSubItemPhoto('+idx+','+sbIdx+',event)"></div>'+
          (sb.photo ? '<img src="'+sb.photo+'" style="width:32px;height:32px;object-fit:cover;border-radius:6px;">' : '')+
        '</div>'
      ).join('')+
    '</div>' : '';

    return '<div class="cart-item" style="padding:10px;background:#f9f9f9;border-radius:8px;margin-bottom:8px;border-left:4px solid var(--ok);">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;">'+
        '<span>'+esc(i.name)+' — '+esc(i.color)+' / '+esc(i.size)+'</span>'+
        '<button class="btn danger small" onclick="removeFromCart('+idx+');renderMain()" style="margin-left:6px;">✕</button>'+
      '</div>'+
      '<div class="row-flex" style="gap:10px;margin-top:8px;align-items:center;">'+
        '<div style="flex:1;"><label style="font-size:11px;color:var(--muted);">Adet</label><input type="number" min="1" value="'+i.qty+'" style="width:100%;padding:8px;border-radius:8px;border:2px solid var(--orange);font-weight:700;" onchange="updateCartItemQty('+idx+', this.value)"></div>'+
        '<div style="flex:2;"><label style="font-size:11px;color:var(--muted);">'+(extraCount>0?'Toplam Fiyat (₺, opsiyonel farklılar hariç)':'Birim Fiyat (₺)')+'</label><input type="number" step="0.01" value="'+i.price+'" style="width:100%;padding:8px;border-radius:8px;border:2px solid var(--orange);font-weight:700;" onchange="updateCartItemPrice('+idx+', this.value)"></div>'+

      extraSlotsHtml+
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;">'+
        '<span>Ürün: '+fmtMoney(cartLineTotal(i))+(i.cargoPrice?' | Kargo: '+fmtMoney(i.cargoPrice):'')+(adCostPerShipment > 0 ? ' | 📌Reklam Payı (bilgi amaçlı): '+fmtMoney(adCostPerShipment) : '')+'</span>'+

function handleBarcodeScan(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const input = e.target;
  const code = input.value.trim();
  input.value = '';
  if(!code) return;
  const fb = document.getElementById('scanFeedback');
  
  // 1) SİPARİŞ QR'I MI? (format: siparişNo|telefon)
  if(code.includes('|')){
    const parts = code.split('|');
    const orderNo = parseInt(parts[0]);
    const order = state.orders.find(o=>o.orderNo===orderNo);
    if(order){
      showOrderScanDetails(order);
      if(fb) fb.innerHTML = '';
      return;
    } else {
      if(fb){ fb.innerHTML = '<span class="low">⚠ Sipariş bulunamadı: #'+esc(parts[0])+'</span>'; }
      toast('Sipariş bulunamadı: #'+parts[0]);
      return;
    }
  }
  
  // 2) SİPARİŞ BARKODU MU? (o.barcode ile eşleşme)
  const orderByBarcode = state.orders.find(o=>o.barcode===code);
  if(orderByBarcode){
    showOrderScanDetails(orderByBarcode);
    if(fb) fb.innerHTML = '';
    return;
  }
  
  // 3) ÜRÜN BARKODU MU? (mevcut davranış)
  const p = state.products.find(x=>x.barcode===code);
  if(!p){
    if(fb){ fb.innerHTML = '<span class="low">⚠ Barkod tanınmadı: '+esc(code)+'</span>'; }
    toast('Ürün bulunamadı: '+code);
    return;
  }
  const colors = p.colors.length?p.colors:['-'];
  const sizes = p.sizes.length?p.sizes:['-'];
  if(colors.length===1 && sizes.length===1){
    addScannedItem(p, colors[0], sizes[0], 1);
    if(fb) fb.innerHTML = scanPreviewHtml(p, colors[0], sizes[0]);
  } else {
    openVariantPicker(p);
  }
}

function normalizeTr(s){ return (s||'').toLocaleLowerCase('tr'); }
function extractNameAddress(text, phone){
  const phoneRe = /(\+?90|0)?[\s().-]*5\d{2}[\s().-]*\d{3}[\s().-]*\d{2}[\s().-]*\d{2}/;
  // Telefon numarasını metnin NERESİNDE olursa olsun (baştan, ortadan, sondan) çıkar
  let working = text.replace(phoneRe, ' ');
  working = working.replace(/^(merhaba|selam|iyi\s*g[üu]nler|iyi\s*ak[şs]amlar)[,:\s]*/i,'').trim();

  const addrKeywords = ['mah','sok','cad','apt','kat','blok','no:','no ','sitesi','köy','mevkii','adres','mh.','sk.','cd.'];
  const stopWords = ['beden','adet','renk','tane','merhaba','teşekkür','tesekkur','istiyorum'];
  const isAddressSeg = (seg) => {
    const low = normalizeTr(seg);
    return addrKeywords.some(k=>low.includes(k)) && /\d/.test(seg);
  };
  const isProductSeg = (seg) => {
    const low = normalizeTr(seg);
    return state.products.some(p=>low.includes(normalizeTr(p.name))) || stopWords.some(w=>low.includes(w));
  };

  let segments = working.split(/\n|,/).map(s=>s.trim()).filter(Boolean);

  // Tek satır, virgülsüz, boşlukla ayrılmış tek blok geldiyse - adres anahtar kelimesine göre böl
  if(segments.length === 1 && !segments[0].includes(',')){
    const words = segments[0].split(/\s+/).filter(Boolean);
    let splitAt = -1;
    for(let i=0;i<words.length;i++){
      const low = normalizeTr(words[i]);
      if(addrKeywords.some(k=>low.includes(k))){ splitAt = i; break; }
    }
    if(splitAt > 0){
      segments = [words.slice(0,splitAt).join(' '), words.slice(splitAt).join(' ')];
    }
  }

  let name = '';
  const addressParts = [];
  for(const seg of segments){
    if(isProductSeg(seg)) break; // ürün/beden bilgisi başladıysa dur
    if(isAddressSeg(seg)){ addressParts.push(seg); continue; }
    if(!name && seg.split(/\s+/).length <= 5 && !/^\d+$/.test(seg) && /[a-zA-ZÇĞİÖŞÜçğıöşü]/.test(seg)){ name = seg; continue; }
    if(name) addressParts.push(seg); // isim zaten bulunduysa geri kalan her şey adrese eklenir
  }

  let address = addressParts.join(', ');
  if(!address) address = guessAddress(text);

  name = name.replace(/^[,\s]+|[,\s]+$/g,'').trim();
  address = address.replace(/^[,\s]+|[,\s]+$/g,'').trim();
  return {name, address};
}
function guessAddress(text){
  const keywords = ['mah','sok','cad','apt','kat','blok','no:','no ','sitesi','köy','mevkii','adres'];
  const lines = text.split(/\n|,/).map(s=>s.trim()).filter(Boolean);
  const hit = lines.find(l=>{
    const low = normalizeTr(l);
    return keywords.some(k=>low.includes(k)) && /\d/.test(l);
  });
  return hit ? hit.replace(/^adres\s*:?\s*/i,'').trim() : '';
}
function parseWhatsappText(text){
  const lower = normalizeTr(text);
  const items = [];
  state.products.forEach(p=>{
    const nameLower = normalizeTr(p.name);
    const idx = lower.indexOf(nameLower);
    if(idx===-1) return;
    const start = Math.max(0, idx-45), end = Math.min(lower.length, idx+nameLower.length+45);
    const context = lower.slice(start, end);
    const color = p.colors.find(c=>context.includes(normalizeTr(c))) || (p.colors[0]||'-');
    const size = p.sizes.find(s=>context.includes(normalizeTr(String(s)))) || (p.sizes[0]||'-');
    const qtyMatch = context.match(/(\d+)\s*(adet|tane|adt)\b/) || context.match(/\bx\s?(\d+)\b/);
    const qty = qtyMatch ? parseInt(qtyMatch[1]) : 1;
    items.push({productId:p.id, name:p.name, color, size, qty, price:p.price});
  });
  const sizeOnlyMatch = text.match(/\b(xs|s|m|l|xl|xxl|xxxl|\d{2})\b\s*beden|beden\s*\b(xs|s|m|l|xl|xxl|xxxl|\d{2})\b/i);
  const phoneMatch = text.match(/(\+?90|0)?[\s().-]*5\d{2}[\s().-]*\d{3}[\s().-]*\d{2}[\s().-]*\d{2}/);
  let phone = phoneMatch ? phoneMatch[0].replace(/[^0-9]/g,'').replace(/^0/,'90') : '';
  // YEDEK: Yukarıdaki hiçbir formatla eşleşmediyse, metindeki herhangi bir 10-11 haneli rakam dizisini telefon say
  if(!phone){
    const digitBlocks = text.match(/\d[\d\s().-]{8,15}\d/g) || [];
    for(const block of digitBlocks){
      const digitsOnly = block.replace(/\D/g,'');
      if(digitsOnly.length===10 || digitsOnly.length===11){
        phone = digitsOnly.length===11 ? digitsOnly.replace(/^0/,'90') : '90'+digitsOnly;
        break;
      }
    }
  }
  const na = extractNameAddress(text, phone);
  return {items, phone, address: na.address, name: na.name, detectedSize: sizeOnlyMatch ? (sizeOnlyMatch[1]||sizeOnlyMatch[2]).toUpperCase() : ''};
}

function updateQnProfitPreview(){
  const price = parseFloat(document.getElementById('qn_price').value)||0;
  const cost = parseFloat(document.getElementById('qn_cost').value)||0;
  const extra = parseFloat(document.getElementById('qn_extra').value)||0;
  const profit = price - cost - extra;
  const box = document.getElementById('qnProfitPreview');
  if(!box) return;
  box.innerHTML = 'Birim kâr: <b style="color:'+(profit>=0?'var(--ok)':'var(--danger)')+';">'+fmtMoney(profit)+'</b>'+(cost||extra?'':' <span style="color:var(--danger);">(alış fiyatı girilmedi — tüm satış fiyatı kâr sayılıyor)</span>');
}

function confirmWhatsappImport(){
  if(!waParsedItems.length){ toast('Önce en az bir ürün ekleyin'); return; }
  waParsedItems.forEach(it=>{

    if(!p) return;
    const existing = cart.find(c=>c.productId===p.id && c.color===it.color && c.size===it.size);
    if(existing){ existing.qty += it.qty; }
    else { cart.push({productId:p.id, name:p.name, color:it.color, size:it.size, qty:it.qty, price:(it.price!=null?it.price:p.price), unitCost:(p.purchasePrice||0)+(p.extraCost||0)}); }
  });
  const phoneEl = document.getElementById('wa_phone');
  const nameEl = document.getElementById('wa_name');
  const phoneVal = phoneEl ? phoneEl.value.trim().replace(/[^0-9]/g,'') : '';
  const nameVal = nameEl ? nameEl.value.trim() : '';
  waParsedItems = [];
  goTab('yenisiparis');

  const nf = document.getElementById('o_name'); if(nf && nameVal) nf.value = nameVal;

function finalizeWaOrder(){
  if(!waParsedItems.length){ toast('Önce en az bir ürün ekleyin (mesajda bulunamadıysa yukarıdan elle seç)'); return; }
  const phone = (document.getElementById('wa_phone')||{value:''}).value.trim().replace(/[^0-9]/g,'');
  const name = (document.getElementById('wa_name')||{value:''}).value.trim();
  const address = (document.getElementById('wa_address')||{value:''}).value.trim();
  if(!name && !phone){ toast('Müşteri adı veya telefon gerekli'); return; }

  let cust = phone ? state.customers.find(x=>x.phone===phone) : null;
  if(!cust && name) cust = state.customers.find(x=>x.name===name);
  if(!cust){
    cust = {id: uid('cust'), name: name || 'WhatsApp Müşterisi', phone, address, note:''};
    state.customers.push(cust);
  } else {
    if(name) cust.name = name;
    if(phone) cust.phone = phone;
    if(address) cust.address = address;
  }

  const orderItems = waParsedItems.map(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    return {productId:p.id, name:p.name, color:it.color, size:it.size, qty:it.qty, price:(it.price!=null?it.price:p.price), unitCost:(p.purchasePrice||0)+(p.extraCost||0)};
  });
  const total = orderItems.reduce((s,i)=>s+i.qty*i.price,0);
  
  // 🎯 Kargo maliyeti (sabit ücret) ve dinamik reklam maliyeti - diğer sipariş oluşturma yollarıyla tutarlı olsun
  const cargoTotal = state.kargoUcreti || 260;
  let adCostPerShipment = 0;
  if(state.adBudget.active){
    const today = new Date().toDateString();
    const todayOrders = state.orders.filter(o => new Date(o.date).toDateString() === today);
    const todayCargoCount = todayOrders.length + 1;
    adCostPerShipment = Math.round(state.adBudget.dailyAmount / todayCargoCount);
  }
  
  const order = {
    id: uid('order'), orderNo: state.nextOrderNo++, date: todayISO(),
    customerId: cust.id, items: orderItems, total,
    status:'Yeni', cargo:'', tracking:'', note:'WhatsApp mesajından otomatik oluşturuldu',
    cargoPrice: cargoTotal, adCostDaily: adCostPerShipment,
    returns: [], barcode: nextBarcodeValue(), referencePhoto: waPhotoDataUrl || null
  };
  orderItems.forEach(i=>{
    const p = state.products.find(x=>x.id===i.productId);
    deductStockForItem(p, i);
  });
  state.orders.push(order);
  saveState();
  waParsedItems = [];
  waPhotoDataUrl = null;
  showWaOrderCreated(order.id);
}
