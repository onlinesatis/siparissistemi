function normalizePhone(phone){
  if(!phone) return '';
  const digits = String(phone).replace(/[^0-9]/g,'');
  return digits.slice(-10); // son 10 hane karşılaştır - başında 0/90 farkını yok sayar
}

function handleCargoExcelUpload(input){
  const resultBox = document.getElementById('cargoExcelResult');
  
  try{
    const file = input.files[0];
    if(!file){
      if(resultBox) resultBox.innerHTML = '<div class="card" style="background:#ffebee;margin-top:8px;">❌ Dosya seçilmedi.</div>';
      return;
    }
    
    if(resultBox) resultBox.innerHTML = '<div class="muted" style="margin-top:8px;">⏳ Dosya okunuyor: '+esc(file.name)+' ('+Math.round(file.size/1024)+' KB)...</div>';
    
    const reader = new FileReader();
    
    reader.onerror = () => {
      if(resultBox) resultBox.innerHTML = '<div class="card" style="background:#ffebee;margin-top:8px;">❌ Dosya okuma hatası oluştu. Dosyayı tekrar seçip deneyin.</div>';
    };
    
    reader.onload = (e) => {
      try{
        let text = e.target.result;
        if(typeof text !== 'string' || text.length === 0){
          if(resultBox) resultBox.innerHTML = '<div class="card" style="background:#ffebee;margin-top:8px;">❌ Dosya içeriği boş veya okunamayan bir formatta.</div>';
          return;
        }
        
        // BOM (görünmez karakter) varsa temizle
        text = text.replace(/^\uFEFF/, '').trim();
        
        if(resultBox) resultBox.innerHTML = '<div class="muted" style="margin-top:8px;">⏳ Analiz ediliyor... ('+text.length+' karakter okundu)</div>';
        
        let rows;
        if(text.startsWith('<?xml') || text.indexOf('ss:Workbook') !== -1 || text.indexOf('urn:schemas-microsoft-com:office:spreadsheet') !== -1){
          // Aras Kargo'nun "Excel 2003 XML (SpreadsheetML)" formatı - kendi parser'ımızla oku
          rows = parseArasSpreadsheetXML(text);
        } else {
          // Normal .xlsx/.csv dosyası - SheetJS ile oku
          const wb = XLSX.read(text, {type:'binary'});
          const sheetName = wb.SheetNames[0];
          const sheet = wb.Sheets[sheetName];
          rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
        }
        
        if(resultBox) resultBox.innerHTML = '<div class="muted" style="margin-top:8px;">⏳ '+(rows?rows.length:0)+' satır bulundu, eşleştiriliyor...</div>';
        
        processCargoExcelData(rows);
      }catch(err){
        if(resultBox) resultBox.innerHTML = '<div class="card" style="background:#ffebee;margin-top:8px;"><b>❌ Analiz hatası:</b> '+esc(err.message)+'<br><span style="font-size:11px;">Hata detayı: '+esc(err.stack ? err.stack.split('\n')[0] : '')+'</span></div>';
      }
    };
    
    reader.readAsText(file, 'UTF-8');
  }catch(outerErr){
    if(resultBox) resultBox.innerHTML = '<div class="card" style="background:#ffebee;margin-top:8px;"><b>❌ Beklenmeyen hata:</b> '+esc(outerErr.message)+'</div>';
  }
}

function parseArasSpreadsheetXML(text){
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(text, 'text/xml');
  
  const parseError = xmlDoc.getElementsByTagName('parsererror');
  if(parseError.length > 0){
    throw new Error('XML dosyası okunamadı (bozuk format)');
  }
  
  const ns = 'urn:schemas-microsoft-com:office:spreadsheet';
  const worksheets = xmlDoc.getElementsByTagNameNS(ns, 'Worksheet');
  if(worksheets.length === 0){
    throw new Error('Dosyada sayfa (Worksheet) bulunamadı');
  }
  
  // İlk worksheet'i al (Sheet1)
  const table = worksheets[0].getElementsByTagNameNS(ns, 'Table')[0];
  if(!table){
    throw new Error('Dosyada veri tablosu bulunamadı');
  }
  
  const rowElements = table.getElementsByTagNameNS(ns, 'Row');
  const rows = [];
  
  for(let r=0; r<rowElements.length; r++){
    const cellElements = rowElements[r].getElementsByTagNameNS(ns, 'Cell');
    const rowData = [];
    for(let c=0; c<cellElements.length; c++){
      const dataElements = cellElements[c].getElementsByTagNameNS(ns, 'Data');
      rowData.push(dataElements.length > 0 ? dataElements[0].textContent : '');
    }
    rows.push(rowData);
  }
  
  if(rows.length === 0){
    throw new Error('Dosyada hiç satır bulunamadı');
  }
  
  return rows;
}

function processCargoExcelData(rows){
  const resultBox = document.getElementById('cargoExcelResult');
  if(!rows || rows.length < 2){
    if(resultBox) resultBox.innerHTML = '<div class="card" style="background:#ffebee;margin-top:8px;">❌ Excel dosyası boş veya okunamadı!</div>';
    return;
  }
  
  const header = rows[0].map(h => String(h||'').trim());
  const idx = {
    telefon: header.indexOf('Telefon'),
    durum: header.indexOf('Durum'),
    isim: header.indexOf('Alıcı Adı Soyadı'),
    tutar: header.indexOf('Tutar'),
    sube: header.indexOf('Şube')
  };
  
  if(idx.telefon === -1 || idx.durum === -1){
    if(resultBox) resultBox.innerHTML = '<div class="card" style="background:#ffebee;margin-top:8px;"><b>❌ Beklenen sütunlar bulunamadı.</b><br>"Telefon" ve "Durum" sütunlarını içeren bir Aras Kargo Excel dosyası yükleyin.</div>';
    return;
  }
  
  const IADE_KARGO_UCRETI = state.kargoUcreti; // Aras Kargo'nun iade gönderisi başına sabit ücreti
  let teslimSayisi = 0, iadeSayisi = 0, eslesmeyenSayisi = 0, atlananSayisi = 0;
  let teslimCiro = 0, iadeCiro = 0, iadeKargoBedeli = 0;
  const eslesmeyenler = [];
  const teslimListesi = [];
  const iadeListesi = [];
  const subeListesi = []; // Şubede / Dağıtımda olanlar - WhatsApp mesajı hazır bekleyecek
  
  for(let i=1; i<rows.length; i++){
    const row = rows[i];
    if(!row || row.length === 0) continue;
    
    const phone = normalizePhone(row[idx.telefon]);
    const durum = String(row[idx.durum]||'').trim();
    const durumLower = durum.toLocaleLowerCase('tr');
    const isim = row[idx.isim] || '';
    
    if(!phone || !durum) continue;
    
    let newStatus = null;
    let isSubeDurumu = false;
    if(durum === 'Teslim') newStatus = 'Teslim Edildi';
    else if(durum === 'Iade' || durum === 'İade') newStatus = 'İade Edildi';
    else if(durumLower.indexOf('şube') !== -1 || durumLower.indexOf('sube') !== -1 || durumLower.indexOf('dağıtım') !== -1 || durumLower.indexOf('dagitim') !== -1){
      isSubeDurumu = true; // durum değişmiyor, sadece bildirim hazırlanacak
    }
    else { atlananSayisi++; continue; } // bilinmeyen durum - dokunma
    
    // Eşleşen siparişi bul: telefon eşleşen VE hâlâ "Kargoya Verildi" durumunda olan
    const matchingOrders = state.orders.filter(o => {
      if(o.status !== 'Kargoya Verildi') return false;
      const c = state.customers.find(x => x.id === o.customerId);
      if(!c) return false;
      return normalizePhone(c.phone) === phone;
    });
    
    if(matchingOrders.length === 0){
      eslesmeyenSayisi++;
      eslesmeyenler.push(esc(isim) + ' — ' + esc(row[idx.telefon]) + ' (' + esc(durum) + ')');
      continue;
    }
    
    if(isSubeDurumu){
      matchingOrders.forEach(order => {
        const subeAdi = idx.sube !== -1 ? String(row[idx.sube]||'').trim() : '';
        order.subeAdi = subeAdi;
        // Daha önce şube bildirimi gönderilmiş mi kontrolü (mükerrer önle)
        if(!order.subeMesajiGosterildi){
          subeListesi.push({orderId: order.id, name: isim, phone: row[idx.telefon], sube: subeAdi});
          order.subeMesajiGosterildi = true;
        }
      });
      continue;
    }
    
    matchingOrders.forEach(order => {
      order.status = newStatus;
      if(newStatus === 'İade Edildi'){
        const c = state.customers.find(x => x.id === order.customerId);
        if(c && !c.blacklisted){
          c.blacklisted = true;
          c.blacklistReason = 'İade Yapılan Müşteri';
          c.blacklistDate = new Date().toLocaleDateString('tr-TR');
        }
        iadeSayisi++;
        iadeCiro += order.total;
        iadeKargoBedeli += IADE_KARGO_UCRETI;
        iadeListesi.push({name: isim, phone: row[idx.telefon], tutar: order.total});
        
        // İadeler paneline otomatik kayıt düş (mükerrer eklememek için kontrol et)
        if(!order.returns) order.returns = [];
        const zatenEklendi = order.returns.some(r => r.source === 'kargo-excel');
        if(!zatenEklendi){
          order.items.forEach((item, itemIdx) => {
            order.returns.push({
              id: uid('ret'), date: todayISO(), type: 'iade',
              name: item.name, color: item.color, size: item.size, qty: item.qty, price: item.price,
              // Kargo iade ücreti sipariş başına 1 kez sayılır (ilk üründe), diğer ürünlerde 0
              returnCargoPrice: itemIdx === 0 ? IADE_KARGO_UCRETI : 0,
              note: 'Aras Kargo Excel ile otomatik iade — '+state.kargoUcreti+'₺ iade kargo ücreti dahil',
              source: 'kargo-excel', received: false
            });
          });
        }
      } else {
        teslimSayisi++;
        teslimCiro += order.total;
        teslimListesi.push({name: isim, phone: row[idx.telefon], tutar: order.total});
      }
    });
  }
  
  saveState();
  
  // HÂLÂ YOLDA OLANLAR (bu excel'de eşleşmeyen, hâlâ Kargoya Verildi durumunda kalanlar) - gün sayısı ile
  const yoldaOlanlar = state.orders.filter(o => o.status === 'Kargoya Verildi').map(o => {
    const c = state.customers.find(x => x.id === o.customerId);
    const shipped = o.shippedDate ? new Date(o.shippedDate) : new Date(o.date);
    const gunSayisi = Math.max(0, Math.floor((new Date() - shipped) / (1000*60*60*24)));
    return {name: c ? c.name : '—', phone: c ? c.phone : '—', gun: gunSayisi, orderNo: o.orderNo, tutar: o.total};
  }).sort((a,b) => b.gun - a.gun);
  const yoldaCiro = yoldaOlanlar.reduce((s,x) => s + x.tutar, 0);
  
  const listTable = (list, emptyText) => {
    if(list.length === 0) return '<div class="muted" style="font-size:12px;">'+emptyText+'</div>';
    return '<table style="font-size:12px;width:100%;"><tr><th>Ad Soyad</th><th>Telefon</th><th>Tutar</th></tr>'+
      list.map(x => '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+fmtMoney(x.tutar)+'</td></tr>').join('')+
      '</table>';
  };
  
  const yoldaTable = () => {
    if(yoldaOlanlar.length === 0) return '<div class="muted" style="font-size:12px;">Yolda sipariş yok</div>';
    return '<table style="font-size:12px;width:100%;"><tr><th>Ad Soyad</th><th>Telefon</th><th>Tutar</th><th>Kaç Gündür Yolda</th></tr>'+
      yoldaOlanlar.map(x => {
        const renk = x.gun >= 5 ? '#EF4444' : (x.gun >= 3 ? '#F59E0B' : '#10B981');
        return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+fmtMoney(x.tutar)+'</td><td><b style="color:'+renk+';">'+x.gun+' gün</b></td></tr>';
      }).join('')+
      '</table>';
  };
  
  const resultHtml = 
    '<div class="card" style="background:#e3f2fd;border-left:4px solid #1976D2;margin-top:8px;">'+
      '<h3 style="margin-top:0;">💰 Genel Özet</h3>'+
      '<div class="grid cols-3" style="gap:8px;text-align:center;">'+
        '<div><div style="font-size:11px;color:var(--muted);">Teslim Ciro</div><div style="font-size:16px;font-weight:800;color:#10B981;">'+fmtMoney(teslimCiro)+'</div></div>'+
        '<div><div style="font-size:11px;color:var(--muted);">İade Ciro</div><div style="font-size:16px;font-weight:800;color:#EF4444;">'+fmtMoney(iadeCiro)+'</div></div>'+
        '<div><div style="font-size:11px;color:var(--muted);">Yolda Ciro</div><div style="font-size:16px;font-weight:800;color:#F59E0B;">'+fmtMoney(yoldaCiro)+'</div></div>'+
      '</div>'+
      (iadeSayisi > 0 ? '<div style="margin-top:10px;padding-top:10px;border-top:1px dashed #90CAF9;text-align:center;">'+
        '<div style="font-size:11px;color:var(--muted);">🔴 İade Kargo Ücreti ('+iadeSayisi+' adet × '+fmtMoney(state.kargoUcreti)+')</div>'+
        '<div style="font-size:18px;font-weight:800;color:#d32f2f;">-'+fmtMoney(iadeKargoBedeli)+'</div>'+
      '</div>' : '')+
    '</div>'+
    '<div class="card" style="background:#e8f5e9;border-left:4px solid #10B981;margin-top:8px;">'+
      '<h3 style="margin-top:0;">✓ Teslim Edildi ('+teslimSayisi+') — Toplam: '+fmtMoney(teslimCiro)+'</h3>'+
      listTable(teslimListesi, 'Bu yüklemede teslim edilen yok')+
    '</div>'+
    '<div class="card" style="background:#ffebee;border-left:4px solid #EF4444;margin-top:8px;">'+
      '<h3 style="margin-top:0;">↩ İade Edildi ('+iadeSayisi+') — Ürün: '+fmtMoney(iadeCiro)+' + Kargo İade Ücreti: '+fmtMoney(iadeKargoBedeli)+'</h3>'+
      listTable(iadeListesi, 'Bu yüklemede iade edilen yok')+
    '</div>'+
    '<div class="card" style="background:#fff3e0;border-left:4px solid #F59E0B;margin-top:8px;">'+
      '<h3 style="margin-top:0;">📦 Hâlâ Yolda Olanlar ('+yoldaOlanlar.length+') — Toplam: '+fmtMoney(yoldaCiro)+'</h3>'+
      yoldaTable()+
    '</div>'+
    (subeListesi.length > 0 ?
      '<div class="card" style="background:#e3f2fd;border-left:4px solid #2196F3;margin-top:8px;">'+
        '<h3 style="margin-top:0;">🚚 Şubeye Ulaştı / Dağıtımda ('+subeListesi.length+')</h3>'+
        '<p class="muted" style="font-size:12px;">Bu müşterilere şube bilgisiyle birlikte hazır mesaj var. Her birine tıklayıp WhatsApp\'tan gönder.</p>'+
        '<table style="font-size:12px;width:100%;"><tr><th>Ad Soyad</th><th>Telefon</th><th>Şube</th><th></th></tr>'+
        subeListesi.map(x => '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.sube||'—')+'</td><td><button class="btn small" style="background:#2196F3;color:white;" onclick="sendOutForDeliveryMessage(\''+x.orderId+'\')">💬 WhatsApp Gönder</button></td></tr>').join('')+
        '</table>'+
      '</div>' : '')+
    (eslesmeyenSayisi > 0 || atlananSayisi > 0 ? 
      '<div class="card" style="margin-top:8px;">'+
        (eslesmeyenSayisi > 0 ? '<div style="color:#F59E0B;">⚠️ Eşleşmeyen: <b>'+eslesmeyenSayisi+'</b> (sistemde "Yolda" durumunda kayıtlı bulunamadı)</div>' : '')+
        (atlananSayisi > 0 ? '<div style="color:#999;font-size:12px;">— Bilinmeyen/işlenmeyen durum, atlandı: '+atlananSayisi+'</div>' : '')+
        (eslesmeyenler.length > 0 ? '<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12px;">Eşleşmeyenleri gör</summary><div style="font-size:11px;color:#666;margin-top:4px;">'+eslesmeyenler.slice(0,30).join('<br>')+'</div></details>' : '')+
      '</div>' : '');
  
  if(resultBox) resultBox.innerHTML = resultHtml;
  toast('✅ '+(teslimSayisi+iadeSayisi)+' sipariş güncellendi!');
}

function exportCargoToExcel(){
  // Yolda olan kargolar filtrele
  let orders = state.orders.filter(o=>o.status==='Kargoya Verildi');
  
  // Tarih filtresi
  if(ui.cargoDateFrom || ui.cargoDateTo){
    const dateFrom = ui.cargoDateFrom ? new Date(ui.cargoDateFrom) : new Date('1900-01-01');
    const dateTo = ui.cargoDateTo ? new Date(ui.cargoDateTo) : new Date('2100-12-31');
    orders = orders.filter(o=>{
      const oDate = new Date(o.date);
      return oDate >= dateFrom && oDate <= dateTo;
    });
  }
  
  if(orders.length === 0){
    alert('Yolda olan kargo bulunamadı');
    return;
  }
  
  // Excel verileri
  const data = [];
  const headers = ['Tarih', 'Sipariş No', 'Müşteri', 'Telefon', 'Ürün', 'Renk', 'Beden', 'Adet', 'Fiyat', 'Toplam', 'Tracking No', 'Durum'];
  data.push(headers);
  
  orders.forEach(o=>{
    const c = state.customers.find(x=>x.id===o.customerId);
    o.items.forEach(item=>{
      data.push([
        new Date(o.date).toLocaleDateString('tr-TR'),
        o.orderNo,
        c?c.name:'—',
        c?c.phone:'—',
        item.name,
        item.color||'—',
        item.size||'—',
        item.qty,
        fmtMoney(item.price),
        fmtMoney(item.qty * item.price),
        o.tracking||'—',
        o.status
      ]);
    });
  });
  
  // Excel oluştur
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Yolda Kargolar');
  
  // Sütun genişlikleri
  ws['!cols'] = [
    {wch: 12}, // Tarih
    {wch: 10}, // Sipariş No
    {wch: 15}, // Müşteri
    {wch: 14}, // Telefon
    {wch: 20}, // Ürün
    {wch: 12}, // Renk
    {wch: 10}, // Beden
    {wch: 8},  // Adet
    {wch: 10}, // Fiyat
    {wch: 12}, // Toplam
    {wch: 15}, // Tracking
    {wch: 12}  // Durum
  ];
  
  const fileName = 'Yolda_Kargolar_'+new Date().toLocaleDateString('tr-TR').replace(/\./g,'-')+'.xlsx';
  XLSX.writeFile(wb, fileName);
  toast('✓ Excel dosyası indirildi: '+fileName);
}

      });

    }

  }

function downloadFullBackup(){
  const backup = {
    exportDate: new Date().toISOString(),
    appVersion: '1.0',
    state: state
  };
  
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'siparis-yedek-'+new Date().toLocaleDateString('tr-TR').replace(/\./g,'-')+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  toast('✅ Yedek indirildi! Yeni dosyayı açtıktan sonra bu dosyayı yükleyerek geri getirebilirsin.');
}

function restoreFullBackup(input){
  const file = input.files[0];
  if(!file){ return; }
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const backup = JSON.parse(e.target.result);
      const restoredState = backup.state || backup; // eski formatları da destekle
      
      if(!restoredState.products || !restoredState.customers || !restoredState.orders){
        toast('❌ Geçersiz yedek dosyası!');
        return;
      }
      
      const productCount = restoredState.products.length;
      const customerCount = restoredState.customers.length;
      const orderCount = restoredState.orders.length;
      
      if(confirm('Bu yedek '+productCount+' ürün, '+customerCount+' müşteri, '+orderCount+' sipariş içeriyor.\n\nMevcut verilerin ÜZERİNE yazılacak. Devam edilsin mi?')){
        state = restoredState;
        saveState();
        toast('✅ Veriler geri yüklendi! '+productCount+' ürün, '+customerCount+' müşteri, '+orderCount+' sipariş');
        renderMain();
      }
    }catch(err){
      toast('❌ Dosya okunamadı: '+err.message);
    }
  };
  reader.readAsText(file);
}

function clearOldOrders(){
  const today = new Date();
  today.setDate(today.getDate() - 90); // 90 gün önce
  const oldCount = state.orders.filter(o => new Date(o.date) < today).length;
  
  if(oldCount === 0){
    toast('⚠️ 90 gün üzerindeki sipariş bulunamadı');
    return;
  }
  
  if(!confirm('⚠️ '+oldCount+' eski sipariş silinecek!\n\nBu işlem geri alınamaz!\n\nDevam et?')) return;
  
  state.orders = state.orders.filter(o => new Date(o.date) >= today);
  saveState();
  toast('✅ '+oldCount+' eski sipariş silindi! Depolama: '+Math.round(JSON.stringify(state).length/1024)+'KB');
  renderMain();
}

function saveAdBudget(){
  const dailyAmount = parseFloat(document.getElementById('ad_budget_daily').value) || 0;
  const startDate = document.getElementById('ad_budget_start').value;
  const endDate = document.getElementById('ad_budget_end').value;
  const active = document.getElementById('ad_budget_active').checked;
  
  if(dailyAmount <= 0 && active){
    toast('⚠️ Günlük reklam bütçesi 0\'dan büyük olmalı');
    return;
  }
  
  if(startDate && endDate && new Date(startDate) > new Date(endDate)){
    toast('⚠️ Başlangıç tarihi bitiş tarihinden önce olmalı');
    return;
  }
  
  state.adBudget.dailyAmount = dailyAmount;
  state.adBudget.startDate = startDate;
  state.adBudget.endDate = endDate;
  state.adBudget.active = active;
  
  // Eğer bittiğinde göster
  if(!active && state.adBudget.endDate){
    const days = calculateDaysBetween(state.adBudget.startDate, state.adBudget.endDate);
    state.adBudget.totalSpent = dailyAmount * days;
    toast('✅ Reklam Bütçesi Kaydedildi\n💸 Toplam: '+fmtMoney(state.adBudget.totalSpent)+'\n📦 Kargo Başına: '+fmtMoney(state.adBudget.shipmentCount > 0 ? state.adBudget.totalSpent/state.adBudget.shipmentCount : 0));
  } else {
    toast('✅ Reklam bütçesi kaydedildi');
  }
  
  saveState();
  renderCart(); // Sepeti güncelle
  renderMain(); // UI yenile
}

function updatePeriodStats(){
  const startInput = document.getElementById('period_start');
  const endInput = document.getElementById('period_end');
  
  if(!startInput || !endInput) return;
  
  const startDate = startInput.value;
  const endDate = endInput.value;
  
  if(!startDate || !endDate){
    toast('⚠️ Her iki tarihi de seçiniz');
    return;
  }
  
  if(new Date(startDate) > new Date(endDate)){
    toast('⚠️ Başlangıç tarihi bitiş tarihinden önce olmalı');
    return;
  }
  
  // UI'a kaydet
  ui.reklamStartDate = startDate;
  ui.reklamEndDate = endDate;
  
  // Sayfayı yenile (dinamik hesaplama tekrar yapılacak)
  renderMain();
  toast('✅ Dönem filtresi uygulandı');
}

function finishAdBudget(){
  const endDate = document.getElementById('ad_budget_end').value;
  if(!endDate){
    toast('⚠️ Bitiş tarihini girin');
    return;
  }
  
  // Başlangıç - Bitiş arasındaki gün sayısı
  const days = calculateDaysBetween(state.adBudget.startDate, endDate);
  state.adBudget.totalSpent = state.adBudget.dailyAmount * days;
  
  // Tarih aralığında siparişleri say
  const startD = new Date(state.adBudget.startDate);
  const endD = new Date(endDate);
  endD.setDate(endD.getDate() + 1);
  
  const shipmentCount = state.orders.filter(o => {
    const oDate = new Date(o.date);
    return oDate >= startD && oDate < endD;
  }).length;
  
  state.adBudget.shipmentCount = shipmentCount;
  state.adBudget.active = false;
  
  saveState();
  
  const costPerShipment = shipmentCount > 0 ? state.adBudget.totalSpent / shipmentCount : 0;
  
  toast('✅ Reklam Bütçesi Bitti!\n\n'+
    '📊 Süre: '+state.adBudget.startDate+' → '+endDate+' ('+days+' gün)\n'+
    '💰 Günlük: '+fmtMoney(state.adBudget.dailyAmount)+'\n'+
    '💸 Toplam Harcanan: '+fmtMoney(state.adBudget.totalSpent)+'\n'+
    '📦 Toplam Kargo: '+shipmentCount+'\n'+
    '🔢 Kargo Başına: '+fmtMoney(costPerShipment));
  
  renderMain();
}

function calculateDaysBetween(start, end){
  if(!start || !end) return 0;
  const d1 = new Date(start);
  const d2 = new Date(end);
  const diff = Math.abs(d2 - d1);
  return Math.ceil(diff / (1000 * 60 * 60 * 24)) + 1; // +1 start günü katmak için
}

function updateAdBudgetDisplay(){
  const dailyInput = document.getElementById('ad_budget_daily');
  if(!dailyInput) return;
  
  if(state.adBudget.active && state.adBudget.startDate){
    const today = new Date().toISOString().split('T')[0];
    const days = calculateDaysBetween(state.adBudget.startDate, today);
    const spent = state.adBudget.dailyAmount * days;
    
    const countEl = document.getElementById('ad_total_days');
    const spentEl = document.getElementById('ad_total_spent');
    const shipEl = document.getElementById('ad_shipment_count');
    const costEl = document.getElementById('ad_cost_per_shipment');
    
    if(countEl) countEl.innerHTML = '📊 Gün Sayısı: <b>'+days+'</b>';
    if(spentEl) spentEl.innerHTML = '💸 Toplam Harcanan: <b>'+fmtMoney(spent)+'</b>';
    
    // Şu ana kadar siparişleri say
    const startD = new Date(state.adBudget.startDate);
    const todayD = new Date(today);
    todayD.setDate(todayD.getDate() + 1);
    
    const shipmentCount = state.orders.filter(o => {
      const oDate = new Date(o.date);
      return oDate >= startD && oDate < todayD;
    }).length;
    
    if(shipEl) shipEl.innerHTML = '📦 Toplam Kargo: <b>'+shipmentCount+'</b>';
    if(costEl) costEl.innerHTML = '🔢 Kargo Başına: <b>'+fmtMoney(shipmentCount > 0 ? spent/shipmentCount : 0)+'</b>';
  }
}

function getAdCostPerShipment(){
  if(!state.adBudget.active) return 0;
  if(state.adBudget.totalSpent === 0 && state.adBudget.shipmentCount === 0) return 0;
  
  return state.adBudget.shipmentCount > 0 ? state.adBudget.totalSpent / state.adBudget.shipmentCount : 0;
}

function exportExcel(){
  const wb = XLSX.utils.book_new();
  const prodRows = [];
  state.products.forEach(p=>productVariants(p).forEach(v=>{
    prodRows.push({Urun:p.name, Barkod:p.barcode||'', Kategori:p.category, Renk:v.color, Beden:v.size, AlisFiyati:p.purchasePrice||0, KargoReklamGideri:p.extraCost||0, SatisFiyati:p.price, BirimKar:unitProfit(p), Stok:getStock(p,v.color,v.size), DusukEsik:p.lowThreshold});
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prodRows), 'Urunler');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.customers.map(c=>({Ad:c.name,Telefon:c.phone,Adres:c.address,Not:c.note}))), 'Musteriler');
  const orderRows=[];
  state.orders.forEach(o=>{
    const c = state.customers.find(x=>x.id===o.customerId);
    o.items.forEach(i=>orderRows.push({SiparisNo:o.orderNo, Tarih:new Date(o.date).toLocaleString('tr-TR'), Musteri:c?c.name:'', Telefon:c?c.phone:'', Urun:i.name, Renk:i.color, Beden:i.size, Adet:i.qty, Fiyat:i.price, Tutar:i.qty*i.price, Kar:(i.price-(i.unitCost||0))*i.qty, Durum:o.status, Kargo:o.cargo, TakipNo:o.tracking}));
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(orderRows), 'Siparisler');
  XLSX.writeFile(wb, 'siparis-yonetim-'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function importExcel(){
  const file = document.getElementById('importFile').files[0];
  if(!file){ toast('Dosya seçin'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      if(wb.SheetNames.includes('Urunler')){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Urunler']);
        rows.forEach(r=>{
          let p = state.products.find(x=>x.name===r.Urun);
          const priceVal = r.SatisFiyati!=null ? r.SatisFiyati : r.Fiyat;
          if(!p){ p = {id:uid('prod'), name:r.Urun, category:r.Kategori||'', price:parseFloat(priceVal)||0, purchasePrice:parseFloat(r.AlisFiyati)||0, extraCost:parseFloat(r.KargoReklamGideri)||0, colors:[], sizes:[], lowThreshold:parseInt(r.DusukEsik)||3, stock:{}, photo:null, barcode:r.Barkod?String(r.Barkod):nextBarcodeValue()}; state.products.push(p); }
          if(r.Renk && !p.colors.includes(r.Renk)) p.colors.push(r.Renk);
          if(r.Beden!=null && !p.sizes.includes(String(r.Beden))) p.sizes.push(String(r.Beden));
          if(priceVal) p.price = parseFloat(priceVal);
          if(r.AlisFiyati!=null) p.purchasePrice = parseFloat(r.AlisFiyati)||0;
          if(r.KargoReklamGideri!=null) p.extraCost = parseFloat(r.KargoReklamGideri)||0;
          setStock(p, r.Renk, String(r.Beden), parseInt(r.Stok)||0);
        });
      }
      if(wb.SheetNames.includes('Musteriler')){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Musteriler']);
        rows.forEach(r=>{
          let c = state.customers.find(x=>x.phone===String(r.Telefon) || x.name===r.Ad);
          if(!c){ c={id:uid('cust'), name:r.Ad, phone:String(r.Telefon||''), address:r.Adres||'', note:r.Not||''}; state.customers.push(c); }
          else { c.address = r.Adres||c.address; c.note=r.Not||c.note; }
        });
      }
      saveState(); toast('İçe aktarma tamamlandı'); renderMain();
    }catch(err){ toast('Dosya okunamadı'); }
  };
  reader.readAsArrayBuffer(file);
}

/* ================= INIT ================= */
async function init(){
  await loadState();
  renderNav();
  document.getElementById('shopTitle').textContent = state.shopName;
  renderMain();
  
  // QR kod ile URL üzerinden gelindiyse (örn: ...html?order=1042) o siparişi otomatik aç
  // Bulut verisi (Firebase) geç gelebileceği için birkaç kez tekrar dener (toplam ~8 saniye)
  const urlParams = new URLSearchParams(window.location.search);
  const orderNoParam = urlParams.get('order');
  if(orderNoParam){
    let denemeSayisi = 0;
    const maxDeneme = 8;
    const araDeneme = setInterval(()=>{
      denemeSayisi++;
      const order = state.orders.find(o => String(o.orderNo) === String(orderNoParam));
      if(order){
        clearInterval(araDeneme);
        viewOrderDetail(order.id);
      } else if(denemeSayisi >= maxDeneme){
        clearInterval(araDeneme);
        toast('QR\'daki sipariş (#'+orderNoParam+') bulunamadı');
      }
    }, 1000);
  }
}
init();
