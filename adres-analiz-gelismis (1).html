function createOrder(){
  if(!cart.length){ toast('Sepet boş'); return; }
  if(cartHasMissingSizes()){ toast('❌ Sepette bedeni seçilmemiş ek adet var, önce hepsine beden seç'); return; }
  
  let custId = null;
  const custElement = document.getElementById('o_customer');
  if(custElement) custId = custElement.value;
  
  const name = document.getElementById('o_name').value.trim();
  const phone = document.getElementById('o_phone').value.trim().replace(/[^0-9]/g,'');
  const address = document.getElementById('o_address')?.value.trim() || '';
  const city = document.getElementById('o_city')?.value.trim() || '';
  const district = document.getElementById('o_district')?.value.trim() || '';
  
  // 🚨 KARA LİSTE KONTROLÜ
  const existingWithPhone = getBlacklistStatus(phone, null);
  const existingWithAddress = getBlacklistStatus(null, address);
  const blockedCustomers = [...new Set([...existingWithPhone, ...existingWithAddress])];
  
  if(blockedCustomers.length > 0){
    const blocked = blockedCustomers[0];
    if(!confirm('⚠️ DİKKAT!\n\nBu telefon veya adres KARA LİSTEDE:\n\n👤 '+esc(blocked.name)+'\n📞 '+esc(blocked.phone)+'\n🏠 '+esc(blocked.address)+'\n\n❌ Neden: '+esc(blocked.blacklistReason)+'\n\nYine de sipariş oluşturmak istiyor musunuz?')){
      return;
    }
  }
  
  if(!custId){
    if(!name){ toast('Müşteri adı gerekli'); return; }
    const c = {id: uid('cust'), name, phone, address: address, city, district, note:'', blacklisted: false, blacklistReason: '', blacklistDate: ''};
    state.customers.push(c); custId = c.id;
  } else {
    const c = state.customers.find(x=>x.id===custId);
    if(c){
      if(name) c.name=name; 
      if(phone) c.phone=phone;
      if(address) c.address=address;
      if(city) c.city=city;
      if(district) c.district=district;
    }
  }
  const total = cart.reduce((s,i)=>s+cartLineTotal(i),0);
  const cartCargoTotal = cart.reduce((s,i)=>s+(i.cargoPrice||0),0);
  const generalCargoPrice = parseFloat(document.getElementById('o_cargoprice_gidiş')?.value)
    || parseFloat(document.getElementById('neworder_cargo')?.value)
    || parseFloat(document.getElementById('kombin_cargo')?.value)
    || state.kargoUcreti || 260;
  const cargoTotal = cartCargoTotal + generalCargoPrice;
  
  // 🎯 DİNAMİK REKLAM MALİYETİ - Bugün Kargo Başına
  let adCostPerShipment = 0;
  if(state.adBudget.active){
    const today = new Date().toDateString();
    const todayOrders = state.orders.filter(o => new Date(o.date).toDateString() === today);
    const todayCargoCount = todayOrders.length + 1; // yeni sipariş dahil
    adCostPerShipment = Math.round(state.adBudget.dailyAmount / todayCargoCount);
  }
  
  // Hızlı satıştan gelen siparişi 'Teslim Edildi' durumunda oluştur
  const status = ui.quickSale ? 'Teslim Edildi' : 'Yeni';
  
  const order = {
    id: uid('order'), orderNo: state.nextOrderNo++, date: todayISO(),
    customerId: custId, items: expandCartToOrderItems(cart), total,
    status: status, cargo: document.getElementById('o_cargo').value.trim(),
    cargoPrice: cargoTotal,
    adCostDaily: adCostPerShipment,
    tracking: document.getElementById('o_track').value.trim(),
    note: document.getElementById('o_note').value.trim(),
    returns: [], barcode: nextBarcodeValue()
  };
  
  // Stok güncelle (SADECE galeri ürünleri için - manuel ürünler için değil)
  cart.forEach(i=>{
    if(!i.isManual){
      const p = state.products.find(x=>x.id===i.productId);
      if(p) deductStockForItem(p, i);
    }
  });
  
  state.orders.push(order);
  cart = [];
  ui.quickSale = false; // Flag'i sıfırla
  saveState();
  showOrderReadyHub(order.id);
}

/* ================= WHATSAPP MESSAGE ================= */
function buildOrderMessage(order, kind){
  const c = state.customers.find(x=>x.id===order.customerId);
  const lines = [];
  lines.push('Merhaba '+(c?c.name:'')+' 👋');
  if(kind==='created'){
    lines.push('Siparişiniz alınmıştır. Sipariş No: #'+order.orderNo);
    lines.push('');
    order.items.forEach(i=>lines.push('• '+i.name+' — '+i.color+' / '+i.size+' × '+i.qty+' — '+fmtMoney(i.qty*i.price)));
    lines.push('');
    lines.push('Toplam Tutar: '+fmtMoney(order.total));
    if(order.cargo) lines.push('Kargo: '+order.cargo);
    lines.push('');
    lines.push('Siparişiniz için teşekkür ederiz!');
  } else if(kind==='shipped'){
    lines.push('Siparişiniz (#'+order.orderNo+') kargoya verilmiştir 📦');
    if(order.cargo) lines.push('Kargo Firması: '+order.cargo);
    if(order.tracking){
      lines.push('Takip No: '+order.tracking);
      lines.push('');
      lines.push('📍 Kargonuzu takip etmek için:');
      lines.push('1️⃣ Linke tıklayın: https://ats.araskargo.com.tr/');
      lines.push('2️⃣ Takip numaranızı girin: '+order.tracking);
    }
  } else if(kind==='outfordelivery'){
    lines.push('Siparişiniz (#'+order.orderNo+') şubeye ulaştı, bugün dağıtıma çıkacaktır 🚚');
    lines.push('');
    lines.push('✅ Kargonuz bugün içerisinde adresinize teslim edilecektir.');
    if(order.subeAdi){
      lines.push('📍 Dilerseniz '+order.subeAdi+' Aras Kargo şubesinden de kendiniz teslim alabilirsiniz.');
    } else {
      lines.push('📍 Dilerseniz kargo şubesinden de kendiniz teslim alabilirsiniz.');
    }
    if(order.tracking) lines.push('');
    if(order.tracking) lines.push('Takip No: '+order.tracking);
  } else if(kind==='status'){
    lines.push('Sipariş #'+order.orderNo+' durumu güncellendi: '+order.status);
  }
  return lines.join('\n');
}
function showWhatsAppMessage(orderId, kind){
  const order = state.orders.find(o=>o.id===orderId);
  const c = state.customers.find(x=>x.id===order.customerId);

  const waLink = 'https://wa.me/'+(c&&c.phone?c.phone:'')+'?text='+encodeURIComponent(msg);

function todaysOrders(){
  const today = new Date(); today.setHours(0,0,0,0);
  return state.orders.filter(o=> new Date(o.date) >= today).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function buildDailyReportText(){
  const list = todaysOrders();
  const dateStr = new Date().toLocaleDateString('tr-TR');
  const lines = [];
  lines.push(state.shopName+' — Günlük Sipariş Raporu');
  lines.push('Tarih: '+dateStr);
  lines.push('Toplam Sipariş: '+list.length);
  lines.push('');
  if(!list.length){
    lines.push('Bugün için kayıtlı sipariş yok.');
  } else {
    list.forEach((o,idx)=>{
      const c = state.customers.find(x=>x.id===o.customerId);
      lines.push('— Sipariş #'+o.orderNo+' — '+o.status);
      lines.push('Müşteri: '+(c?c.name:'—')+(c&&c.phone?' ('+c.phone+')':''));
      lines.push('Adres: '+(c&&c.address?c.address:'—'));
      o.items.forEach(i=>{
        lines.push('  • '+i.name+' — '+i.color+'/'+i.size+' × '+i.qty+' — '+fmtMoney(i.qty*i.price));
      });
      lines.push('Sipariş Toplamı: '+fmtMoney(o.total));
      if(idx < list.length-1) lines.push('');
    });

function handleOrderBarcodeScan(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const code = e.target.value.trim();
  e.target.value = '';
  if(!code) return;
  
  // Önce QR formatını dene (sipariş no|telefon)
  let o = null;
  if(code.includes('|')){
    const orderNo = parseInt(code.split('|')[0]);
    o = state.orders.find(x=>x.orderNo===orderNo);
  }
  // Olmadıysa direkt barkod numarası olarak dene
  if(!o) o = state.orders.find(x=>x.barcode===code);
  
  if(!o){ toast('Bu barkoda/QR\'a ait sipariş bulunamadı: '+code); return; }
  viewOrderDetail(o.id);
}

function quickAddProductToOrder(productId, checked){
  if(!checked) return;
  
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  
  // En yüksek stoklu renk ve ilk beden seçimini yap
  let bestColor = null;
  let bestSize = null;
  let bestStock = 0;
  
  productVariants(p).forEach(v=>{
    const stock = getStock(p, v.color, v.size);
    if(stock > bestStock){
      bestStock = stock;
      bestColor = v.color;
      bestSize = v.size;
    }
  });
  
  if(!bestColor || !bestSize || bestStock <= 0){
    toast('❌ Stok yok: '+p.name);
    // Checkbox'u uncheck et
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(c=>{
      if(c.getAttribute('onchange') && c.getAttribute('onchange').includes(productId)){
        c.checked = false;
      }
    });
    return;
  }
  
  // Sepete ekle
  const existing = cart.find(i=>i.productId===p.id && i.size===bestSize && i.color===bestColor);
  if(existing){
    existing.qty++;
  } else {
    cart.push({
      productId: p.id,
      name: p.name,
      color: bestColor,
      size: bestSize,
      qty: 1,
      price: p.price,
      unitCost: p.purchasePrice
    });
  }
  
  saveState();
  renderMain();
  toast('✅ '+p.name+' ('+bestSize+') sepete eklendi');
}

  cart.push({

function quickSaleRowCombo(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const qty = parseInt(document.getElementById('qty_'+productId).value)||1;

  const kombin2Checked = document.getElementById('kombin2Toggle_'+productId) && document.getElementById('kombin2Toggle_'+productId).checked;

  const priceTotalEl = document.getElementById('priceTotal_'+productId);
  const priceTotalVal = priceTotalEl ? parseFloat(priceTotalEl.value) : NaN;
  const useTotalMode = kombin2Checked && !isNaN(priceTotalVal) && priceTotalEl.value.trim() !== '';

  const price1Input = parseFloat(document.getElementById('price_'+productId).value) || 0;
  const price2Input = kombin2Checked && document.getElementById('price2_'+productId) ? (parseFloat(document.getElementById('price2_'+productId).value) || 0) : 0;

  // Hangi parçaların (Üst/Alt) dolu (beden seçilmiş) olduğunu önceden say
  function getFilledParts(ustIdx, altIdx){
    const parts = [];
    if(document.getElementById('rowsize_'+productId+'_'+ustIdx).value) parts.push(ustIdx);
    if(document.getElementById('rowsize_'+productId+'_'+altIdx).value) parts.push(altIdx);
    return parts;
  }
  const k1Parts = getFilledParts(1,2);
  const k2Parts = kombin2Checked ? getFilledParts(3,4) : [];

  if(k1Parts.length === 0 && k2Parts.length === 0){ toast('❌ Lütfen en az bir beden seçin'); return; }

  // Her parçaya düşecek fiyatı hesapla: toplam modundaysa TÜM parçalara eşit böl,
  // değilse Kombin 1 kendi fiyatını kendi parçalarına, Kombin 2 kendi fiyatını kendi parçalarına eşit böler.
  const priceMap = {};
  if(useTotalMode){
    const allParts = k1Parts.concat(k2Parts);
    const share = allParts.length ? Math.round((priceTotalVal/allParts.length)*100)/100 : 0;
    allParts.forEach(idx=>{ priceMap[idx] = share; });
  } else {
    if(k1Parts.length){
      const share1 = Math.round((price1Input/k1Parts.length)*100)/100;
      k1Parts.forEach(idx=>{ priceMap[idx] = share1; });
    }
    if(k2Parts.length){
      const share2 = Math.round((price2Input/k2Parts.length)*100)/100;
      k2Parts.forEach(idx=>{ priceMap[idx] = share2; });
    }
  }

  function processPart(label, idx){
    const color = document.getElementById('rowcolor_'+productId+'_'+idx).value;
    const size = document.getElementById('rowsize_'+productId+'_'+idx).value;
    if(!size) return 0;
    const avail = getStock(p, color, size);
    if(avail < qty){ toast('❌ '+label+': '+color+'/'+size+' için yeterli stok yok (mevcut: '+avail+')'); return -1; }
    cart.push({productId:p.id, name:p.name+' ('+label+')', color, size, qty, price:priceMap[idx]||0, unitCost:(p.purchasePrice||0)+(p.extraCost||0)});
    return 1;
  }

  const partLabels = {1:'Kombin 1 Üst', 2:'Kombin 1 Alt', 3:'Kombin 2 Üst', 4:'Kombin 2 Alt'};
  let addedCount = 0;
  for(const idx of k1Parts.concat(k2Parts)){
    const r = processPart(partLabels[idx], idx);
    if(r === -1) return;
    addedCount += r;
  }

  const totalAdded = Object.values(priceMap).reduce((s,v)=>s+v*qty,0);
  toast('✅ Sepete eklendi ('+addedCount+' parça, toplam: '+fmtMoney(totalAdded)+')');
  renderMain();
}

function selectCompositeOption(idx, field, btnEl){
  const value = btnEl.dataset[field];
  document.getElementById('cs_'+field+'_'+idx).value = value;
  const container = btnEl.parentElement;
  container.querySelectorAll('button[data-'+field+']').forEach(b=>{
    b.style.border = '2px solid var(--line)';
    b.style.background = '#fff';
    b.style.color = 'var(--text)';
  });
  btnEl.style.border = '2px solid var(--orange)';
  btnEl.style.background = 'var(--orange)';
  btnEl.style.color = '#fff';
  updateCompositeSaleStock();
}
function updateCompositeSaleStock(){
  const box = document.getElementById('cs_stockHint');
  if(!box) return;
  box.textContent = 'Seçilen bedenlerdeki mevcut stoklar yukarıda kontrol edilir, kaydederken doğrulanır.';
}
function confirmCompositeSale(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const qty = parseInt(document.getElementById('cs_qty').value)||1;
  const chosenComponents = p.components.map((comp,idx)=>{
    const color = document.getElementById('cs_color_'+idx).value;
    const size = document.getElementById('cs_size_'+idx).value;
    return {productId: comp.productId, color, size, qtyPerUnit: comp.qtyPerUnit||1};
  });

  // Stok yeterli mi kontrol et
  for(const c of chosenComponents){
    const cp = state.products.find(x=>x.id===c.productId);
    const avail = getStock(cp, c.color, c.size);
    if(avail < c.qtyPerUnit*qty){
      toast('❌ "'+cp.name+'" için '+c.color+'/'+c.size+' bedeninde yeterli stok yok (mevcut: '+avail+')');
      return;
    }
  }

  const summaryLabel = chosenComponents.map(c=>{
    const cp = state.products.find(x=>x.id===c.productId);
    return cp.name+' ('+c.color+'/'+c.size+')';
  }).join(' + ');

  cart.push({
    productId: p.id, name: p.name, color: '-', size: summaryLabel, qty,
    price: p.price, unitCost: (p.purchasePrice||0)+(p.extraCost||0),
    isCompositeSale: true, chosenComponents
  });

  closeModal();
  toast('✅ Sepete eklendi: '+p.name+' ('+summaryLabel+') × '+qty);
  renderMain();
}
function startQuickSale(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  
  // Takım (bileşik) ürünse, her parçanın bedeni ayrı seçilmesi gerektiği için özel pencereye git
  if(p.isComposite){
    openCompositeSaleModal(productId);
    return;
  }
  
  // Input'tan gelen beden kontrol et
  let selectedSize = window.quickSaleSelectedSize;
  window.quickSaleSelectedSize = null; // Sıfırla
  
  let bestColor = null;
  let bestSize = null;
  let bestStock = 0;
  
  productVariants(p).forEach(v=>{
    const stock = getStock(p, v.color, v.size);
    
    // Eğer beden seçilmişse, o bedene göre ara
    if(selectedSize && v.size === selectedSize){
      if(stock > bestStock){
        bestStock = stock;
        bestColor = v.color;
        bestSize = v.size;
      }
    }
    // Yoksa en yüksek stoklu seç
    else if(!selectedSize && stock > bestStock){
      bestStock = stock;
      bestColor = v.color;
      bestSize = v.size;
    }
  });
  
  if(!bestColor || !bestSize || bestStock <= 0){
    toast('❌ Stok yok: '+p.name);
    return;
  }
  
  // Sepete ekle
  cart = [{
    productId: p.id,
    name: p.name,
    color: bestColor,
    size: bestSize,
    qty: 1,
    price: p.price,
    unitCost: p.purchasePrice
  }];
  
  // Hızlı satış flag'i set et
  ui.quickSale = true;
  
  // Yeni Sipariş sekmesine git
  saveState();
  goTab('yenisiparis');
  
  // Müşteri dropdown'unu focus et (biraz sonra, render edildikten sonra)
  setTimeout(()=>{
    const custSelect = document.getElementById('o_customer');
    if(custSelect) custSelect.focus();
    toast('✅ '+p.name+' hazır! Müşteri seçin');
  }, 200);
}

function quickStartOrder(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  
  const variants = productVariants(p);
  let html = '<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;">';
  
  // Fotoğraf (çok küçük, sol tarafta)
  if(p.photo){
    html += '<img src="'+p.photo+'" style="width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid var(--primary);flex-shrink:0;">';
  } else {
    html += '<div style="width:60px;height:60px;border-radius:8px;background:#e6f2ff;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:9px;flex-shrink:0;">Foto</div>';
  }
  
  // Başlık
  html += '<div style="flex:1;"><h2 style="margin:0;font-size:16px;">'+esc(p.name)+'</h2></div></div>';
  
  // Beden seçenekleri (checkbox sol, compact)
  html += '<div style="display:flex;flex-direction:column;gap:6px;">';
  
  // Bedenleri grupla ve unique olanları göster
  const sizes = [...new Set(productVariants(p).map(v=>v.size))];
  
  sizes.forEach(size=>{
    const stock = Math.max(...productVariants(p)
      .filter(v=>v.size===size)
      .map(v=>getStock(p, v.color, v.size)));
    
    const disabled = stock <= 0;
    
    html += '<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:'+(disabled?'not-allowed':'pointer')+';background:'+(disabled?'#f5f5f5':'#f9f9f9')+';opacity:'+(disabled?'0.5':'1')+';">'+
      '<input type="checkbox" style="width:16px;height:16px;cursor:pointer;flex-shrink:0;" '+
        (disabled?'disabled':'')+' '+
        'onchange="quickStartOrderWithSize(\''+p.id+'\',\''+esc(size)+'\', this.checked)">'+
      '<span style="font-weight:500;min-width:40px;font-size:13px;">'+esc(size)+'</span>'+
      '<span class="muted" style="font-size:11px;">Stok: '+stock+'</span>'+
    '</label>';
  });
  
  html += '</div>'+
    '<div class="row-flex" style="margin-top:12px;justify-content:flex-end;gap:6px;">'+
      '<button class="btn ghost" onclick="closeModal()" style="font-size:13px;padding:6px 12px;">Kapat</button>'+
    '</div>';
  
  openModal(html);
}

function quickStartOrderWithSize(productId, size, checked){
  if(!checked) return;
  
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  
  // Renk otomatik seçim (stok en yüksek olan rengi seç)
  let bestColor = null;
  let bestStock = 0;
  
  productVariants(p).forEach(v=>{
    if(v.size === size){
      const stock = getStock(p, v.color, v.size);
      if(stock > bestStock){
        bestStock = stock;
        bestColor = v.color;
      }
    }
  });
  
  if(!bestColor || bestStock <= 0){
    toast('Stok yok');
    return;
  }
  
  // Yeni sipariş başlat ve ürünü ekle
  cart = [{
    productId: p.id,
    name: p.name,
    color: bestColor,
    size: size,
    qty: 1,
    price: p.price,
    unitCost: p.purchasePrice
  }];
  
  saveState();
  closeModal();
  goTab('yenisiparis');
  toast('✅ '+p.name+' ('+size+') ile yeni sipariş başlatıldı');
}
function handleIadeBarcodeScan(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const code = e.target.value.trim();
  e.target.value = '';
  if(!code) return;
  const o = state.orders.find(x=>x.barcode===code);
  if(!o){ toast('Bu barkoda ait sipariş bulunamadı: '+code); return; }
  if(!o.items.length){ toast('Bu sipariş zaten tamamen iade edilmiş'); return; }
  openReturnModal(o.id);
}

function renderShipDocBarcodeAndQr(o, idSuffix){
  const sfx = idSuffix != null ? '_'+idSuffix : '';
  const barW = safeRenderBarcode('printBarcodeSvg'+sfx, o.barcode, {height:32,narrow:1.3,displayValue:false});
  const barcodeSvgEl = document.getElementById('printBarcodeSvg'+sfx);
  const actualBarW = barcodeSvgEl ? barcodeSvgEl.getBoundingClientRect().width : barW;
  renderJustifiedDigits('barcodeValueBox'+sfx, o.barcode, actualBarW);

  // QR Kod render et (gerçek URL - personel-toplam-final.html sayfasına gider, telefonun düz kamerasıyla da açılabilir)
  // HER ZAMAN gerçek, sabit yayın adresi kullanılır - hiçbir ortamda "sipariş no|telefon" formatına düşülmez.
  let qrData;
  if(window.location.protocol.startsWith('http') && !window.location.href.includes('claude.ai')){
    const baseFolder = window.location.href.split('/').slice(0,-1).join('/');
    qrData = baseFolder + '/personel-toplam-final.html?order=' + o.orderNo;
  } else {
    qrData = 'https://onlinesatis.github.io/siparissistemi/personel-toplam-final.html?order=' + o.orderNo;
  }

  const qrContainer = document.getElementById('printQrCodeCanvas'+sfx);
  if(qrContainer){
    qrContainer.innerHTML = '';
    try {
      new QRCode(qrContainer, {
        text: qrData,
        width: 85,
        height: 85,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.L
      });
    } catch(e){
      console.log('QR Kod hatası:', e);
    }
  }
}

function updateOrder(id){
  const o = state.orders.find(x=>x.id===id);
  const newStatus = document.getElementById('d_status').value;
  const statusChanged = newStatus !== o.status;
  o.status = newStatus;
  o.cargo = document.getElementById('d_cargo').value.trim();
  o.tracking = document.getElementById('d_track').value.trim();
  o.cargoPrice = parseFloat(document.getElementById('d_cargoprice').value) || 0;
  o.note = document.getElementById('d_note').value.trim();
  saveState();
  if(newStatus==='Kargoya Verildi' && statusChanged){
    showWhatsAppMessage(o.id,'shipped'); return;
  }
  if(statusChanged){ showWhatsAppMessage(o.id,'status'); return; }
  closeModal(); toast('Sipariş güncellendi'); renderMain();
}

function openReturnModal(orderId){

function processReturnForCustomer(customerId){
  const allItems = window.currentReturnItems;
  const idx = parseInt(document.getElementById('rt_item').value);
  const qty = parseInt(document.getElementById('rt_qty').value)||1;
  const returnCargo = parseFloat(document.getElementById('rt_cargo').value)||0;
  const note = document.getElementById('rt_note').value.trim();
  
  const item = allItems[idx];
  if(!item){ toast('Ürün bulunamadı'); return; }
  
  // Orijinal siparişi bul
  const o = state.orders.find(x=>x.id===item.orderId);
  if(!o){ toast('Sipariş bulunamadı'); return; }
  
  // Orijinal siparişteki item'ı bul
  const origItem = o.items.find(it=>it.name===item.name && it.color===item.color && it.size===item.size);
  if(!origItem){ toast('Ürün siparişte bulunamadı'); return; }
  
  const returnQty = Math.min(qty, origItem.qty);
  const p = state.products.find(x=>x.id===origItem.productId);
  if(p) setStock(p, origItem.color, origItem.size, getStock(p,origItem.color,origItem.size) + returnQty);
  
  origItem.qty -= returnQty;
  if(origItem.qty<=0) {
    const origIdx = o.items.indexOf(origItem);
    o.items.splice(origIdx,1);
  }
  
  o.total = o.items.reduce((s,i)=>s+i.qty*i.price,0);
  if(!o.returns) o.returns=[];
  o.returns.push({id: uid('ret'), date: todayISO(), type:'iade', name:origItem.name, color:origItem.color, size:origItem.size, qty:returnQty, price:origItem.price, returnCargoPrice:returnCargo, note, source:'manuel', received:true});
  if(o.items.length===0) o.status = 'İade Edildi';
  
  saveState();
  closeModal();
  ui.iadeCustomerId = null;
  ui.openReturnForCustomer = false;
  toast('✅ İade işlendi (Geri Kargo: '+fmtMoney(returnCargo)+')');
  
  // İade edildiği için kara listeye alma seçeneği sun
  const c = state.customers.find(x=>x.id===customerId);
  if(c && !c.blacklisted){
    setTimeout(()=>{
      if(confirm('⚠️ Bu müşteri iade yaptı!\n\n👤 '+c.name+'\n\nKara listeye eklemek ister misin?')){
        const reason = prompt('🚫 Neden kara listeye almak istiyorsunuz?\n\nÖrnek: Iade yapan müşteri, kalitesiz ürün şikayeti, vb');
        if(reason && reason.trim()){
          c.blacklisted = true;
          c.blacklistReason = reason;
          c.blacklistDate = new Date().toISOString().split('T')[0];
          saveState();
          toast('⛔ '+c.name+' kara listeye eklendi');
        }
      }
      renderMain();
    }, 500);
  } else {
    renderMain();
  }
}

function processExchange(orderId){
  const o = state.orders.find(x=>x.id===orderId);
  const idx = parseInt(document.getElementById('rt_item').value);
  const qty = parseInt(document.getElementById('rt_qty').value)||1;
  const note = document.getElementById('rt_note').value.trim();
  const item = o.items[idx];
  if(!item){ toast('Ürün bulunamadı'); return; }
  const newP = state.products.find(x=>x.id===document.getElementById('ex_product').value);
  const newColor = document.getElementById('ex_color').value;
  const newSize = document.getElementById('ex_size').value;
  const newQty = parseInt(document.getElementById('ex_qty').value)||1;
  const newPrice = parseFloat(document.getElementById('ex_price').value);
  if(!newP){ toast('Yerine verilecek ürün seçin'); return; }
  const finalPrice = isNaN(newPrice) ? newP.price : newPrice;
  if(exPhotoDataUrl){ newP.photo = exPhotoDataUrl; }

  const exQty = Math.min(qty, item.qty);
  const oldP = state.products.find(x=>x.id===item.productId);
  if(oldP) setStock(oldP, item.color, item.size, getStock(oldP,item.color,item.size) + exQty);
  item.qty -= exQty;
  if(item.qty<=0) o.items.splice(idx,1);

  setStock(newP, newColor, newSize, getStock(newP,newColor,newSize) - newQty);
  const existing = o.items.find(i=>i.productId===newP.id && i.color===newColor && i.size===newSize);
  if(existing){ existing.qty += newQty; }
  else { o.items.push({productId:newP.id, name:newP.name, color:newColor, size:newSize, qty:newQty, price:finalPrice, unitCost:(newP.purchasePrice||0)+(newP.extraCost||0)}); }
  o.total = o.items.reduce((s,i)=>s+i.qty*i.price,0);
  if(!o.returns) o.returns=[];
  o.returns.push({date: todayISO(), type:'degisim', name:item.name, color:item.color, size:item.size, qty:exQty, price:item.price, newName:newP.name, newColor, newSize, newQty, newPrice:finalPrice, note});
  if(o.items.length===0) o.status='İade Edildi';
  saveState();
  exPhotoDataUrl = null;
  closeModal();
  toast('Değişim tamamlandı, stok güncellendi');
  renderMain();
}

function ordersInRange(days){
  const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-days+1);
  return state.orders.filter(o=> new Date(o.date) >= from && o.status!=='İptal Edildi');
}
function ordersInRangeOffset(days, offsetDays){
  // offsetDays kadar geriden başlayıp, days kadar süren bir aralık döndürür (önceki dönem)
  const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-days-offsetDays+1);
  const to = new Date(); to.setHours(0,0,0,0); to.setDate(to.getDate()-offsetDays+1);
  return state.orders.filter(o=> {
    const d = new Date(o.date);
    return d >= from && d < to && o.status!=='İptal Edildi';
  });
}
function returnsInRange(days){
  const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-days+1);
  const out = [];
  state.orders.forEach(o=>{
    const c = state.customers.find(x=>x.id===o.customerId);
    (o.returns||[]).forEach(r=>{
      if(new Date(r.date) >= from) out.push(Object.assign({orderNo:o.orderNo, customerName: c?c.name:'—'}, r));
    });
  });
  return out.sort((a,b)=>new Date(b.date)-new Date(a.date));
}

}

function buildBarChart(dataObj, colorHex, valueFormatter){
  const entries = Object.entries(dataObj);
  if(entries.length===0) return '<div class="empty">Veri yok</div>';
  const max = Math.max(1, ...entries.map(e=>e[1]));
  const maxBarPx = 90;
  return '<div style="display:flex;gap:10px;align-items:flex-end;height:'+(maxBarPx+42)+'px;overflow-x:auto;padding:8px 4px;">'+
    entries.map(([label,val])=>{
      const hpx = Math.max(4, Math.round((val/max)*maxBarPx));
      return '<div style="display:flex;flex-direction:column;align-items:center;min-width:50px;flex-shrink:0;">'+
        '<div style="font-size:10px;color:'+colorHex+';font-weight:700;margin-bottom:3px;white-space:nowrap;">'+valueFormatter(val)+'</div>'+
        '<div style="width:28px;height:'+hpx+'px;background:'+colorHex+';border-radius:5px 5px 0 0;"></div>'+
        '<div style="font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;">'+esc(label)+'</div>'+
      '</div>';
    }).join('')+
  '</div>';
}

function renderIadeCharts(){
  const iadeler = allReturnsList().filter(r=>r.type==='iade');
  const now = new Date();
  
  // AYLIK (son 6 ay)
  const monthLabels = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    monthLabels.push(d.toLocaleDateString('tr-TR',{month:'short',year:'2-digit'}));
  }
  const monthCount = {}, monthCargo = {};
  monthLabels.forEach(l=>{ monthCount[l]=0; monthCargo[l]=0; });
  iadeler.forEach(r=>{
    const rd = new Date(r.date);
    const label = rd.toLocaleDateString('tr-TR',{month:'short',year:'2-digit'});
    if(monthCount.hasOwnProperty(label)){
      monthCount[label]++;
      const ord = state.orders.find(o=>o.id===r.orderId);
      const gidis = (ord && ord.cargoPrice) ? ord.cargoPrice : state.kargoUcreti;
      const donus = r.returnCargoPrice || state.kargoUcreti;
      monthCargo[label] += gidis + donus;
    }
  });
  
  // GÜNLÜK (son 14 gün)
  const dayLabels = [];
  for(let i=13;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i);
    dayLabels.push(d.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}));
  }
  const dayCount = {}, dayCargo = {};
  dayLabels.forEach(l=>{ dayCount[l]=0; dayCargo[l]=0; });
  iadeler.forEach(r=>{
    const rd = new Date(r.date);
    const label = rd.toLocaleDateString('tr-TR',{day:'2-digit',month:'short'});
    if(dayCount.hasOwnProperty(label)){
      dayCount[label]++;
      const ord = state.orders.find(o=>o.id===r.orderId);
      const gidis = (ord && ord.cargoPrice) ? ord.cargoPrice : state.kargoUcreti;
      const donus = r.returnCargoPrice || state.kargoUcreti;
      dayCargo[label] += gidis + donus;
    }
  });
  
  const totalCargo6Ay = Object.values(monthCargo).reduce((a,b)=>a+b,0);
  const totalCount6Ay = Object.values(monthCount).reduce((a,b)=>a+b,0);
  
  return '<div style="margin-top:6px;">'+
    '<div style="background:#ffebee;border:2px solid #EF4444;border-radius:12px;padding:14px;text-align:center;margin-bottom:16px;">'+
      '<div style="font-size:12px;color:var(--muted);">Son 6 Ay Toplam</div>'+
      '<div style="font-size:22px;font-weight:800;color:#c62828;">'+totalCount6Ay+' iade — Kargo Maliyeti: '+fmtMoney(totalCargo6Ay)+'</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-top:2px;">(Gidiş '+fmtMoney(state.kargoUcreti)+' + Dönüş '+fmtMoney(state.kargoUcreti)+' varsayımıyla, sipariş üzerinde farklı kargo ücreti varsa o kullanılır)</div>'+
    '</div>'+
    '<h3>📅 Aylık — İade Adedi</h3>'+
    buildBarChart(monthCount, '#2196F3', v=>v)+
    '<h3 style="margin-top:18px;">💰 Aylık — Kargo Maliyeti (Gidiş+Dönüş)</h3>'+
    buildBarChart(monthCargo, '#EF4444', v=>fmtMoney(v))+
    '<h3 style="margin-top:18px;">📆 Günlük (Son 14 Gün) — İade Adedi</h3>'+
    buildBarChart(dayCount, '#2196F3', v=>v)+
    '<h3 style="margin-top:18px;">💸 Günlük (Son 14 Gün) — Kargo Maliyeti</h3>'+
    buildBarChart(dayCargo, '#EF4444', v=>fmtMoney(v))+
  '</div>';
}

  saveState();

function saveReturnEntry(orderId, retId){
  const order = state.orders.find(o => o.id === orderId);
  if(!order || !order.returns) return;
  const ret = order.returns.find(r => r.id === retId);
  if(!ret) return;
  
  ret.name = document.getElementById('edret_name').value.trim();
  ret.color = document.getElementById('edret_color').value.trim();
  ret.size = document.getElementById('edret_size').value.trim();
  ret.qty = parseInt(document.getElementById('edret_qty').value) || 1;
  ret.price = parseFloat(document.getElementById('edret_price').value) || 0;
  ret.note = document.getElementById('edret_note').value.trim();
  
  saveState();
  closeModal();
  toast('✅ İade kaydı güncellendi');
  renderMain();
}

function deleteReturnEntry(orderId, retId){
  openModal(
    '<h2>🗑️ İade Kaydını Sil</h2>'+

    '</div>'
  );
}

function confirmDeleteReturnEntry(orderId, retId){
  const order = state.orders.find(o => o.id === orderId);
  if(!order || !order.returns) return;
  order.returns = order.returns.filter(r => r.id !== retId);
  saveState();
  closeModal();
  toast('✅ İade kaydı silindi');
  renderMain();
}

function quickBlacklistFromReturn(customerId){
  const c = state.customers.find(x => x.id === customerId);
  if(!c) return;
  
  if(c.blacklisted){
    toast('ℹ️ '+c.name+' zaten kara listede');
    return;
  }
  
  openModal(
    '<h2>⛔ Kara Listeye Al</h2>'+
    '<p class="muted">👤 '+esc(c.name)+'<br>📞 '+esc(c.phone)+'</p>'+

      '<button class="btn danger" onclick="confirmQuickBlacklist(\''+customerId+'\')">⛔ Kara Listeye Al</button>'+

  );
}

function confirmQuickBlacklist(customerId){
  const c = state.customers.find(x => x.id === customerId);
  if(!c) return;
  
  const reason = document.getElementById('blacklist_reason_input').value.trim() || 'İade Yapılan Müşteri';
  c.blacklisted = true;
  c.blacklistReason = reason;
  c.blacklistDate = new Date().toLocaleDateString('tr-TR');
  saveState();
  closeModal();
  toast('⛔ '+c.name+' kara listeye eklendi');
  renderMain();
}

        '<input id="ad_budget_start" type="date" value="'+state.adBudget.startDate+'">'+
      '</div>'+
      '<div>'+
        '<label>📅 Bitiş Tarihi</label>'+
        '<input id="ad_budget_end" type="date" value="'+state.adBudget.endDate+'">'+
      '</div>'+
    '</div>'+
    '<div class="row-flex" style="gap:8px;margin-top:12px;justify-content:flex-end;">'+
      '<button class="btn" style="background:#2196F3;color:white;padding:12px 20px;" onclick="saveAdBudget()">✅ Kaydet</button>'+

    '</div>'+
    '</div>'+
    
    // Bugün'ün özeti
    (() => {
      const today = new Date().toDateString();
      const todayOrders = state.orders.filter(o => o.status !== 'İptal Edildi' && new Date(o.date).toDateString() === today);
      const todayCargoCount = todayOrders.length;
      const costPerCargo = todayCargoCount > 0 ? Math.round(state.adBudget.dailyAmount / todayCargoCount) : 0;
      
      return '<div class="card" style="background:linear-gradient(135deg, #fff9c4, #fff59d);border-color:#fbc02d;border-width:2px;">'+
        '<h3 style="margin-top:0;color:#f57f17;">📊 BUGÜN\'ÜN REKLAM MALİYET ÖZETİ</h3>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">'+
          '<div style="background:white;padding:14px;border-radius:8px;border:2px solid #1565c0;text-align:center;">'+
            '<div style="font-size:12px;color:#666;margin-bottom:6px;font-weight:600;">💰 Günlük Reklam Bütçesi</div>'+
            '<div style="font-size:24px;font-weight:700;color:#1565c0;">'+fmtMoney(state.adBudget.dailyAmount)+'</div>'+
          '</div>'+
          '<div style="background:white;padding:14px;border-radius:8px;border:2px solid #e65100;text-align:center;">'+
            '<div style="font-size:12px;color:#666;margin-bottom:6px;font-weight:600;">📦 Çıkan Kargo</div>'+
            '<div style="font-size:24px;font-weight:700;color:#e65100;">'+todayCargoCount+' <span style="font-size:14px;">kargo</span></div>'+
          '</div>'+
          '<div style="background:white;padding:14px;border-radius:8px;border:2px solid #d32f2f;text-align:center;">'+
            '<div style="font-size:12px;color:#666;margin-bottom:6px;font-weight:600;">💸 Kargo Başına</div>'+
            '<div style="font-size:24px;font-weight:700;color:#d32f2f;">'+fmtMoney(costPerCargo)+'</div>'+
            '<div style="font-size:10px;color:#999;margin-top:6px;line-height:1.4;">'+
              (todayCargoCount > 0 ? '('+fmtMoney(state.adBudget.dailyAmount)+' ÷ '+todayCargoCount+' = '+fmtMoney(costPerCargo)+')' : '(Henüz kargo yok)')+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>';
    })() +
    
    // Dönem istatistikleri - Tarih filtreli
    (() => {
      // Tarih string'lerini doğrudan kullan (yyyy-mm-dd format)
      const startDateStr = ui.reklamStartDate || state.adBudget.startDate;
      const endDateStr = ui.reklamEndDate || state.adBudget.endDate;
      
      // Seçilen tarih aralığındaki siparişleri filtrele (ISO tarihten sadece tarih kısmını al)
      const periodOrders = state.orders.filter(o => {
        if(o.status === 'İptal Edildi') return false;
        // o.date formatı: "2026-07-20T12:30:45.123Z" - sadece tarih kısmını al (ilk 10 karakter)
        const orderDateOnly = o.date.substring(0, 10);
        return orderDateOnly >= startDateStr && orderDateOnly <= endDateStr;
      });
      
      // Gün sayısını hesapla
      const startDate = new Date(startDateStr);
      const endDate = new Date(endDateStr);
      const dayCount = Math.max(Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1, 1);
      
      const periodCargoCount = periodOrders.length;

function renderUrunPerformans(){
  // Tüm ürünleri, iptal/iade edilmemiş siparişlerdeki satışlarına göre topla
  const stats = {}; // productId -> {name, photo, qty, revenue, profit}
  const returnStats = {}; // productId -> {name, photo, qty} - sadece iade edilenler
  const cityStats = {}; // şehir -> {count, revenue}
  state.orders.forEach(o=>{
    const cust = state.customers.find(c=>c.id===o.customerId);
    const city = (cust && cust.city) ? cust.city.trim() : null;
    if(city){
      if(!cityStats[city]) cityStats[city] = {count:0, revenue:0};
      cityStats[city].count += 1;
      cityStats[city].revenue += o.total;
    }
    if(o.status === 'İade Edildi'){
      o.items.forEach(i=>{
        const key = i.productId || i.name;
        if(!returnStats[key]){
          const p = state.products.find(x=>x.id===i.productId);
          returnStats[key] = {name: i.name, photo: p?p.photo:null, qty:0};
        }
        returnStats[key].qty += i.qty;
      });
      return;
    }
    o.items.forEach(i=>{
      const key = i.productId || i.name;
      if(!stats[key]){
        const p = state.products.find(x=>x.id===i.productId);
        stats[key] = {name: i.name, photo: p?p.photo:null, qty:0, revenue:0, profit:0};
      }
      stats[key].qty += i.qty;
      stats[key].revenue += i.qty * i.price;
      stats[key].profit += (i.price - (i.unitCost||0)) * i.qty;
    });
  });
  const allStats = Object.values(stats);
  const allReturnStats = Object.values(returnStats);

  const bySales = [...allStats].sort((a,b)=>b.qty-a.qty).slice(0,10);
  const byProfit = [...allStats].sort((a,b)=>b.profit-a.profit).slice(0,10);
  const byLeast = [...allStats].sort((a,b)=>a.qty-b.qty).slice(0,10);
  const byReturns = [...allReturnStats].sort((a,b)=>b.qty-a.qty).slice(0,10);
  const byCities = Object.entries(cityStats).map(([city,st])=>({city, count:st.count, revenue:st.revenue})).sort((a,b)=>b.count-a.count).slice(0,10);

  function rowsHtml(list, valueKey, valueLabel, isMoney){
    if(!list.length) return '<div class="empty">Henüz veri yok</div>';
    return list.map((s,idx)=>{
      const val = isMoney ? fmtMoney(s[valueKey]) : s[valueKey]+' adet';
      return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);">'+
        '<div style="width:24px;text-align:center;font-weight:700;color:var(--muted);">'+(idx+1)+'</div>'+
        (s.photo ? '<img src="'+s.photo+'" style="width:40px;height:40px;object-fit:cover;border-radius:8px;">' : '<div style="width:40px;height:40px;background:#eef1f5;border-radius:8px;"></div>')+
        '<div style="flex:1;"><b>'+esc(s.name)+'</b></div>'+
        '<div style="font-weight:700;color:var(--navy);">'+val+'</div>'+
      '</div>';
    }).join('');
  }

  return '<div class="card">'+
    '<div class="tabs-sub">'+
      '<button class="'+(ui.sub==='gunluk'?'active':'')+'" onclick="setReportRange(\'gunluk\')">Günlük</button>'+
      '<button class="'+(ui.sub==='haftalik'?'active':'')+'" onclick="setReportRange(\'haftalik\')">Haftalık</button>'+
      '<button class="'+(ui.sub==='aylik'?'active':'')+'" onclick="setReportRange(\'aylik\')">Aylık</button>'+
      '<button class="'+(ui.sub==='ozel'?'active':'')+'" onclick="setReportRange(\'ozel\')">Özel Tarih</button>'+
      '<button class="'+(ui.sub==='performans'?'active':'')+'" onclick="setReportRange(\'performans\')">📊 Performans</button>'+
      '<button class="active">🏆 Ürün Performansı</button>'+
      '<button class="'+(ui.sub==='iade'?'active':'')+'" onclick="setReportRange(\'iade\')" style="background:'+(ui.sub==='iade'?'':'#ffebee')+';color:'+(ui.sub==='iade'?'':'#c62828')+';">↩ İade Raporu</button>'+
    '</div>'+
    '<p class="muted" style="margin-top:8px;">Tüm zamanlar toplamı (iade edilenler hariç)</p>'+
  '</div>'+
  '<div class="card">'+
    '<h2>🥇 En Çok Satan Ürünler</h2>'+
    rowsHtml(bySales, 'qty', 'adet', false)+
  '</div>'+
  '<div class="card">'+
    '<h2>💰 En Çok Kâr Eden Ürünler</h2>'+
    rowsHtml(byProfit, 'profit', '₺', true)+
  '</div>'+
  '<div class="card">'+
    '<h2>📉 En Az Satan Ürünler</h2>'+
    rowsHtml(byLeast, 'qty', 'adet', false)+
  '</div>'+
  '<div class="card">'+
    '<h2>↩️ En Çok İade Gelen Ürünler</h2>'+
    rowsHtml(byReturns, 'qty', 'adet', false)+
  '</div>'+
  '<div class="card">'+
    '<h2>🏙️ En Çok Sipariş Gelen Şehirler</h2>'+
    (byCities.length ? byCities.map((c,idx)=>
      '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);">'+
        '<div style="width:24px;text-align:center;font-weight:700;color:var(--muted);">'+(idx+1)+'</div>'+
        '<div style="flex:1;"><b>'+esc(c.city)+'</b></div>'+
        '<div style="text-align:right;"><div style="font-weight:700;color:var(--navy);">'+c.count+' sipariş</div><div style="font-size:12px;color:var(--muted);">'+fmtMoney(c.revenue)+'</div></div>'+
      '</div>'
    ).join('') : '<div class="empty">Müşterilerde şehir bilgisi girilmemiş.</div>')+
  '</div>';
}

  ui.sub = ui.sub || 'gunluk';
  const adStatusBanner = '<div class="card" style="background:'+(state.adBudget.active?'#e8f5e9':'#fff3cd')+';border-left:4px solid '+(state.adBudget.active?'#10B981':'#F59E0B')+';">'+

  // İade Raporu özel işlemi
  if(ui.sub === 'iade'){
    return adStatusBanner + renderIadeReport();
  }
  
  // Performans Özeti (Trendyol tarzı)
  if(ui.sub === 'performans'){
    return adStatusBanner + renderPerformansOzeti();
  }
  
  // Ürün Performansı: en çok satan, en çok kâr eden, en az satan
  if(ui.sub === 'urunperf'){
    return adStatusBanner + renderUrunPerformans();
  }
  
  const ranges = {gunluk:1, haftalik:7, aylik:30};
  
  // Özel tarih aralığı kullan (varsa)
  let list = [];
  if(ui.reportStartDate && ui.reportEndDate){
    const start = new Date(ui.reportStartDate);

    end.setDate(end.getDate() + 1);

  // Detaylı hesaplamalar

  const productCost = list.reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+((i.unitCost||0)*i.qty),0),0);
  const profit = productRevenue - productCost;
  const cargoTotal = list.reduce((s,o)=>s+(o.cargoPrice||0),0);
  
  // 🎯 REKLAM MALİYETİ: Günlük Bütçe × Gün Sayısı (doğru yöntem!)
  let adTotal = 0;

  ui.reportEndDate = end;

/* ================= PERFORMANS ÖZETİ (Trendyol tarzı) ================= */
function renderPerformansOzeti(){
  ui.perfRange = ui.perfRange || 7;
  const days = ui.perfRange;
  
  const list = ordersInRange(days);
  const prevList = ordersInRangeOffset(days, days);
  
  const revenue = list.reduce((s,o)=>s+o.total,0);
  const prevRevenue = prevList.reduce((s,o)=>s+o.total,0);
  const revenueDiff = prevRevenue > 0 ? Math.round(((revenue-prevRevenue)/prevRevenue)*100) : (revenue>0?100:0);
  const revenueUp = revenue >= prevRevenue;
  
  // 🎯 Maliyet detayları: ürün maliyeti, kargo, reklam ve net kâr
  const productCostTotal = list.reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+((i.unitCost||0)*i.qty),0),0);
  const cargoTotalPerf = list.reduce((s,o)=>s+(o.cargoPrice||0),0);
  // Reklam maliyeti: siparişte KAYITLI eski değer yerine, GÜNCEL aktif bütçeye göre anlık hesapla
  // (reklam bütçesi sipariş oluşturulduktan sonra açılmış/değiştirilmiş olabilir)
  let adTotalPerf = 0;
  if(state.adBudget.active){
    const uniqueDaysPerf = new Set();
    list.forEach(o => uniqueDaysPerf.add(o.date.substring(0,10)));
    adTotalPerf = state.adBudget.dailyAmount * uniqueDaysPerf.size;
  } else {
    // Bütçe şu an kapalıysa bile, geçmişte kaydedilmiş gerçek harcamaları göster
    adTotalPerf = list.reduce((s,o)=>s+(o.adCostDaily||0),0);
  }
  const netKarPerf = revenue - productCostTotal - cargoTotalPerf - adTotalPerf;
  
  const satisAdedi = list.length;
  const prevSatisAdedi = prevList.length;
  const satisDiff = prevSatisAdedi > 0 ? Math.round(((satisAdedi-prevSatisAdedi)/prevSatisAdedi)*100) : (satisAdedi>0?100:0);
  const satisUp = satisAdedi >= prevSatisAdedi;
  
  const iptalAdedi = state.orders.filter(o=>{
    const d = new Date(o.date); const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-days+1);
    return d >= from && o.status==='İptal Edildi';
  }).length;
  const prevIptalFrom = new Date(); prevIptalFrom.setHours(0,0,0,0); prevIptalFrom.setDate(prevIptalFrom.getDate()-days*2+1);
  const prevIptalTo = new Date(); prevIptalTo.setHours(0,0,0,0); prevIptalTo.setDate(prevIptalTo.getDate()-days+1);
  const prevIptalAdedi = state.orders.filter(o=>{
    const d = new Date(o.date);
    return d >= prevIptalFrom && d < prevIptalTo && o.status==='İptal Edildi';
  }).length;
  const iptalDiff = prevIptalAdedi > 0 ? Math.round(((iptalAdedi-prevIptalAdedi)/prevIptalAdedi)*100) : (iptalAdedi>0?100:0);
  const iptalUp = iptalAdedi >= prevIptalAdedi;
  
  const iadeAdedi = state.orders.filter(o=>{
    const d = new Date(o.date); const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-days+1);
    return d >= from && o.status==='İade Edildi';
  }).length;
  const prevIadeAdedi = state.orders.filter(o=>{
    const d = new Date(o.date);
    return d >= prevIptalFrom && d < prevIptalTo && o.status==='İade Edildi';
  }).length;
  const iadeDiff = prevIadeAdedi > 0 ? Math.round(((iadeAdedi-prevIadeAdedi)/prevIadeAdedi)*100) : (iadeAdedi>0?100:0);
  const iadeUp = iadeAdedi >= prevIadeAdedi;
  
  // Tarih aralığı metni
  const fromDate = new Date(); fromDate.setDate(fromDate.getDate()-days+1);
  const toDate = new Date();
  const fmtD = (d) => d.toLocaleDateString('tr-TR', {day:'2-digit', month:'long'});
  
  const arrow = (up) => up ? '↗' : '↘';
  const color = (up) => up ? '#10B981' : '#EF4444';
  const bg = (up) => up ? '#e8f5e9' : '#ffebee';
  
  let html = '<div class="card">'+
    '<div class="tabs-sub" style="margin-bottom:0;">'+
      '<button class="'+(ui.sub==='gunluk'?'active':'')+'" onclick="setReportRange(\'gunluk\')">Günlük</button>'+
      '<button class="'+(ui.sub==='haftalik'?'active':'')+'" onclick="setReportRange(\'haftalik\')">Haftalık</button>'+
      '<button class="'+(ui.sub==='aylik'?'active':'')+'" onclick="setReportRange(\'aylik\')">Aylık</button>'+
      '<button class="'+(ui.sub==='ozel'?'active':'')+'" onclick="setReportRange(\'ozel\')">Özel Tarih</button>'+
      '<button class="active">📊 Performans</button>'+
      '<button onclick="setReportRange(\'urunperf\')">🏆 Ürün Performansı</button>'+
      '<button class="" onclick="setReportRange(\'iade\')" style="background:#ffebee;color:#c62828;">↩ İade Raporu</button>'+
    '</div>'+
  '</div>';
  
  html += '<div class="card">'+
    '<div class="row-flex" style="gap:8px;margin-bottom:14px;">'+
      '<button class="btn '+(ui.perfRange===7?'':'ghost')+'" style="flex:1;" onclick="setPerfRange(7)">Son 7 Gün</button>'+
      '<button class="btn '+(ui.perfRange===30?'':'ghost')+'" style="flex:1;" onclick="setPerfRange(30)">Son 30 Gün</button>'+
    '</div>'+
    '<p class="muted" style="font-size:13px;">'+fmtD(fromDate)+' - '+fmtD(toDate)+' satış performansınız aşağıdaki gibidir.</p>'+
    
    '<div style="margin-top:16px;">'+
      '<div style="font-size:14px;color:var(--muted);font-weight:600;">Net Ciro</div>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-top:4px;">'+
        '<div style="font-size:30px;font-weight:800;">'+fmtMoney(revenue)+'</div>'+
        '<div style="background:'+bg(revenueUp)+';color:'+color(revenueUp)+';padding:4px 10px;border-radius:20px;font-weight:700;font-size:13px;">'+arrow(revenueUp)+' %'+Math.abs(revenueDiff)+'</div>'+
      '</div>'+
    '</div>'+
    
    '<div style="margin-top:20px;">'+
      '<canvas id="perfBarChart" height="160"></canvas>'+
    '</div>'+
  '</div>';
  
  html += '<div class="card">'+
    '<h2 style="margin-bottom:12px;">💰 Finansal Özet</h2>'+
    '<div class="grid cols-2" style="gap:10px;">'+
      '<div style="background:#e8f5e9;padding:14px;border-radius:10px;border-left:4px solid #10B981;">'+
        '<div style="font-size:12px;color:var(--muted);">📈 Toplam Ciro</div>'+
        '<div style="font-size:20px;font-weight:800;margin-top:4px;color:#10B981;">'+fmtMoney(revenue)+'</div>'+
      '</div>'+
      '<div style="background:#e3f2fd;padding:14px;border-radius:10px;border-left:4px solid #2196F3;">'+
        '<div style="font-size:12px;color:var(--muted);">🚚 Net Kargo Masrafı</div>'+
        '<div style="font-size:20px;font-weight:800;margin-top:4px;color:#2196F3;">-'+fmtMoney(cargoTotalPerf)+'</div>'+
      '</div>'+
      '<div style="background:#f3e5f5;padding:14px;border-radius:10px;border-left:4px solid #9C27B0;">'+
        '<div style="font-size:12px;color:var(--muted);">📣 Net Reklam Gideri</div>'+
        '<div style="font-size:20px;font-weight:800;margin-top:4px;color:#9C27B0;">-'+fmtMoney(adTotalPerf)+'</div>'+
      '</div>'+
      '<div style="background:#fff3e0;padding:14px;border-radius:10px;border-left:4px solid #FF9800;">'+
        '<div style="font-size:12px;color:var(--muted);">📦 Ürün Maliyeti</div>'+
        '<div style="font-size:20px;font-weight:800;margin-top:4px;color:#FF9800;">-'+fmtMoney(productCostTotal)+'</div>'+
      '</div>'+
    '</div>'+
    '<div style="margin-top:14px;padding:16px;background:'+(netKarPerf>=0?'#e8f5e9':'#ffebee')+';border-radius:10px;text-align:center;">'+
      '<div style="font-size:13px;color:var(--muted);font-weight:600;">💵 NET KÂR (kargo + reklam + ürün maliyeti düşülmüş)</div>'+
      '<div style="font-size:28px;font-weight:800;margin-top:6px;color:'+(netKarPerf>=0?'#10B981':'#EF4444')+';">'+fmtMoney(netKarPerf)+'</div>'+
    '</div>'+
  '</div>';
  
  html += '<div class="card">'+
    '<h2 style="margin-bottom:12px;">Genel Performans</h2>'+
    '<div class="grid cols-3" style="gap:10px;">'+
      '<div style="background:#f8f9fb;padding:14px;border-radius:10px;">'+
        '<div style="font-size:12px;color:var(--muted);">Net Satış Adedi</div>'+
        '<div style="font-size:24px;font-weight:800;margin-top:4px;">'+satisAdedi+'</div>'+
        '<div style="background:'+bg(satisUp)+';color:'+color(satisUp)+';display:inline-block;padding:2px 8px;border-radius:20px;font-weight:700;font-size:11px;margin-top:6px;">'+arrow(satisUp)+' %'+Math.abs(satisDiff)+'</div>'+
      '</div>'+
      '<div style="background:#f8f9fb;padding:14px;border-radius:10px;">'+
        '<div style="font-size:12px;color:var(--muted);">İptal Adedi</div>'+
        '<div style="font-size:24px;font-weight:800;margin-top:4px;">'+iptalAdedi+'</div>'+
        '<div style="background:'+bg(!iptalUp)+';color:'+color(!iptalUp)+';display:inline-block;padding:2px 8px;border-radius:20px;font-weight:700;font-size:11px;margin-top:6px;">'+arrow(iptalUp)+' %'+Math.abs(iptalDiff)+'</div>'+
      '</div>'+
      '<div style="background:#f8f9fb;padding:14px;border-radius:10px;">'+
        '<div style="font-size:12px;color:var(--muted);">İade Adedi</div>'+
        '<div style="font-size:24px;font-weight:800;margin-top:4px;">'+iadeAdedi+'</div>'+
        '<div style="background:'+bg(!iadeUp)+';color:'+color(!iadeUp)+';display:inline-block;padding:2px 8px;border-radius:20px;font-weight:700;font-size:11px;margin-top:6px;">'+arrow(iadeUp)+' %'+Math.abs(iadeDiff)+'</div>'+

function setPerfRange(r){
  ui.perfRange = r;
  renderMain();
}

function drawPerfBarChart(){
  const canvas = document.getElementById('perfBarChart');
  if(!canvas || typeof Chart==='undefined') return;
  
  const days = ui.perfRange || 7;
  const labels = [];
  const values = [];
  const dayNames = ['Paz','Pts','Sal','Çar','Per','Cum','Cts'];
  
  for(let i=days-1; i>=0; i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const dEnd = new Date(d); dEnd.setDate(dEnd.getDate()+1);
    const dayTotal = state.orders.filter(o=>{
      const oDate = new Date(o.date);
      return oDate >= d && oDate < dEnd && o.status !== 'İptal Edildi';
    }).reduce((s,o)=>s+o.total,0);
    
    labels.push(days === 7 ? dayNames[d.getDay()] : d.getDate()+'/'+(d.getMonth()+1));
    values.push(dayTotal);
  }
  
  const ctx = canvas.getContext('2d');
  if(window.perfChartInstance) window.perfChartInstance.destroy();
  
  window.perfChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: '#9CA9C7',
        borderRadius: 4,
        maxBarThickness: 40
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 0 },
      plugins: { legend: { display: false } },
      scales: {
        y: { display: false, grid: { display: false } },
        x: { grid: { display: false } }
      }
    }
  });
}

function renderIadeReport(){
  ui.iadeRaporPeriod = ui.iadeRaporPeriod || 'aylik';
  
  // Dönem aralığını belirle
  let periodStart = null, periodEnd = null;
  const now = new Date();
  if(ui.iadeRaporPeriod === 'gunluk'){
    periodStart = new Date(now); periodStart.setHours(0,0,0,0);
    periodEnd = new Date(now); periodEnd.setHours(23,59,59,999);
  } else if(ui.iadeRaporPeriod === 'haftalik'){
    periodStart = new Date(now); periodStart.setDate(periodStart.getDate()-7);
    periodEnd = now;
  } else if(ui.iadeRaporPeriod === 'aylik'){
    periodStart = new Date(now.getFullYear(), now.getMonth(), 1);
    periodEnd = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59,999);
  } else if(ui.iadeRaporPeriod === 'ozel' && ui.iadeRaporStart && ui.iadeRaporEnd){
    periodStart = new Date(ui.iadeRaporStart);
    periodEnd = new Date(ui.iadeRaporEnd); periodEnd.setHours(23,59,59,999);
  }
  // 'tumu' seçiliyse periodStart/End null kalır, filtre uygulanmaz
  
  // Tüm iadeleri topla
  let totalIadeQty = 0;
  let totalIadeRevenue = 0;
  let totalOutgoingCargo = 0;
  let totalReturnCargo = 0;
  let iadeGonderiSayisi = 0; // kargo ücreti > 0 olan iade sayısı (sipariş başına 1)
  const iadeDetails = [];
  
  state.orders.forEach(o => {
    if(o.returns && o.returns.length > 0){
      o.returns.forEach(r => {
        const rDate = new Date(r.date);
        if(periodStart && (rDate < periodStart || rDate > periodEnd)) return; // dönem dışıysa atla
        
        totalIadeQty += r.qty;
        totalIadeRevenue += (r.price || 0) * r.qty;
        totalOutgoingCargo += o.cargoPrice || 0;
        totalReturnCargo += (r.returnCargoPrice || 0);
        if((r.returnCargoPrice||0) > 0) iadeGonderiSayisi++;
        
        iadeDetails.push({
          orderNo: o.orderNo,
          date: o.date,
          productName: r.name,
          color: r.color,
          size: r.size,
          qty: r.qty,
          price: r.price || 0,
          outgoingCargo: o.cargoPrice || 0,
          returnCargo: r.returnCargoPrice || 0,
          netRevenue: (r.price || 0) * r.qty - (o.cargoPrice || 0) - (r.returnCargoPrice || 0)
        });
      });
    }
  });
  
  const netIadeRevenue = totalIadeRevenue - totalOutgoingCargo - totalReturnCargo;
  const periodLabels = {gunluk:'Bugün', haftalik:'Son 7 Gün', aylik:'Bu Ay', ozel:'Özel Tarih', tumu:'Tüm Zamanlar'};
  
  let html = '<div class="card">'+
    '<div class="tabs-sub">'+
      '<button class="'+(ui.sub==='gunluk'?'active':'')+'" onclick="setReportRange(\'gunluk\')">Günlük</button>'+
      '<button class="'+(ui.sub==='haftalik'?'active':'')+'" onclick="setReportRange(\'haftalik\')">Haftalık</button>'+
      '<button class="'+(ui.sub==='aylik'?'active':'')+'" onclick="setReportRange(\'aylik\')">Aylık</button>'+
      '<button class="'+(ui.sub==='ozel'?'active':'')+'" onclick="setReportRange(\'ozel\')">Özel Tarih</button>'+
      '<button class="'+(ui.sub==='performans'?'active':'')+'" onclick="setReportRange(\'performans\')">📊 Performans</button>'+
      '<button class="'+(ui.sub==='urunperf'?'active':'')+'" onclick="setReportRange(\'urunperf\')">🏆 Ürün Performansı</button>'+
      '<button class="'+(ui.sub==='iade'?'active':'')+'" onclick="setReportRange(\'iade\')">İade Raporu</button>'+
    '</div>'+
  '</div>'+
  '<div class="card">'+
    '<h2 style="margin-top:0;">↩ İade Raporu — Dönem Filtresi</h2>'+
    '<div class="tabs-sub">'+
      '<button class="'+(ui.iadeRaporPeriod==='gunluk'?'active':'')+'" onclick="setIadeRaporPeriod(\'gunluk\')">Bugün</button>'+
      '<button class="'+(ui.iadeRaporPeriod==='haftalik'?'active':'')+'" onclick="setIadeRaporPeriod(\'haftalik\')">Son 7 Gün</button>'+
      '<button class="'+(ui.iadeRaporPeriod==='aylik'?'active':'')+'" onclick="setIadeRaporPeriod(\'aylik\')">Bu Ay</button>'+
      '<button class="'+(ui.iadeRaporPeriod==='tumu'?'active':'')+'" onclick="setIadeRaporPeriod(\'tumu\')">Tüm Zamanlar</button>'+
    '</div>'+
    '<div class="grid cols-4">'+
      stat(totalIadeQty,'İade Edilen Adet')+
      stat(fmtMoney(totalIadeRevenue),'İade Cirosu')+
      stat(fmtMoney(totalOutgoingCargo + totalReturnCargo),'Toplam Kargo')+
      stat(fmtMoney(netIadeRevenue),'Net İade')+
    '</div>'+
    '<div style="margin-top:14px;background:#ffebee;border:2px solid #EF4444;border-radius:12px;padding:16px;text-align:center;">'+
      '<div style="font-size:13px;color:var(--muted);margin-bottom:4px;">🔴 '+periodLabels[ui.iadeRaporPeriod]+' — İade Kargo Bedeli</div>'+
      '<div style="font-size:26px;font-weight:800;color:#c62828;">'+iadeGonderiSayisi+' adet × '+fmtMoney(state.kargoUcreti)+' = '+fmtMoney(totalReturnCargo)+'</div>'+
    '</div>'+
  '</div>';
  
  if(iadeDetails.length > 0){
    html += '<div class="card"><h2>📋 İade Detayları</h2>'+
      '<table>'+
        '<tr>'+
          '<th>Sipariş</th>'+
          '<th>Tarih</th>'+
          '<th>Ürün</th>'+
          '<th>Renk/Beden</th>'+
          '<th>Adet</th>'+
          '<th>Fiyat</th>'+
          '<th>Giden Kargo</th>'+
          '<th>Dönüş Kargo</th>'+
          '<th>Net</th>'+
        '</tr>'+
        iadeDetails.map(d =>
          '<tr>'+
            '<td>#'+d.orderNo+'</td>'+
            '<td>'+fmtDate(d.date)+'</td>'+
            '<td>'+esc(d.productName)+'</td>'+
            '<td>'+esc(d.color)+' / '+esc(d.size)+'</td>'+
            '<td>'+d.qty+'</td>'+
            '<td>'+fmtMoney(d.price)+'</td>'+
            '<td>'+fmtMoney(d.outgoingCargo)+'</td>'+
            '<td>'+fmtMoney(d.returnCargo)+'</td>'+
            '<td style="color:'+(d.netRevenue >= 0 ? '#4CAF50' : '#f44336')+';">'+fmtMoney(d.netRevenue)+'</td>'+
          '</tr>'
        ).join('')+
      '</table>'+
    '</div>';
  } else {
    html += '<div class="card"><div class="empty">İade kaydı bulunmamaktadır.</div></div>';
  }
  
  return html;
}

let chartRef=null;
function drawReportChart(){
  const canvas = document.getElementById('repChart');
  if(!canvas || typeof Chart==='undefined') return;
  const days = ui.sub==='gunluk'?7:(ui.sub==='haftalik'?8:12);
  const unit = ui.sub==='aylik'?'month':(ui.sub==='haftalik'?'week':'day');
  const labels=[], data=[];
  for(let i=days-1;i>=0;i--){
    let from,to,label;
    if(unit==='day'){ from=new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-i); to=new Date(from); to.setDate(to.getDate()+1); label=from.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}); }
    else if(unit==='week'){ from=new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-i*7); to=new Date(from); to.setDate(to.getDate()+7); label='Hafta '+(days-i); }
    else { from=new Date(); from.setDate(1); from.setHours(0,0,0,0); from.setMonth(from.getMonth()-i); to=new Date(from); to.setMonth(to.getMonth()+1); label=from.toLocaleDateString('tr-TR',{month:'short'}); }
    const sum = state.orders.filter(o=>{const d=new Date(o.date); return d>=from && d<to && o.status!=='İptal Edildi';}).reduce((s,o)=>s+o.total,0);
    labels.push(label); data.push(sum);
  }
  if(chartRef) chartRef.destroy();
  chartRef = new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{labels, datasets:[{label:'Ciro (₺)', data, backgroundColor:'#ff7a3d'}]},
    options:{animation:{duration:0}, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}
  });
}

function drawReportPieChart(){
  const canvas = document.getElementById('repPieChart');
  if(!canvas || typeof Chart==='undefined') return;
  
  // Tarih aralığı hesapla
  let list = [];
  if(ui.reportStartDate && ui.reportEndDate){
    const start = new Date(ui.reportStartDate);
    const end = new Date(ui.reportEndDate);
    end.setDate(end.getDate() + 1);
    list = state.orders.filter(o => {
      const oDate = new Date(o.date);
      return oDate >= start && oDate < end && o.status !== 'İptal Edildi';
    });
  } else {
    const ranges = {gunluk:1, haftalik:7, aylik:30};
    const days = ranges[ui.sub];
    list = ordersInRange(days);
  }
  
  const productRevenue = list.reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+(i.qty*i.price),0),0);
  const productCost = list.reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+((i.unitCost||0)*i.qty),0),0);
  const cargoTotal = list.reduce((s,o)=>s+(o.cargoPrice||0),0);
  
  // 🎯 REKLAM MALİYETİ: Günlük Bütçe × Gün Sayısı (doğru yöntem!)
  let adTotal = 0;
  if(state.adBudget.active){
    // Seçilen aralığa kaç gün düştüğünü bul
    const uniqueDays = new Set();
    list.forEach(o => {
      uniqueDays.add(o.date.substring(0, 10)); // tarih al
    });
    const dayCount = uniqueDays.size;
    adTotal = state.adBudget.dailyAmount * dayCount;
  }
  
  const pieCtx = canvas.getContext('2d');
  if(window.reportPieChart) window.reportPieChart.destroy();
  
  window.reportPieChart = new Chart(pieCtx, {
    type: 'doughnut',
    data: {
      labels: ['Ürün Satışı', 'Ürün Maliyeti', 'Kargo Masrafı', 'Reklam Masrafı'],
      datasets: [{
        data: [productRevenue, productCost, cargoTotal, adTotal],
        backgroundColor: ['#4CAF50', '#FF9800', '#2196F3', '#9C27B0'],
        borderColor: '#fff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      animation: { duration: 0 },
      plugins: {
        legend: { position: 'bottom', labels: { padding: 15, font: { size: 12 } } }
      }
    }
  });
}

function drawStatusPieChart(){
  const canvas = document.getElementById('repStatusPie');
  if(!canvas || typeof Chart==='undefined') return;
  
  let list = [];
  if(ui.reportStartDate && ui.reportEndDate){
    const start = new Date(ui.reportStartDate);
    const end = new Date(ui.reportEndDate);
    end.setDate(end.getDate() + 1);
    list = state.orders.filter(o => {
      const oDate = new Date(o.date);
      return oDate >= start && oDate < end && o.status !== 'İptal Edildi';
    });
  } else {
    const ranges = {gunluk:1, haftalik:7, aylik:30};
    const days = ranges[ui.sub];
    list = ordersInRange(days);
  }
  
  const statusCounts = {teslim:0, yolda:0, iade:0, diger:0};
  list.forEach(o => {
    if(o.status === 'Teslim Edildi') statusCounts.teslim++;
    else if(o.status === 'Kargoya Verildi') statusCounts.yolda++;
    else if(o.status === 'İade Edildi') statusCounts.iade++;
    else statusCounts.diger++;
  });
  
  const ctx = canvas.getContext('2d');
  if(window.statusPieChart) window.statusPieChart.destroy();
  
  window.statusPieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Teslim', 'Yolda', 'İade', 'Diğer'],
      datasets: [{
        data: [statusCounts.teslim, statusCounts.yolda, statusCounts.iade, statusCounts.diger],
        backgroundColor: ['#10B981', '#F59E0B', '#EF4444', '#9CA3AF'],
        borderColor: '#fff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: false,
      maintainAspectRatio: true,
      animation: { duration: 0 },
      plugins: { legend: { display: false } }
    }
  });
}

function toggleCargoDelivery(orderId, isChecked){

  renderMain();
}

function exportArasGonderiListesi(){
  const bekleyenSiparisler = state.orders.filter(o => o.status === 'Yeni' || o.status === 'Hazırlanıyor');
  
  if(bekleyenSiparisler.length === 0){
    toast('❌ Kargoya verilecek bekleyen sipariş yok!');
    return;
  }
  
  const rows = bekleyenSiparisler.map(o => {
    const c = state.customers.find(x => x.id === o.customerId);
    const urunAdi = o.items.map(i => i.name + (i.color && i.color!=='-' ? ' ('+i.color+(i.size&&i.size!=='-'?'/'+i.size:'')+')' : '')).join(', ');
    const toplamAdet = o.items.reduce((s,i) => s + (i.qty||1), 0);
    
    return {
      'İSİM': c ? c.name : '',
      'İLÇE': c ? (c.district||'') : '',
      'İL': c ? (c.city||'') : '',
      'ADERES': c ? (c.address||'') : '',
      'TELEFON': c ? (c.phone||'') : '',
      'KURYE': '',
      'MUŞ BARKOD': o.barcode || '',

      'ÜRÜN ADI': urunAdi,
      'ADET': toplamAdet,
      'DESİ': '',
      'AMBALAJ': '',
      'TAHSİLAT': o.total,
      'ödeme': '',
      'KDV': '',
      'SİPARİŞ NO': o.orderNo,
      'PTT VEYA UPS VEYA ARAS BARKOD': o.tracking || '',
      'PLASİYER': ''
    };
  });
  
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);

  XLSX.writeFile(wb, 'aras-gonderi-listesi-'+new Date().toLocaleDateString('tr-TR').replace(/\./g,'-')+'.xlsx');
  
  toast('✅ '+bekleyenSiparisler.length+' siparişlik gönderi listesi indirildi!');
}
